[[feature]]
id = "AV2-7.23-REFERENCE-FRAME-UPDATE"
name = "Reference frame update process"
category = "normative"
kind = "bitstream-semantics"
spec_sections = ["7.23", "6.17.2"]
sources = ["docs/spec/av2/1.0.0/07-decoding-process.md#s-7-23", "docs/spec/av2/1.0.0/05-syntax-structures.md#s-5-18-2", "docs/spec/av2/1.0.0/06-syntax-structures-semantics.md#s-6-17-2"]
crate = "splot-validate"
module = "crates/splot-validate/src/reference_state.rs"
openspec_change = "frame-reference-state-model"
tracking_issue = ""
owner = "validator"
risk = "high"
notes = "The §7.23 reference-frame buffer state is now MODELED for intra streams (frame-reference-state-model), replacing the always-unknown FrameReferenceStateView placeholder. A per-extended-layer ReferenceStateTracker (crates/splot-validate/src/reference_state.rs) holds NUM_REF_FRAMES (16, §3 mirror docs/spec/av2/1.0.0/03-symbols.md :607) slots, each Unknown / ProvenInvalid / Valid{RefOrderHint, RefFrameWidth, RefFrameHeight}. The buffer is scoped per extended layer (obu_xlayer_id) to match the §7.3.6 CVS / CELU keying — the granularity at which a CLK starts a new coded video sequence and resets the reference buffers. UPDATE SEMANTICS (mirror docs/spec/av2/1.0.0/07-decoding-process.md#s-7-23 :14095-14124): for each set bit i of refresh_frame_flags, slot i stores the frame's facts and RefValid[i] = (FrameType == KEY_FRAME || FrameType == SWITCH_FRAME) ? first : 1 where first is 1 only for the lowest refreshed slot (so a key/switch frame leaves only its lowest refreshed slot valid). UPDATE POINT: §7.23 runs at decode_frame_wrapup AFTER the frame is decoded, so each frame's update is DEFERRED in ValidatorContext::pending_ref_update and committed at the NEXT frame's coded-frame boundary (the segmenter-authoritative FrameBoundary::OpensNewUnit, with the no-trailing-delimiter end-of-bitstream flush in finish()) — a later frame's reference checks see the earlier frame's updates, matching the spec ordering. A FrameBoundary::ContinuesUnit (non-first tile group of the same coded frame) does not re-update. RESETS: a CLK at FirstPictureInTU (OBU_CLOSED_LOOP_KEY && startCVS) clears RefValid[i] = 0 over 0..NumRefFrames (§5.18.2 mirror docs/spec/av2/1.0.0/05-syntax-structures.md#s-5-18-2 :4449-4455) then applies its allFrames refresh (max_mlayer_id == 0, mirror :4431-4433) per §7.23 — so after a CLK only slot 0 is Valid, the rest ProvenInvalid. A mid-stream join (validator starts at a random access point) begins all-Unknown until the first grounded reset (sound under-approximation: an unestablished slot is never PROVEN invalid). HONEST POISONING: a frame whose refresh mask is not parsed (inter / TIP / bridge / truncated / Unknown-classed frame, or an ambiguous coded-frame boundary) poisons ALL slots to Unknown — the unknown mask could refresh any slot; per-slot Unknown is the resting state, never a guess. SEF: refresh_frame_flags = 0 (§5.18.2 :4180) so a show-existing-frame updates NO slot, but it DISPLAYS frame_to_show_map_idx, making RefValid[ frame_to_show_map_idx ] checkable. DIAGNOSTIC: frame-header/show-existing-frame-invalid-slot (§6.17.2) fires when the modeled buffer PROVES RefValid[ frame_to_show_map_idx ] == 0; a poisoned (Unknown) slot drops to silence (the Unknown invariant). The check runs only when the frame's core resolved against its active sequence header. No external-HLS suppression: reference-frame buffers are written only in-band by the §7.23 process, so the modeled state is always validator-derived. THREADING: the modeled FrameReferenceStateView (via the new FrameReferenceStateView::from_slots constructor) is threaded into the validator's core parse (frame_core_against_referenced_header) — this is FORWARD PLUMBING for the §5.18 INTER reference paths (explicit reference map, frame_size_with_refs, primary-ref), which are not yet parsed: no §5.18 INTRA branch consumes reference_state today, so the threading has no behavioral effect on the intra path (verified: only FrameReferenceStateView's fields/input are read in splot-core, no parse branch). The inspector keeps unknown() by design (no cross-OBU state). RESIDUALS (keeps validate/decode_check partial): the §5.18 inter reference-path CONSUMERS of the modeled state (explicit_ref_frame_map / ref_frame_idx RefValid checks §6.17.2 :4605-4607, frame_size_with_refs, primary_ref_frame range, use_bru OrderHint/dim constraints §6.17.2 :4587-4596) await inter-path parsing (AV2-5.18.2-FRAME-HEADER-INFO inter path); the §7.3.9 long-term reference availability is its own row (AV2-7.3.9-LONG-TERM-REFERENCE-AVAILABILITY) and now consumes the per-slot RefLongTermId this model tracks: reference-state-and-random-access extends SlotFacts with long_term_id (RefLongTermId[i] = LongTermId, §7.23 mirror :14113), grounded from a KEY frame's long_term_id_plus_1 - 1 (-1 sentinel otherwise) and queried via slot_long_term_id (Some only for a PROVEN-valid slot); the §7.23 motion-vector / CDF / grain / CCSO / segment-id stores remain out of scope for the validator's reference-state checks; the §6.17.2 derive_sef_order_hint already-shown / RefImplicitOutputFrame / RefImmediateOutputFrame SEF constraints (mirror docs/spec/av2/1.0.0/06-syntax-structures-semantics.md#s-6-17-2 :4375-4380) need output-frame-buffer / shown state this phase does not model."

