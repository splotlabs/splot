    "docs/spec/av2/1.0.0/07-decoding-process.md#s-7-12-2-6",
    "docs/spec/av2/1.0.0/07-decoding-process.md#s-7-12-2-21",
]
crate = "splot-decode"
module = "crates/splot-decode/src/prediction/inter/block/resolve.rs"
change_id = "decode-intrabc-ref-mv-bank-sb-lifetime"
owner = "decoder"
risk = "medium"
notes = "IntrABC entropy parsing captures spatial probe coordinates and availability; the ordered motion pass resolves their values, publishes the BV, and updates the shared tagged RefMvBank. Intra-only frames clear the bank per effective superblock row without seeding. For sequence superblocks of 256 samples, intra-only IntrABC uses a 128-sample boundary consistently for bank lifetime, spatial scans, default BVPs, and entropy contexts; inter frames retain sequence geometry. The external mission stream supplies the list-8 eviction oracle that AVMenc controls cannot isolate."

