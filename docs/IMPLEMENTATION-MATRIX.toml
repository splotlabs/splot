notes = "Malformed data must return errors/reports, never panic. Four fuzz targets cover every public byte-consuming entry point: parse_obu (read_leb128 / read_obu_header / parse_annex_b_obus), parse_ivf (is_ivf / parse_ivf_header / parse_ivf_partial), parse_bitstream (parse_bitstream_partial container auto-detect + Annex-B/IVF envelope parsing; OBU payload parsers are reached via validate_bytes, not this target), and validate_bytes (Validator::validate_bytes_with_options, which transitively reaches every OBU payload parser, both container formats, and every validator check). Stable-toolchain proptests cover the same invariant in CI (splot-core parser modules plus crates/splot-validate/tests/validator_never_panics.rs); CI also runs a blocking per-target fuzz smoke (~45s each) on every PR (.github/workflows/ci.yml fuzz-smoke), and cargo-fuzz still needs nightly to run locally. The cargo-fuzz corpus (fuzz/corpus) is gitignored and not committed, so it is not listed as proof. parse and validate are done: every parser surface and the validator are now fuzz-reachable and proptest-covered on stable. decode_check stays partial: the no-panic work hardens robustness but does not expand what the inspector/validator can check for conformance, which is what this stage tracks."

