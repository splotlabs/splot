[[feature]]
id = "AV2-7.3.7-TEMPORAL-UNIT-ORDER"
name = "Temporal unit OBU order"
category = "normative"
kind = "bitstream-semantics"
spec_sections = ["7.3.7", "7.4.6"]
sources = ["https://av2.aomedia.org/v1.0.0/index.html"]
crate = "splot-validate"
module = "crates/splot-validate/src/context"
openspec_change = "celu-orderhint-constraints"
tracking_issue = ""
owner = "validator"
risk = "high"
notes = "Temporal unit state machine: global temporal delimiter, HLS prefix OBUs, coded extended layer units in ascending xlayer order, and padding exceptions. The two formerly-backlogged §7.3.7/§7.3.6 ordering rows landed under frame-unit-segmentation, now decidable from the segmentation: obu-order/global-hls-after-metadata-suffix (a global HLS prefix OBU after a global suffix metadata, classified now that metadata_is_suffix is parsed in TemporalUnitState::observe_metadata) and obu-order/non-global-hls-before-coded-layer (a non-global HLS header OBU — LCR/OPS/atlas/sequence header — after the coded frame region of its §7.3.6 coded extended layer unit has begun). The §7.3.7 / §7.4.6 display-order-hint (DOH) constraints (mirror docs/spec/av2/1.0.0/07-decoding-process.md#s-7-3-7 lines 650-657, #s-7-4-6 lines 1316-1320) landed under celu-orderhint-constraints in the CodedExtendedLayerTracker (crates/splot-validate/src/celu.rs): when the temporal unit's recorded DOH constraint flag is active (multistream_doh_constraint_flag of the preceding MSDO, or lcr_doh_constraint_flag of the activated global LCR, == 1 — resolved by ValidatorContext::doh_constraint_flag_active at temporal-unit-boundary completion), all frame units in the temporal unit must share one OrderHintBits (celu/doh-order-hint-bits-mismatch, the bits read from the active sequence header's order_hint_bits per frame) and coded output frame units present in multiple CELUs of the temporal unit must share one OrderHint (celu/doh-order-hint-mismatch). Both stay silent with the flag off and drop their judgment when the bits / OrderHint is undecidable (the Unknown invariant). OrderHintBits stale-guard (codex round-3 F4): a frame contributes its OrderHintBits only when its referenced sequence header resolved to the active header it parsed against (the same frame_core_against_referenced_header resolution that gates the output class — facts AND bits now come from ONE parse + resolution in frame_celu_facts, removing the former double parse); a frame referencing an absent / stale header contributes None (which sets bits_undecidable and so also gates the cross-CELU OrderHint comparison) rather than the stale active header's order_hint_bits, which could otherwise false-positive celu/doh-order-hint-bits-mismatch. OrderHintBits is fed per frame UNIT, not per OBU (codex round-4 F1): the ValidatorContext::observe_obu CELU wiring notes the accumulator on the segmenter's FrameBoundary — OpensNewUnit notes the unit's resolved bits (Some, or None when its opener does not resolve, since an unresolved opener still soundly poisons the unit's unknowable bits), Ambiguous notes None (it might open a unit with unknowable bits), and ContinuesUnit (a non-first tile group of an already-counted coded frame, which parses no core and contributes None) is SKIPPED. The former per-OBU feeding let a continuation's None set bits_undecidable and poison the whole temporal unit's same-OrderHintBits judgment, over-suppressing a real bits mismatch on a frame split across first + non-first tile groups; the per-unit feeding makes only the unit's opener contribute, so a genuine cross-unit OrderHintBits disagreement now fires. Global frame-bearing OBUs are excluded before the accumulator (codex round-5 F3): the observe_obu wiring now applies the same non-global guard (obu_xlayer_id != GLOBAL_XLAYER_ID) that the CodedExtendedLayerTracker::observe filter uses, BEFORE feeding note_order_hint_bits — where the former wiring fed it unconditionally. A frame-bearing OBU at GLOBAL_XLAYER_ID is itself invalid (diagnosed by obu-header/global-xlayer-allowed-types) and is not part of any CELU (§7.3.6), so no sequence header is active for xlayer 31 and it resolved no bits; the former path fed a spurious None that set bits_undecidable and suppressed a real cross-CELU bits mismatch between the valid CELUs in the temporal unit. The global OBU keeps its own obu-header diagnostic. DOH flag governing-window sampling (codex round-5 F1): ValidatorContext::doh_constraint_flag_active_for_completed_tu resolves the lcr_doh_constraint_flag side against the CMVS window that CONTAINS the just-completed temporal unit, captured BEFORE CmvsTracker::complete_temporal_unit applies the unit's §7.3.2 begin/end conditions and mutates the live window. Per §7.3.7 the DOH constraints apply 'for each temporal unit in the coded multistream video sequence'; a CLK boundary temporal unit with no MSDO and no activated global LCR ENDS the CMVS (§7.3.2 end condition 2) and is the LAST temporal unit of the ENDING CMVS, so its governing window is the pre-completion start — the former code sampled the flag against the live window the tracker had just Closed to None, reading the LCR flag false and skipping the §7.3.7 checks for that unit (a false negative). The governing window is the post-completion window when Some (the unit BEGAN a new CMVS and is the first unit of it), else the pre-completion window (Close); the MSDO side is window-independent (live last-wins msdo_substream_max, which complete_temporal_unit does not clear, so it already reflects the preceding MSDO that governed the completed unit). Named residual (OrderHint LSB proxy, celu-orderhint-constraints follow-up): celu/doh-order-hint-mismatch compares the raw order_hint LSB syntax as a proxy for the §7.3.7 DECODED OrderHint (get_disp_order_hint's MSB extension for non-CLK frames); ACROSS CELUs the proxy is UNSOUND when the participating layers' OrderHintBits differ (equal decoded OrderHints can carry different-width LSB encodings -> a false positive), so the cross-CELU comparison is gated on the temporal unit's OrderHintBits being KNOWN and EQUAL — when they differ celu/doh-order-hint-bits-mismatch fires and the OrderHint comparison drops. The decoded-OrderHint comparison itself stays blocked on reference-state modelling / get_disp_order_hint (AV2-5.18.2-FRAME-HEADER-INFO). Two-constraint per-pair bits gating (codex round-6 F2): §7.3.7 imposes TWO independent constraints — (1) ALL frame units in the temporal unit share one OrderHintBits (celu/doh-order-hint-bits-mismatch, over every frame unit) and (2) coded OUTPUT frame units in multiple CELUs share one OrderHint (celu/doh-order-hint-mismatch). The cross-CELU OrderHint comparison (2) is now gated PER COMPARED PAIR on the two output CELUs' OWN OrderHintBits being known and equal — the per-output-unit bits are carried alongside each output-unit OrderHint sample (FrameFacts::order_hint_bits, populated from the same frame_celu_facts resolution), NOT taken from constraint (1)'s temporal-unit-wide bits_undecidable / bits_mismatch judgment. The former code gated (2) on the TU-wide same-bits judgment, so an unknown-bits NON-OUTPUT (or otherwise unrelated) frame unit elsewhere in the temporal unit set bits_undecidable and SILENTLY suppressed a decidable (2) mismatch between two output CELUs whose own bits were known and equal (a false negative). Now (1) still drops on any unknown-bits frame unit, while (2) fires from the compared output units' own bits; when a compared pair's bits are known but UNEQUAL, (1) fires the bits-mismatch and (2) drops for that pair (unsound cross-width proxy). Per-bits grouping of the cross-CELU comparison (codex round-8 F3): to realise the per-pair equal-bits gate across ALL output CELUs (not only against the very first sample), output-CELU OrderHint samples are now GROUPED BY their known OrderHintBits value (DohTuAccumulator::output_order_hint_by_bits) and each is compared to its OWN group's representative (the group's first decidable sample) rather than to a single first_output_order_hint. The former single-representative scheme missed a proven WITHIN-GROUP mismatch when the first sample had different bits: samples (OrderHintBits, OrderHint) = (4, 0), (5, 1), (5, 2) left both (5, *) samples failing the equal-bits gate against the (4, 0) representative, so the (5, 1)/(5, 2) mismatch was silently dropped; grouping records it (celu/doh-order-hint-mismatch fires while the 4 != 5 width difference also fires constraint (1) celu/doh-order-hint-bits-mismatch). An unknown-bits output sample stays out of all groups; a known-but-unequal-bits pair lands in different groups and is never compared by (2) (covered by (1) instead); one diagnostic is emitted per temporal unit (the first within-group disagreement found), anchored at the offending later sample. End-of-bitstream governing-window symmetry (codex round-6 F1): the round-5 internal-boundary DOH-flag governing-window capture is now mirrored at the END OF THE BITSTREAM. ValidatorContext::finish captures the CMVS window before the end-of-stream CmvsTracker::complete_temporal_unit applies the final unit's §7.3.2 begin/end conditions and clears the live window, and samples the flag via doh_constraint_flag_active_for_completed_tu (the same governing-window helper the temporal-delimiter path uses) instead of the live-window doh_constraint_flag_active. The final temporal unit has no trailing temporal delimiter, so it is completed by finish; a CLK final unit with no MSDO and no activated global LCR ENDS the CMVS at EOF (§7.3.2 end conditions 2 and 3) and is the LAST temporal unit of the ending CMVS, governed by that CMVS's activated global LCR — the former finish path read the flag against the live window finish had just Closed to None (a false negative on the last CELU/doh check). The now-unused doh_constraint_flag_active helper was removed (both the internal-boundary and EOF paths use the governing-window form). Residual: the in-unit metadata-suffix placement WITHIN a coded frame unit and the frame-unit segmentation details proper are owned by AV2-7.3.3-CODED-OUTPUT-FRAME-UNIT / AV2-7.3.4-CODED-NONOUTPUT-FRAME-UNIT / AV2-7.3.5-CODED-FRAME-UNIT (frame_unit.rs)."

