notes = "Child row of AV2-5.18-FRAME-HEADER. deblocking_filter_params() (§5.18.5.2) is typed and parsed on the intra frame-header path under frame-filtering-deblocking-gdf-cdef: apply_deblocking_filter[0..4] (NumPlanes-gated chroma pair), df_delta_q_present[i], and the derived DfDeltaQ[i] (df_delta_q[i] - (1 << (dfParBits-1)) with the (i==1)?DfDeltaQ[0]:0 / outer-else-0 inferences), where dfParBits = df_par_bits_minus_2 + 2 (§5.4.10). The in-tree sequence parser reads df_par_bits_minus_2 as f(2) (0..=3), but a direct/fuzz caller is not bound by that read; since the DfDeltaQ derivation shifts 1 << (dfParBits-1) and df_delta_q[i] is f(dfParBits), the parser rejects an out-of-range width with a structured Error::BitWidthTooLarge before the shift (dfParBits > 32) rather than panicking in debug (workspace no-reachable-panic rule). The deblocking never-panics proptest is widened to the full u8 df_par_bits_minus_2 range. The cur_mfh_id > 0 arm consults the resolved MultiFrameHeaderRecord's mfh_deblocking_filter_update / mfh_apply_deblocking_filter (§5.7, mirror :5949): when the update bit is set apply is copied from the MFH with no apply bits read; otherwise apply[0]/[1] (and the chroma pair) are read from the frame. CodedLossless short-circuits to all-0 apply (no bits). §6.17.5.2 states no requirement of bitstream conformance on these fields (all bounded by fixed widths), so no diagnostic is added. Under frame-header-inter-reference-paths §5.18.5.1 read_interpolation_filter() now LANDS (read_interpolation_filter, InterpolationFilter, filtering.rs): is_filter_switchable f(1) selects SWITCHABLE, else interpolation_filter f(2) names the fixed filter (EIGHTTAP / EIGHTTAP_SMOOTH / EIGHTTAP_SHARP / BILINEAR); it is parsed on the inter MV-precision block (mirror :4919) and surfaced on core.inter.interpolation_filter. Residual: the inter allow_df_sub_pu / apply_deblocking_filter_tip reads (mirror :4953-4967) live on the TIP_FRAME_AS_OUTPUT arm, which the inter path stops before (InterStop::TipAsOutputReturn) because that arm reads quantization_params() / tile_info() against reference-frame dims this phase does not thread; they land when the TIP-output arm completes."

