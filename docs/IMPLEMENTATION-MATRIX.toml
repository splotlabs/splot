notes = "Full syntax parsed; the §6.6 layer-id (obu_tlayer_id/obu_mlayer_id == 0, obu_xlayer_id == GLOBAL_XLAYER_ID) and num_streams_minus_2 <= 2 checks are enforced (docs/spec/av2/1.0.0/06-syntax-structures-semantics.md#s-6-6, lines 1330-1337; msdo/non-global-layer-id, msdo/too-many-streams). The msdo-substream-constraint-checks change landed the remaining §6.6 conformance sentences and the §7.3.8.2 non-RAP identity rule, all from already-parsed state. (a) The §6.6 sub-stream PTL floors/ceilings: locally-decidable multistream_profile_idc >= sub_stream_max_profile[i] for all i (line 1347; msdo/profile-below-substream-max) and a reserved multistream_profile_idc (lines 1339-1341 bind its value space to seq_profile_idc / Annex A.2 Table A.1 — the spec's 'Table A.4' is an erratum; annex-a/profile-reserved); plus the cross-OBU seq_profile_idc <= sub_stream_max_profile[i] / seq_level_idx <= sub_stream_max_level[i] / seq_tier <= sub_stream_max_tier[i] for each sequence header activated by sub-stream i (lines 1362-1378; msdo/substream-profile-exceeds-max / -level- / -tier-), evaluated on §5.18.2 frame-confirmed activation against the recorded sub_xlayer_id[i]->ceiling map in both arrival orders (MSDO-then-activation and activation-then-MSDO), suppressed under ExternalHlsMode::Provided(declares a sequence header), deduped by (xlayer, seq_header_id, cvs_epoch, ceiling, value-space fingerprint). (b) The monotonic_output_order_flag==0 => multistream_doh_constraint_flag==1 rule (lines 1391-1393; msdo/doh-constraint-required), gated on CmvsState::Inside exactly like the §6.4.1 monotonic agreement check, both arrival orders. (c) §7.3.8.2 non-RAP identity (line 716; msdo/non-rap-not-identical): the §7.4.1 random-access-point definition (a TU containing CLK/OLK/RAS) is OBU-type-detectable from raw headers — NOT frame-header-activation-blocked, correcting the earlier note — so each TU's MSDO payload fingerprint is buffered and, at TU end (including the end-of-stream flush), a non-RAP