notes = "Active sequence lookup by xlayer, the repeated-identical (bit-fingerprint) check (normative home: the §7.3.6 bit-identity rule, tracked by AV2-7.3.6-CODED-EXTENDED-LAYER-UNIT; §7.3.8.6 only cross-references it), an in-band sequence-header + multi-frame-header availability store, the multi-frame-header -> sequence-header reference check (mfh_seq_header_id), and the generic frame-header reference checks (seq_header_id_in_frame_header and cur_mfh_id) are implemented, with caller-provided external HLS via ValidationOptions (default disabled; external MFH/LCR/atlas are future). Layer-configuration-record availability (§7.3.8.3: local->global LCR and sequence-header seq_lcr_id resolution incl. lcr_xlayer_map membership) and local atlas-segment availability (§7.3.8.4) are now modeled; the global atlas (§7.3.8.4 'can be available') is not flagged. The §7.3.8.1 random-access-point availability replay landed under rap-availability-replay (hls/unavailable-at-random-access-point): a RapReplayTracker records each HLS object's in-band (re)send EVENTS (temporal unit, sending extended layer, and whether that unit later proved leading) and buffers each linearly-resolved reference (sequence header via frame seq_header_id_in_frame_header and MFH mfh_seq_header_id; multi-frame header via frame cur_mfh_id; operating point set via BRT br_ops_id; global/local layer configuration record via local-LCR lcr_global_id and sequence-header seq_lcr_id; local atlas segment via LCR lcr_local_atlas_id), then at temporal-unit completion — when the unit's §7.4.1 random-access-point-ness (CLK/OLK/RAS) and leading-frame-ness (OBU_LEADING_* type-detectable) are known — fires when a reference governed by its anchor R (the reference's governing layer's most recent random access point, or the any-layer anchor for a global reference) has no (re)send that is VISIBLE-under-start-at-R (mirror lines 685-693). The qualification is ANCHOR-RELATIVE, not a single global last-good state: a (re)send S is visible iff (a) S's temporal unit == R, or (b) S's temporal unit > R AND that unit carries no leading frame in any layer (§7.3.8.1 drops whole leading temporal units) AND (c) §7.4.6 sender-decodability — S's sending layer is GLOBAL, or had a random access point in the closed interval [R, S's temporal unit] (so its coded extended layer units are decoded by then). A reference whose own temporal unit drops under start-at-R (a strictly-post-R unit carrying any leading frame, for a global referencing OBU as for a frame-bearing one) is moot (no diagnostic). (Replaces the cycle-1/2 single last_good_resend_tu scalar, which mis-promoted a (re)send in a mixed leading/random-access temporal unit for all later anchors and mis-suppressed global references in dropped leading temporal units — Codex cycle-3 findings 1-4.) The replay predicate is disjoint from the linear hls/unavailable-* checks (only linearly-available references are buffered) and from the §7.3.6 bit-identity check; a strictly-post-anchor (re)send in a leading temporal unit is not visible (the whole unit drops), an undecidable (non-LEADING_*) leading frame leaves the unit visible (sound under-approximation), a reference whose own (strictly-post-anchor) temporal unit carries any leading frame is moot (the whole unit drops — global referencing OBUs included), and dedup is per (object, random access point). External-HLS suppression is PER REFERENCED KEY (not a blanket whole-replay suppression): for an externally-declarable kind — sequence headers (ExternalHlsSet::with_sequence_header_id) and operating point sets (with_operating_point_set) — a replay finding is suppressed only when the EXACT referenced key is declared external (a Provided set that omits the key asserts it is not external, so an in-band-only object dangling at a random access point still fires); for a kind ExternalHlsSet cannot express — multi-frame headers, LCRs, atlas segments — any Provided mode keeps the blanket suppression, since such an OBU MAY exist externally unenumerated (the external-means escape: externally-provided HLS remains available until superseded). The default Disabled mode lets every replay fire. LCR (§7.3.8.3: local->global lcr_global_id and sequence-header seq_lcr_id) and local-atlas (§7.3.8.4: lcr_local_atlas_id) references ARE now replayed anchor-relative (global LCR sends are GLOBAL_XLAYER_ID-keyed, local LCR/atlas sends carry their own extended layer); the global atlas stays excluded (§7.3.8.4 'can be available' is permissive). Residuals: the §7.3.8.1 random-access-point REPLAY of film-grain (apply_grain/fgm_id) and quantization-matrix (using_qmatrix/qm_*) frame references is not yet wired (no RapHlsKey for them — the per-anchor visibility predicate awaits a film-grain/QM replay key). The LINEAR §6.17.10.1/§7.3.8.8 film-grain availability check DID land (codex round, frame-header/film-grain-model-unavailable on AV2-5.18.10-FILM-GRAIN-STRUCTURES): when apply_grain == 1 and the referenced fgm_id slot has no in-band received model, it fires under ExternalHlsMode::Disabled only (ExternalHlsSet cannot express film grain, so any Provided mode suppresses). That linear check under-reports the RAP-unavailability direction (monotonic available[] never resets at a RAP), which is exactly this replay residual; the QM linear availability side and the §6.17.10.1 fgm layer-dependency constraints remain future; §7.4.4's leading-temporal-unit content-identity divergence (a post-leading regular frame referencing an HLS object redefined in a leading temporal unit is non-conformant even though the object is AVAILABLE at the random access point — the anchor-relative availability check correctly stays silent because a valid random-access-point version is visible) is a documented residual, not a diagnostic: detecting it needs per-resend content identity plus post-leading reference tracking and would otherwise risk a false positive on an identical leading re-send (Codex cycle-3 finding 4 spec decision);the §7.3.8.2 first-sentence MSDO-availability-at-RAP is interop-point-gated (see AV2-5.6-MSDO) and not landed as an error; the ExternalHlsSet MFH/LCR/atlas declaration keys stay a named non-goal (partial-declaration policy already covers the escape conservatively). The MFH layer-dependency constraints (§7.3.8.7, concrete predicate §6.17.2) are enforced at the frame-header cur_mfh_id reference against the loaded in-band sequence header's §5.4.1 maps (frame-header/mfh-mlayer-dependency-missing, frame-header/mfh-tlayer-dependency-missing; diagnostics recorded on AV2-5.7-MULTI-FRAME-HEADER). The validator also records per-level quantizer-matrix availability (AV2-5.13-QUANTIZATION-MATRIX) and per-slot film-grain availability (AV2-5.14-FILM-GRAIN); the frame film-grain reference check (apply_grain/fgm_id FilmGrainPresent[ fgm_id ] == 1) now consumes the per-slot state (frame-header/film-grain-model-unavailable; see above), while the frame quantization reference check (using_qmatrix/qm_* availability) remains future. The §7.3.6 single-active-sequence-header rule landed under sequence-multistream-semantics as hls/multiple-active-sequence-headers: it fires when a §5.18.2 frame-confirmed activation of a different seq_header_id follows an earlier frame-confirmed activation within the same coded video sequence (no intervening CLK), suppressed only when caller-provided external HLS declares at least one sequence header (declares_any_sequence_header(); an empty or sequence-free external set cannot supply an out-of-band active header and does not suppress, matching the sibling gates) (the normative sentence lives in §7.3.6, cited on AV2-7.3.6-CODED-EXTENDED-LAYER-UNIT)."

