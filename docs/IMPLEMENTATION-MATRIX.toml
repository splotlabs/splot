notes = "Active sequence lookup by xlayer, the repeated-identical (bit-fingerprint) check (normative home: the §7.3.6 bit-identity rule, tracked by AV2-7.3.6-CODED-EXTENDED-LAYER-UNIT; §7.3.8.6 only cross-references it), an in-band sequence-header + multi-frame-header availability store, the multi-frame-header -> sequence-header reference check (mfh_seq_header_id), and the generic frame-header reference checks (seq_header_id_in_frame_header and cur_mfh_id) are implemented, with caller-provided external HLS via ValidationOptions (default disabled; external MFH/LCR/atlas are future). Layer-configuration-record availability (§7.3.8.3: local->global LCR and sequence-header seq_lcr_id resolution incl. lcr_xlayer_map membership) and local atlas-segment availability (§7.3.8.4) are now modeled; the global atlas (can be available) is not flagged. Availability is kept monotonic; the §7.3.8.1 resend-at-RAP requirement and MSDO/OPS reference paths remain bounded. The MFH layer-dependency constraints (§7.3.8.7, concrete predicate §6.17.2) are enforced at the frame-header cur_mfh_id reference against the loaded in-band sequence header's §5.4.1 maps (frame-header/mfh-mlayer-dependency-missing, frame-header/mfh-tlayer-dependency-missing; diagnostics recorded on AV2-5.7-MULTI-FRAME-HEADER). The validator also records per-level quantizer-matrix availability (AV2-5.13-QUANTIZATION-MATRIX) and per-slot film-grain availability (AV2-5.14-FILM-GRAIN) as foundation; the corresponding frame quantization/film-grain reference checks (using_qmatrix/qm_* and apply_grain/fgm_id) remain future until the frame header is parsed. The §7.3.6 single-active-sequence-header rule landed under sequence-multistream-semantics as hls/multiple-active-sequence-headers: it fires when a §5.18.2 frame-confirmed activation of a different seq_header_id follows an earlier frame-confirmed activation within the same coded video sequence (no intervening CLK), suppressed only when caller-provided external HLS declares at least one sequence header (declares_any_sequence_header(); an empty or sequence-free external set cannot supply an out-of-band active header and does not suppress, matching the sibling gates) (the normative sentence lives in §7.3.6, cited on AV2-7.3.6-CODED-EXTENDED-LAYER-UNIT)."

