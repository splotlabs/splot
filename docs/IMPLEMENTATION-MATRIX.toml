[[feature]]
id = "AV2-5.18.2-FRAME-HEADER-INFO"
name = "Frame header info syntax"
category = "normative"
kind = "bitstream-syntax"
spec_sections = ["5.18.2", "6.17.2"]
sources = ["docs/spec/av2/1.0.0/05-syntax-structures.md#s-5-18-2", "docs/spec/av2/1.0.0/06-syntax-structures-semantics.md#s-6-17-2"]
crate = "splot-core"
module = "crates/splot-core/src/headers/frame/info.rs"
openspec_change = "frame-header-inter-reference-paths"
tracking_issue = ""
owner = "core"
risk = "high"
notes = "Child row of AV2-5.18-FRAME-HEADER. State-aware core parser (FrameHeaderParseMode::Core) over the control region: derived frame-kind flags, bridge_frame_ref_idx, the single-picture / show-existing-frame branch, frame-type determination, long-term id, output-control flags, order_hint, and refresh_frame_flags. Under mfh-frame-header-state the two cur_mfh_id > 0 stops that previously fired purely for missing MFH state are removed: with the resolved MultiFrameHeaderRecord threaded in, the intra path parses through frame_size() (AV2-5.18.4-FRAME-SIZE) and segmentation_params() (AV2-5.18.7-SEGMENTATION-TILING) on the cur_mfh_id > 0 path the same as cur_mfh_id == 0. Under frame-filtering-deblocking-gdf-cdef the intra-path stop advanced past the §5.18.2 tail loop-filter cluster — deblocking_filter_params() (AV2-5.18.5-FILTERING), gdf_params(), and cdef_params() (both AV2-5.18.7-SEGMENTATION-TILING). Under frame-loop-restoration-ccso-params the stop advanced past lr_params() (§5.18.7.11) and ccso_params() (§5.18.7.12, both AV2-5.18.7-SEGMENTATION-TILING). Under frame-header-intra-tail-completion the intra path is now PARSED TO COMPLETION: after ccso_params() the §5.18.2 tail parses read_tx_mode() (AV2-5.18.8-TRANSFORM-CODING-MODES), the no-bit frame_reference_mode()/skip_mode_params() intra inferences (same row), the no-bit allow_bawp/allow_warpmv_mode inferences, reduced_tx_set f(2), the no-bit global_motion_params() intra arm (AV2-5.18.9-GLOBAL-MOTION), and film_grain_config() (AV2-5.18.10-FILM-GRAIN-STRUCTURES), reaching the terminal IntraHeaderComplete (parse_intra_tail_structures, crates/splot-core/src/headers/frame/tail.rs). The show-existing-frame path likewise completes (ShowExistingFrameComplete) after its film_grain_config(). On the intra path NumTotalRefs == 0 (mirror :4573), so lr_params()'s temporal-prediction arm and ccso_params()'s reuse arm are dead. When an lr plane signals frame_filters_on, lr_params() reaches the unmodeled read_wienerns_filter() frame-level Wiener bank decode: the parser stops honestly with StoppedBeforeWienerNsFilter (feature_id AV2-5.18.7-SEGMENTATION-TILING), preserving the control-region and pre-Wiener facts. A payload that ends INSIDE the loop-filter cluster (deblocking through ccso) reports StoppedInsideFilterParams; a payload that ends INSIDE the §5.18.2 tail reports StoppedInsideIntraTail — both preserve the already-parsed facts and leave the unreached fields None, so the validator/inspect .ok() of the core still sees those facts. A cur_mfh_id > 0 frame whose in-band MFH is unresolvable still stops with UnsupportedUntilFeature (no guessing). Now that the intra tail, the loop-filter cluster, and the SEF film_grain_config() tail are FULLY modeled, an EOF inside them is a decidable bitstream defect: the SEF film-grain EOF reports the dedicated StoppedInsideShowExistingFrame (no longer conflating truncation with the ordinary CoreFieldsOnly bounded stop), and FrameHeaderParseStatus::is_truncated_in_modeled_region() partitions the three EOF-in-a-fully-modeled-region statuses (StoppedInsideFilterParams / StoppedInsideIntraTail / StoppedInsideShowExistingFrame) from every coverage / complete status. frame_header_core_checks surfaces that partition as frame-header/truncated-frame-header (error, §6.2.1: frame_header( ) reads the §5.18.2 mandatory syntax from the §6.2.1 OBU payload, which must contain it before the trailing bits) while preserving the facts path unchanged (the StoppedInside* core fields still feed every other diagnostic; celu / frame_unit judgments unchanged). Coverage stops (StoppedBeforeWienerNsFilter, UnsupportedUntilFeature, the MFH-unresolvable stops, CoreFieldsOnly) stay silent. The SHOW-EXISTING-FRAME OBU payload boundary IS now fully decidable (codex round): a SEF OBU is not an is_tile_group() type, so usedArith == 0 and §5.2.1 (:124-152) makes the rest of the payload exactly trailing_bits( remainingPayloadBits ) — the SEF arm of §5.18.2 (:4145) return()s right after film_grain_config() (:4186) and there is NO tile data. The core parser classifies that boundary (SefTrailingBits, recorded on core.sef_trailing_bits on the ShowExistingFrameComplete path) and the validator surfaces a non-conformant tail as frame-header/sef-trailing-bits-invalid (§6.2.3 / §6.2.1); this also catches the grain_seed-eats-the-trailing_one_bit case (a grain_seed short by its final bit consumes the marker, so no trailing_one_bit remains). film_grain_params_present (§5.4.1, read LAST in the sequence header after every child config) no longer gates the WHOLE CoreSeqView::from_sequence (codex round): it is carried as Option<bool> and the requirement is deferred to film_grain_config() consumption, so a frame against a sequence header recorded from a bounded sequence_tile_config() stop now parses its control region (frame size / output / order-hint / tile / quant / segmentation diagnostics fire) and stops honestly (UnsupportedUntilFeature, facts preserved, no guessed apply_grain) only at the grain-gated tail. Under frame-reference-state-model the FrameReferenceStateView is no longer an always-unknown placeholder: the validator now models the §7.23 per-extended-layer reference-frame buffer (AV2-7.23-REFERENCE-FRAME-UPDATE) and threads the modeled RefValid/RefOrderHint/dims into the core parse via the new FrameReferenceStateView::from_slots constructor. No §5.18 INTRA parse branch consumes reference_state today (the intra paths derive their state without it), so this is forward plumbing for the §5.18 INTER reference paths; the validator already consumes the modeled buffer directly for the §6.17.2 show-existing-frame slot check (frame-header/show-existing-frame-invalid-slot). Residuals: (1) the FIRST-tile-group header/tile-data boundary is now EXACT on the INTRA-COMPLETE path (tile-group-structure-completion): once frame_header_info() reaches IntraHeaderComplete on the intra path, use_bru/bru_inactive are the §5.18.2 derived constant 0 (mirror :4127-4129 / :4653), so AV2-5.19-TILE-GROUP's parse_tile_group_structure consumes the §5.19 tile_group_obu() remainder (tile_start_and_end_present_flag, tg_start/tg_end, byte_alignment(), headerBytes) and records the §5.20 tile_group_payload() boundary — the §5.18.2 intra tail is no longer confusable with tile data or padding for an intra-complete first tile group, and a non-zero byte_alignment() pad is flagged (tile-group/byte-alignment-zero-bit §6.2.4). The remaining first-tile-group ambiguity is narrowed to the NON-intra-complete first tile group (an inter/TIP/bridge first header, or a coverage/truncation stop), where use_bru/bru_inactive cannot be derived (BruUndecidable::NotIntraComplete) so the §5.19 structure stays unjudged; the §5.20 tile_group_payload() body itself stays unparsed (AV2-5.20-TILE-GROUP-PAYLOAD). The NON-FIRST tile-group case is PARTIALLY RESOLVED (frame-header-copy-bit-accounting): when the first tile group's frame_header_info() completed (IntraHeaderComplete), NumFrameHeaderBits is known, so a non-first tile group's frame_header(isFirst==0)==frame_header_copy() region has an EXACT header/tile-data boundary (parse_frame_header_copy consumes exactly NumFrameHeaderBits, §5.18.1) and is bit-checked against the first header (frame-header/copy-bits-mismatch §6.17.1, frame-header/copy-bits-truncated §6.2.1) before the §5.19 tile-data tail; the SEF case is the other decidable half (no tile data, sef-trailing-bits-invalid). inspect surfaces the parsed FrameHeaderParseStatus (status field), the SEF trailing-bits classification (sef_trailing_bits field), the non-first frame_header_copy() region presence (frame_header_copy view), and the §5.19 tile_group_structure view (tg range, headerBytes/payload_size boundary) for the intra-complete first tile group. (2) Under frame-header-inter-reference-paths the NON-INTRA §5.18.2 control region is now PARSED (crates/splot-core/src/headers/frame/inter.rs, InterControl): after the shared output-control flags, the inter/switch/TIP path reads frame_size_override_flag / order_hint, then the reference-control region — the primary-reference signaling (signal_primary_ref_frame, disable_cross_frame_cdf_init, primary_ref_frame f(3) / PRIMARY_REF_CHOOSE / the SWITCH/bridge PRIMARY_REF_NONE inference), bridge_frame_overwrite_flag, the inter/switch/short refresh_frame_flags arms, the explicit reference map (frame_explicit_ref_frame_map f(1), num_total_refs f(3), ref_frame_idx[i] f(CeilLog2(NumRefFrames))), the reference-grounded frame size (frame_size_with_refs() §5.18.4.3 found_ref + RefFrameWidth/Height, frame_size_with_bridge() §5.18.4.2 Min with the bridge ref dims, or the non-override default — all AV2-5.18.4-FRAME-SIZE), the BRU triple (use_bru / bru_ref f(CeilLog2(NumTotalRefs)) / bru_inactive), use_ref_frame_mvs / tmvp_sample_step_minus_1, frame_opfl_refine_type() (§5.18.3.2, AV2-5.18.3-FRAME-CONFIGURATION), screen_content_params() / intrabc_params() (§5.18.3.3/.4), the change_drl / max_drl_bits_minus_1 ns(MAX_REF_MV_STACK_SIZE-2) override, the MV-precision block (use_qtr_precision_mv / allow_high_precision_mv -> FrameMvPrecision), read_interpolation_filter() (§5.18.5.1, AV2-5.18.5-FILTERING), and frame_enabled_motion_modes[mode], converging into the shared tail (InterStop::ReachedSharedTail, mirror :5183). The parse is HONEST about reference-state dependence: a branch needing a derivation this phase does not model (get_ref_frames() for the implicit reference map, get_past_future_cur_ref_lists() for the TIP block's usesEqualWeight past/future ref counts) stops with InterStop::UnmodeledDerivation; a branch needing a slot the modeled §7.23 buffer has not proven valid (frame_size_with_refs/with_bridge dims) stops with InterStop::PoisonedReferenceState — both are COVERAGE stops (the core status is the unsupported-coverage class, NEVER a truncation), with the facts parsed before the stop preserved on core.inter. The bru_inactive / IsBridge early-return arm (mirror :4971/:5045) and the TIP_FRAME_AS_OUTPUT return arm (mirror :4945/:5177) read film_grain_config() / tile_info() against reference-frame dims this phase does not thread on those arms, so they stop at the start of that arm (InterStop::BruInactiveOrBridgeReturn / TipAsOutputReturn). The parsed ref_frame_idx feeds the §6.17.2 inter ref-idx slot-validity check (frame-header/ref-frame-idx-invalid-slot, AV2-6.17.2-FRAME-HEADER-INFO-SEMANTICS): the validator's reference_state_checks fires ONLY where the §7.23 buffer PROVES RefValid[ref_frame_idx[i]] == 0 (a CLK-invalidated, never-refreshed slot); an Unknown slot or the implicit reference map stays silent (no guessing). inspect surfaces the whole region (the inter view). Still TODO past the convergence point: the inter SHARED tail (tile_info() / quantization_params()' TIP arm / segmentation_params()' DerivedPrimaryRefFrame arm / the §5.18.8 inter coding-mode arms / §5.18.9 inter global-motion warp decode) needs inter primary-reference / TIP inputs the shared cluster does not yet accept, so the inter path stops at ReachedSharedTail rather than completing; the §5.19 BRU arms (bru_inactive trailing_bits early-return, the use_bru bru_tile_active loop, AV2-5.19-TILE-GROUP) stay blocked because they need the inter frame to COMPLETE (NumFrameHeaderBits known), which awaits the shared-tail inter inputs; the read_wienerns_filter() Wiener bank decode and the bridge-frame remainder past frame_size_with_bridge() likewise remain TODO."

