tracking_issue = ""
owner = "core"
risk = "high"
notes = "Child row of AV2-5.18-FRAME-HEADER. frame_size() (§5.18.4.1) is modeled for the explicit-override, the direct/default (cur_mfh_id == 0) path, and — under mfh-frame-header-state — the cur_mfh_id > 0 default path: FrameWidth/Height come from mfh_frame_width/height_minus_1[ cur_mfh_id ] (mirror :5767), with the §5.18.2 omitted-size inference to the sequence maxima (mirror :4101) applied when the resolved MFH carried no frame-size payload. A cur_mfh_id > 0 frame whose in-band MFH is unresolvable keeps the size unknown (no guessing). Under frame-header-inter-reference-paths frame_size_with_refs() (§5.18.4.3) and frame_size_with_bridge() (§5.18.4.2) are parsed on the inter path (crates/splot-core/src/headers/frame/inter.rs): frame_size_with_refs() reads found_ref f(1) per ref until a hit and copies RefFrameWidth/Height[ ref_frame_idx[i] ] from the modeled §7.23 buffer (falling through to the override frame_size() explicit f(n) dims on an all-miss); frame_size_with_bridge() reads bridge_frame_width/height_minus_1 f(n) then Min()s with RefFrameWidth/Height[ bridge_frame_ref_idx ]. Where a found_ref hit (or the bridge Min) lands on a slot the model has NOT proven valid, the dims are undecidable and the parser stops honestly (InterStop::PoisonedReferenceState, the found_ref / explicit-dim bits already consumed so the bit position stays correct, size left None) — a poisoned-state COVERAGE stop, never a truncation. The frame-size-vs-sequence-maximum diagnostics are split by predicate: the explicit-override §6.17.4.1 bound on the derived FrameWidth/Height emits frame-header/frame-size-exceeds-sequence-max, and the §6.17.2 bound on the referenced MFH's STORED dims (mfh_frame_width/height_minus_1[ cur_mfh_id ] <= max_frame_width/height_minus_1, mirror :4348-4349) emits the dedicated frame-header/mfh-frame-size-exceeds-sequence-max — evaluated against the resolved record's stored dims REGARDLESS of frame_size_override_flag AND of the frame-header core parse outcome (a truncated/malformed remainder still fires it, since the predicate needs only the resolved record and the sequence maxima), so an in-range override no longer hides an out-of-range MFH and a truncated frame no longer silences a decidable diagnostic. The §6.17.4.1 derived rule's no-double-fire deferral keys on the parsed PATH (frame_size_override_flag == 0 on a resolved cur_mfh_id > 0 frame, where FrameWidth/Height ARE the MFH default dims), NOT on dimension value equality: an override==1 frame that explicitly codes the same out-of-range dims the MFH stores is a separate §6.17.4.1 violation of its own frame_width/height_minus_1 fields, so both rules fire. Omitted-size MFHs (inferred maxima) and unresolvable MFHs stay silent."

