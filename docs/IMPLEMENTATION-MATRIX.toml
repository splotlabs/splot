[[feature]]
id = "AV2-5.2.1-OBU-DISPATCH"
name = "open_bitstream_unit payload dispatch"
category = "normative"
kind = "bitstream-syntax"
spec_sections = ["5.2.1"]
sources = ["https://av2.aomedia.org/v1.0.0/index.html"]
crate = "splot-core"
module = "crates/splot-core/src/obu.rs"
openspec_change = "obu-dispatch-frame-payloads"
tracking_issue = ""
owner = "core"
risk = "high"
notes = "Stateless dispatch after parsing obu_header(): temporal delimiter payloads are parsed through trailing_bits(), reserved payload bytes stay opaque per AV2 5.3, and every fully-decidable OBU payload is parsed into PayloadStatus::Parsed. Under obu-dispatch-frame-payloads the 11 frame-carrying types (the tile-group family CLK/OLK/leading-/regular-tile-group/switch/RAS and the SEF/TIP/bridge family) no longer return a blanket Unimplemented: dispatch parses their state-free §5.18.2 / §5.19 activation prefix (parse_tile_group_prefix / parse_frame_header_prefix, passing FirstPictureInTU=None since the stateless front door holds no per-extended-layer decoder state — a statelessly-dispatched CLK exposes starts_cvs=None rather than a fabricated value; non-CLK types derive Some(false) from the type alone) and returns the honest PayloadStatus::PrefixParsed { prefix: FramePayloadPrefix::{TileGroup|FrameHeader}, blocked_on = 'active sequence header state', feature = AV2-5.19-TILE-GROUP / AV2-5.18-FRAME-HEADER }; an EOF/invalid-uvlc inside the prefix is the existing structured error path. The deeper §5.18 / §5.19 syntax beyond the prefix stays owned by AV2-5.18-FRAME-HEADER / AV2-5.19-TILE-GROUP (the inspector's stateful frame-header views and the validator's direct-call path are the richer, state-aware surface). The dispatch row's own 11-type Unimplemented residual is now closed — no OBU type returns a blanket Unimplemented; the unimplemented_payload_feature fallback is dead. inspect --json reports the prefix_parsed_awaiting_state status (syntax + feature + blocked_on)."

