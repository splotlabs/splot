notes = "Child row of AV2-7.3-OBU-ORDERING. The validator now models the exact §7.3.6 sequential-decoding CVS boundary: a new CVS for an extended layer starts at each temporal unit containing a CLK in that layer's coded extended layer unit (detected from raw OBU headers, per-xlayer per-temporal-unit). Same-temporal-unit records join the new CVS (the CVS starts at the temporal unit, so a sequence header preceding the activating CLK belongs to the new CVS); cross-temporal-unit CVS-scoped comparison diagnostics are deferred to the temporal-unit boundary and dropped when that xlayer's CVS started in the just-completed temporal unit. The former temporal-unit-reset approximation's documented cross-TU false negatives are now true positives. The §6.4.1 distinct-obu_mlayer_id count (DistinctMlayerTracker, tracked by AV2-6.4-SEQUENCE-HEADER-SEMANTICS) likewise re-attributes the boundary temporal unit's pre-CLK ids (e.g. the §7.3.8.1 resent-at-RAP sequence header at obu_mlayer_id 0) to the new CVS at reset_cvs rather than dropping them, so a new CVS that truly exceeds SeqMaxMlayerCnt is flagged (exact re-attribution replacing the former documented sound under-count); ids from earlier temporal units never enter the re-seeded set. The re-seeded set's §6.4.1 exceedance comparison runs after the CLK's frame header activates the header the CLK references (retroactive_distinct_mlayer_check on the §5.18.2 activation path), so it is checked against the header associated with the new CVS rather than the outgoing header still active when the boundary event fires (PR #41 false-positive fix); if the CLK's frame header is unparsable or its referenced header is not in-band, the comparison is skipped (sound false negative). §7.4.4 OLK decode-initiation behavior is out of validator scope (OLK/RAS are not CVS boundary events in sequential decoding); CMVS boundaries are tracked by AV2-7.3.2-CMVS-BOUNDARIES. Documented approximation: global-bucket (GLOBAL_XLAYER_ID) CVS-scoped records are pruned at every CVS boundary event. The §7.3.6 single-active-sequence-header rule (\"Within each extended layer, only one sequence header shall remain active for the duration of a coded video sequence\") is the citation home for hls/multiple-active-sequence-headers, landed under sequence-multistream-semantics on the §5.18.2 frame-confirmed activation path (gated on same-CVS-epoch, differing seq_header_id, and suppression only when caller-provided external HLS declares a sequence header via declares_any_sequence_header()); its matrix tracking row is AV2-7.3.8-HLS-AVAILABILITY. The §7.3.6 coded-extended-layer-unit constraint family landed under celu-orderhint-constraints (crates/splot-validate/src/celu.rs, the CodedExtendedLayerTracker keyed per obu_xlayer_id across a temporal unit, above the FrameUnitSegmenter). Coded-frame-unit boundaries are NOT re-derived in the CELU tracker: the FrameUnitSegmenter is the single source of truth and returns a per-frame-bearing-OBU boundary signal (FrameBoundary: OpensNewUnit / ContinuesUnit / Ambiguous) that the tracker consumes, so the two layers agree by construction (e.g. on TIP, BRT, TIP the segmenter splits at the BRT new-unit head into two units, where the former last-obu_type comparison merged the TIPs; the segmenter keys per (xlayer, mlayer, tlayer) triple and the tracker aggregates per (xlayer, mlayer), so an OpensNewUnit in any triple of an (xlayer, mlayer) opens an embedded-layer frame unit). An Ambiguous boundary (same-type no-delimiter TIP, or unreadable tile-group delimiter) poisons that embedded layer's unit-count-dependent judgments (the output-slot grammar and the CLK/OLK-first-unit rule) — dropped, never guessed (Unknown invariant), replacing the former same-type-run-is-one-unit behavior. Ambiguity-poison precision (codex round-3 F1): an ambiguous OBU also poisons the output-presence judgments (celu/missing-output-frame-unit at CELU scope, celu/non-output-without-output at layer scope) ONLY when it could itself be an output unit, i.e. its output class is not type-decided non-output; an ambiguous OBU_BRIDGE_FRAME is type-decided non-output whichever way the boundary resolves and so does NOT poison those rules (over-poisoning would hide a genuine missing-output). The type-decided CLK/OLK identity and leading-ness are boundary-independent and are recorded for every frame-bearing OBU regardless of its coded-frame-unit boundary: on an Ambiguous boundary (F5) an OLK plus an ambiguous CLK still fires celu/clk-olk-mixed and a LEADING frame plus an ambiguous Regular-typed OBU still fires celu/leading-frame-mix; and on a ContinuesUnit boundary (codex round-5 F2 — the segmenter reports ContinuesUnit for a differently-typed non-first tile group of an already-open coded frame, also flagging frame-unit/mixed-coded-frame-types) record_clk_olk_identity and record_leadingness now run before the ContinuesUnit early return, where the former code only recorded them on the OpensNewUnit / Ambiguous arms — so a CLK opener plus an OLK-typed flag-0 continuation fires celu/clk-olk-mixed, and a LEADING opener plus a REGULAR-typed flag-0 continuation fires celu/leading-frame-mix (the unit-count-dependent accounting stays skipped on a continuation). The family: the in-unit OBU ordering between the four HLS-header phases, the ascending-obu_mlayer_id frame-unit ordering (which counts every frame-unit constituent at its own obu_mlayer_id — the CI head and the BRT/QM/FGM/prefix-metadata/MFH interior OBUs as well as the coded frame, codex round-3 F2: a head heading a higher embedded layer's unit makes a later lower-mlayer coded frame out of order; a suffix metadata shares its frame's mlayer and so never lowers the high-water mark; codex round-4 F3: the ordering is boundary-independent, so a ContinuesUnit frame OBU — a non-first tile group, which belongs to its opener's already-begun unit — and an Ambiguous frame OBU — which belongs to some layer-m unit either way — both run note_embedded_layer_ordering before their observe_frame early returns, where the former code only counted OpensNewUnit frames; e.g. mlayer0 first tile, mlayer1 frame, mlayer0 non-first tile now fires celu/in-unit-order, as does an ambiguous OBU at a lower mlayer after a higher one began, while a normal split frame at one embedded layer stays silent), AND the within-layer output-slot presence grammar (zero or more coded non-output frame units then zero or one coded output frame unit, the coded output frame unit last per embedded layer — mirror lines 528-529: a later decided unit after the layer's decided-output unit fires, regardless of its own output class; an Unknown-class earlier unit does not consume the slot) (all three under celu/in-unit-order, disjoint from obu-order/non-global-hls-before-coded-layer which owns the HLS-header-after-frame-region case), at-least-one-output-frame-unit (celu/missing-output-frame-unit, mirror line 536: applies to EVERY CELU — fires for a header-only CELU with >=1 non-padding constituent OBU at a non-global obu_xlayer_id and zero frame-bearing OBUs, anchored at the CELU's first constituent OBU, as well as a frame-bearing CELU with a decided unit and no output unit; dropped when a frame-bearing unit's output class is Unknown or when an ambiguous OBU could itself be an output unit (F1); a padding-only / reserved-type-only obu_xlayer_id group never constitutes a CELU), non-output-implies-output per embedded layer (celu/non-output-without-output), with output type-decided by obu_type for a SEF (output, §7.3.3 \"Or\" branch) and an OBU_BRIDGE_FRAME (non-output, §7.3.4 list only) BEFORE any flag parse (codex round-3 F3: the shared frame_unit::type_decided_output helper is the single source of truth used by both the FrameUnitSegmenter and the CELU wiring, so a bridge-only CELU fires celu/missing-output-frame-unit and a bridge layer alongside an output layer fires celu/non-output-without-output, where the former parser-stops-early path routed both to Unknown and dropped them), same-OrderHint across the CELU's output units (celu/output-order-hint-mismatch, order_hint read from the §5.18.2 core parse on the intra / SEF-with-derive_sef_order_hint==0 paths), CLK/OLK only-first-frame-unit and lowest-embedded-layer-first rules (celu/key-not-in-first-unit, celu/lowest-layer-not-key), no CLK+OLK mix (celu/clk-olk-mixed), all-leading-or-none (celu/leading-frame-mix; leading-ness is the type-decided tri-state Leadingness mirroring AVM is_leading_picture at av2/decoder/obu.c:2544-2549 — the av2_is_leading_vcl_obu set LEADING_TILE_GROUP/LEADING_SEF/LEADING_TIP is Leading, the §5.18.2 IsRegular==1 / av2_is_regular_vcl_obu set OLK/REGULAR_*/SWITCH/RAS/BRIDGE is Regular, and a CLK lands in neither so it is Indeterminate and is excluded from the all-leading-or-none judgment entirely; the rule fires only when a Leading and a Regular unit coexist in one CELU; the §6.4.1 gloss at 06-syntax-structures-semantics.md:4546 reads IsRegular==0 as exactly leading and would class a CLK as leading, but the AVM oracle tri-states it indeterminate, so the validator under-reports the CLK-plus-regular structure the §7.3.6 CLK rule explicitly contemplates — mirror lines 541-549, a higher embedded layer's first frame unit may be a non-CLK regular frame — as a documented sound under-approximation; type-decided, so it never routes to Unknown), and the CELU-scoped content-interpretation-first-frame-unit rule (celu/content-interpretation-not-in-first-unit, distinct from the §7.3.8.10 temporal-unit form frame-unit/ci-not-in-first-frame-unit). Output-class- and OrderHint-derived judgments drop to silence when the §5.18.2 core parse stops before the field or the active sequence header is unavailable (the Unknown invariant). Residuals (validate stays partial): the §7.3.6 bit-identity cross-layer fingerprint baseline (the activated-sequence-header repeat-content check, tracked here as hls/repeated-sequence-header-not-identical, retargeted to this row by rap-availability-replay/PR #51) and the §7.3.6 monotonic_output_order_flag==0 OrderHint regression rule's full form (mirror lines 579-584: within a CVS, for a given (obu_xlayer_id, obu_mlayer_id), a later-in-output-order coded output frame unit must not have an OrderHint <= an earlier one's unless a restricted_prediction_switch==1 SWITCH intervenes) stay named residuals — the monotonic regression needs output-order and MSB-extended OrderHint state this phase does not model (blocked on AV2-5.18.2-FRAME-HEADER-INFO inter-path / output-order state). Named residual (OrderHint LSB proxy, celu-orderhint-constraints follow-up): celu/output-order-hint-mismatch compares the raw order_hint LSB syntax as a proxy for the §7.3.6 DECODED OrderHint (get_disp_order_hint's MSB extension for non-CLK frames); within one CELU all output units share one active sequence header (one OrderHintBits), so the LSB comparison is a sound under-approximation (differing LSBs imply differing OrderHints; same LSBs with diverging MSBs under-report). The decoded-OrderHint comparison stays blocked on reference-state modelling / get_disp_order_hint (AV2-5.18.2-FRAME-HEADER-INFO). Stale-activation safety: the §5.18.2 core parse for the output class / order_hint is only trusted when the frame's referenced sequence header equals the in-band active header it was parsed against; a frame referencing an absent/out-of-range/different header (while a stale earlier activation persists) routes to Unknown rather than misparsing field widths off the wrong header (the frame-unit segmenter's output-class derivation applies the same guard). MFH-backed frame resolution (codex round-4 F2): the referenced header resolves through EITHER (a) cur_mfh_id==0 with seq_header_id_in_frame_header in range (the §5.18.2 prefix's referenced_sequence_header_id) OR (b) cur_mfh_id>0 in range whose IN-BAND multi-frame header (§7.3.8.7, HlsAvailabilityStore::multi_frame_header) has mfh_seq_header_id equal to the parsed-against active id. The §5.18.2 control region through the output flags (immediate_output_frame / implicit_output_frame) is read BEFORE the cur_mfh_id>0-gated structures and is determined by the active (==resolved) sequence header alone, so an MFH-backed frame's output class is decidable; parse_frame_core is now invoked WITH the resolving MFH record (forward plumbing — the record carries no field the currently-reachable paths consult, so it changes no current decision but is threaded for the §5.18 MFH coverage to come). The former guard required referenced_sequence_header_id==Some(seq_id), which is None for every cur_mfh_id>0 frame, so decidable MFH-backed frames wrongly routed to Unknown and silently dropped celu/missing-output-frame-unit, celu/non-output-without-output, the non-output BRT bound, etc. External-HLS caveat (PR #49 partial-declaration policy): an MFH only externally declared (ExternalHlsMode::Provided, not in-band) is not a verifiable association — multi_frame_header returns None for it — so the frame stays Unknown; an out-of-range cur_mfh_id, an absent record, or an MFH whose mfh_seq_header_id resolves to a header other than the active one (e.g. its target sequence header was never sent in-band) all keep Unknown. First-CELU-of-the-sequence CI presence (codex round-6 F3): the §7.3.6 sentence \"If an OBU_CONTENT_INTERPRETATION is present in any coded extended layer unit, this OBU shall also be present in the first coded extended layer unit of the sequence ... for a given embedded layer\" (mirror docs/spec/av2/1.0.0/07-decoding-process.md#s-7-3-6 lines 560-562) has two halves: the CONTENTS-IDENTITY half (\"the same contents in all its repetitions\") is owned by content-interpretation/repeated-ci-not-identical (§6.14, AV2-5.15-CONTENT-INTERPRETATION), and the PRESENCE half is now landed as celu/content-interpretation-not-in-first-celu. The presence rule is coded-video-sequence-scoped, so it lives in ValidatorContext (crates/splot-validate/src/context.rs::resolve_ci_first_celu_for_tu), NOT the per-temporal-unit CELU tracker: per extended layer it records the embedded layers whose CI appeared in the CVS's first coded extended layer unit (its CELU in the CVS's first temporal unit — a CVS starts at the CLK temporal unit, §7.3.6 — re-seeded per CVS in start_cvs_for_xlayer), and a later CELU adding a CI for an embedded layer the first CELU lacked fires once per (xlayer, mlayer, CVS epoch), anchored at the offending CI. CIs are buffered per temporal unit (ci_observed_in_tu) and resolved at the temporal-unit boundary (and end of bitstream) because the whole temporal unit containing a CLK belongs to the new CVS, so a CI's CELU membership is final only once the unit completes. DROPS when the first CELU of the CVS was not observed: a mid-CVS join (no CLK seen for the layer, the implicit CVS began before the first observed OBU, first_celu_tu == None) or any external-HLS Provided mode (an external CI in the first CELU cannot be enumerated by ExternalHlsSet, which expresses only sequence headers and operating point sets — under-report per the partial-declaration suppression policy). Distinct from the CELU-scoped first-FRAME-UNIT form celu/content-interpretation-not-in-first-unit (lines 557-559) and the §7.3.8.10 temporal-unit form frame-unit/ci-not-in-first-frame-unit. Codex round-7 precision (celu-orderhint-constraints follow-up): (F3/F4/F5) the three §7.3.6/§7.3.7 OrderHint/OrderHintBits mismatch checks (celu/output-order-hint-mismatch, celu/doh-order-hint-bits-mismatch, celu/doh-order-hint-mismatch) now emit a mismatch PROVEN between two known samples regardless of any undecidable participant: an undecidable frame / output unit / CELU can only prevent proving AGREEMENT (never reported) and cannot make a pair already proven to differ conforming, so the former per-temporal-unit undecidable gates no longer suppress proven mismatches (the per-pair known-and-equal-bits gate for the cross-CELU OrderHint LSB proxy is kept — an unknown-or-unequal-bits pair still records no mismatch, and a CELU with an undecidable output OrderHint is simply not contributed to the cross-CELU comparison so a recorded mismatch is always between two fully-decidable CELUs). (F2) a same-type no-delimiter OBU_BRIDGE_FRAME adjacency now reports FrameBoundary::Ambiguous in the FrameUnitSegmenter (crates/splot-validate/src/frame_unit.rs): the UNIT COUNT (one bridge coded frame or two back-to-back same-type bridge units) is genuinely ambiguous with no in-band delimiter, and that boundary ambiguity is INDEPENDENT of output-class decidability, so the CELU layer poisons its unit-count-dependent judgments for that embedded layer rather than silently under-counting the run as one unit; the bridge's type-decided non-output class is preserved (NOT routed to Unknown), so the §7.3.4 BRT multiplicity bound stays evaluable across the run and an ambiguous bridge still does not poison output-presence (non-output either way — round-3 precision). Codex round-8 precision (celu-orderhint-constraints follow-up — the POISON-SCOPE RULE): an ambiguity changes the embedded layer's unit COUNT/INDEX, not the relative order of two DECIDED units (an OpensNewUnit is the segmenter's decided split that no resolution can merge), so the per-layer ambiguous poison is scoped to exactly what it can change — INDEX-QUANTIFIED judgments drop (the per-unit accounting / OrderHint accumulators and the output-presence judgments) while DECIDED-PAIR-ORDER judgments survive. (F1) the within-layer output-slot grammar (celu/in-unit-order) no longer consults the poison: once a DECIDED output unit consumes the layer's slot, any LATER DECIDED OpensNewUnit unit fires regardless of an earlier/intervening ambiguous OBU (e.g. decided output, ambiguous OBU, decided unit -> fires, pre-fix silent), while an ambiguous OBU with no later decided unit stays silent. (F2) celu/key-not-in-first-unit is gated on \"a DECIDED earlier unit already exists in the layer\" (units_opened >= 1, which counts only decided OpensNewUnit units) rather than the blanket poison: a decided non-key unit, an ambiguous same-type OBU, then a decided CLK/OLK fires (the key is provably not the layer's first coded frame unit whatever the intervening ambiguity was, pre-fix silent); the dropped ASYMMETRIC case is the key ITSELF being the first DECIDED unit while an ambiguous OBU preceded it (units_opened == 0 -> already silent by the same guard). celu/lowest-layer-not-key keeps that asymmetry by construction (its predicate is the identity of the lowest layer's FIRST unit, which an ambiguous OBU before the candidate leaves unknown — no decided-pair-order reformulation exists, so it stays dropped). The now-redundant per-layer ambiguous_poisoned flag (consulted by no judgment after F1/F2) was removed; the output-presence poison (output_presence_poisoned / missing_output_poisoned, set only when the ambiguous OBU could itself be an output unit) is the remaining ambiguity-poison state. NAMED RESIDUAL (per-operating-point CLK/OLK-first rule, mirror docs/spec/av2/1.0.0/07-decoding-process.md#s-7-3-6 lines 592-598 / page boundary 595-603): for each CELU containing a CLK or OLK, the OBUs within the CELU FOR EACH OPERATING POINT shall (1) contain one or more coded frame units and (2) have the first coded frame unit be the key type. The validator implements only the CELU-WIDE forms — the per-layer celu/key-not-in-first-unit and the lowest-embedded-layer-first celu/lowest-layer-not-key (mirror lines 541-553) — but NOT the per-operating-point projection. It is OPERATING-POINT-FRAME-MAPPING-BLOCKED: projecting a CELU's decided frame units onto an operating point's embedded-layer (mlayer) set needs (a) a resolvable per-CELU ACTIVE operating point set — not modeled; OPS records (OperatingPointSetRecord, AV2-5.10-OPERATING-POINT-SET) are looked up only by an explicit referencing ops_id (e.g. a BRT's br_ops_id), with no in-band selection of which OPS/OP applies to a temporal unit's CELU — and (b) per-OP per-xlayer mlayer membership retained for projection — only Explicit ops_mlayer_info() entries are kept (for the §6.10.7 dependency-map checks), while Inherited/Absent sources are dropped, so a CELU's full per-OP membership is not reconstructable. The validator explicitly does not model the operating-point-to-frame mapping (crates/splot-validate/src/context.rs check_ops_level_tier_value_space TODO(spec: AV2-A-LEVELS-TIERS): \"an operating-point-to-frame mapping (which frames belong to which operating point) the validator does not model yet\"), the same blocker behind the backlogged annex-a/frame-exceeds-ops-level diagnostic. Implementing the per-OP rule without this mapping would require guessing OP membership and risk false positives, so it stays a named residual rather than a guessed check; unblocked by the operating-point frame mapping (AV2-5.10-OPERATING-POINT-SET / the VALIDATOR-ROADMAP operating-point frame-mapping item)."

