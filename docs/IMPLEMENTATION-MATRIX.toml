notes = "Implemented as BitReader::read_svlc() from AV2 §4.11.4: value = uvlc(); half = (value + 1) >> 1; svlc = (value & 1) ? half : -half. EOF and the uvlc() leadingZeros >= 32 conformance bound propagate from read_uvlc() without panics. Needed by the user_defined_qm() helper (AV2-5.4.11-USER-QM)."

