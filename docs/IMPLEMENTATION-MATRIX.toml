[[feature]]
id = "AV2-5.20-TILE-GROUP-PAYLOAD"
name = "Tile group payload syntax"
category = "normative"
kind = "bitstream-syntax"
spec_sections = ["5.20", "6.19"]
sources = ["https://av2.aomedia.org/v1.0.0/index.html"]
crate = "splot-core"
