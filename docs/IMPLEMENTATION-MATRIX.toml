notes = "Child row of AV2-5.17-METADATA. The locally-decidable §6.16.7 range bounds landed earlier (docs/spec/av2/1.0.0/06-syntax-structures-semantics.md#s-6-16-7): seconds_value 0..59 (lines 3873-3876), minutes_value 0..59 (3882-3885), hours_value 0..23 (3890-3893) as metadata/timecode-seconds-out-of-range / -minutes-out-of-range / -hours-out-of-range (crates/splot-validate/src/checks/mod.rs check_metadata_unit_payload). The metadata-residual-local-semantics change added two more locally-decidable §6.16.7 facts (crates/splot-validate/src/context.rs check_timecode_consistency / recheck_timecode_n_frames_after_ci): (a) the inference-presence rules — when seconds_value/minutes_value/hours_value is not present it is inferred from 'the previous set of clock timestamp syntax elements in decoding order, and it is required that such a previous value shall have been present' (lines 3873-3893) — as metadata/timecode-inferred-without-previous (error), tracked with per-CVS-scope decoding-order field-presence state keyed by the carrying OBU's concrete (obu_xlayer_id, obu_mlayer_id): METADATA_TYPE_TIMECODE is layer-specific (§6.16.3 Table 6.17, 'Y'), so a timecode on embedded layer (x, m0) is NOT the 'previous set in decoding order' of one on (x, m1) and must not seed its inference (metadata_timecode_inference_keyed_per_targeted_embedded_layer); a LAYER_UNSPECIFIED timecode (§6.16.3: 'does not specify to what layers the metadata applies to') still chains per its carrying OBU's own (obu_xlayer_id, obu_mlayer_id) scope — the only concrete scope the bitstream pins down, a documented sound choice that never compares across unrelated targets. A global timecode's chain (and its global-bucket n_frames observations) is detached by ANY CLK, since a global timecode spans every layer; a concrete-layer timecode's chain only by a CLK for that extended layer (§7.3.6 CVS boundaries are per extended layer). The reading is LITERAL-presence, matching the check_timecode_consistency doc comment: 'present' means the element was *coded* in the immediate predecessor set in decoding order (its own §5.17.7 presence flags), so an INFERRED value in the predecessor does NOT make the element present for the next set — a set that omits a field, followed by another that also omits it, fires on the second omission too (metadata_timecode_omitted_after_omitted_is_flagged); the chain never seeds itself from an inference and resets at each §7.3.6 CLK boundary. The rejected lenient carry-forward reading (where a first omitted-but-inferred value would count as 'present' and satisfy the next omitting set) lacked textual support: the sentence speaks of the element having 'been present', not of a value having been *established*; AVM differential testing may revisit it if the reference decoder treats a propagated inferred value as satisfying the requirement; (b) the n_frames bound — 'When ci_timing_info_present_flag is equal to 1, n_frames shall be less than maxPicPerSecond = ceil(time_scale / TicksPerPicture)' (lines 3865-3867) — as metadata/timecode-n-frames-exceeds-rate (error), decidable because ci_timing_info_present_flag is the content-interpretation OBU's flag (annex-e-decoder-model.md line 293: 'ci_timing_info_present_flag equal to 1 in the content interpretation OBU associated with this extended layer') and time_scale/num_units_in_display_tick/num_ticks_per_picture_minus_1 are parsed into TimingInfo and tracked in the content_interpretations store, so the bound is paired against the in-scope CI timing at/after the layer's §7.3.8.11 epoch in both arrival orders (timecode-before-CI re-checks via recheck_timecode_n_frames_after_ci), with strict 'less than' boundary tests (n_frames == maxPicPerSecond fails, == maxPicPerSecond-1 passes). 'In scope' is the §6.16.3 targeting (derive_hdr_association): a derivable targeting (LAYER_GLOBAL -> Universal pairs every CI; LAYER_CURRENT / LAYER_VALUES pair only the named (xlayer, mlayer) pairs) decides the pairing exactly, so a global LAYER_VALUES timecode naming only some layers does not pair with an untargeted layer's CI (metadata_timecode_n_frames_targeting_excludes_untargeted_layer_ci); an UNDERIVABLE targeting (LAYER_UNSPECIFIED and the other derive_hdr_association gaps) compares NOTHING — the spec leaves the layer association unspecified, so no CI's rate binds the timecode and the prior coarse 'pair with every CI in the obu_xlayer_id scope' fallback (which could fire a hard error against an unrelated layer) is dropped (metadata_timecode_n_frames_unspecified_targeting_compares_nothing). The n_frames observations are pruned per the §7.3.6 PER-EXTENDED-LAYER CVS boundary: an observation belongs to the coded video sequences of the extended layers it targets, so a CLK for one extended layer leaves a global-bucket observation aimed at another extended layer untouched (metadata_timecode_n_frames_global_layer_values_survives_other_layer_clk). The CI-re-send dedup that suppresses re-reporting an unchanged repeat (§6.14) is EPOCH-aware (the unified model shared with the §6.16.10 scan-type guard): the recheck is skipped only when the re-sent CI is content-identical AND the existing record is still the post-epoch authority for it (existing.tu_index >= ci_rap_epoch), so an ordinary identical repeat in a LATER temporal unit with no random access point in between never re-reports the already-paired observation (metadata_timecode_n_frames_identical_ci_repeat_no_rap_reports_once / scan_type_identical_ci_repeat_no_rap_reports_once — the over-correction the earlier temporal-unit-identity predicate caused). When a CI is re-sent BEFORE its CLK in a §7.3.8.11 random access point the lagging epoch cannot yet tell it apart from an ordinary repeat at CI-time, so the dedup also skips there; the new coded video sequence's observations are then re-paired against the re-sent CI at the CLK (repair_post_rap_ci_pairings, run after observe_ci_rap advances the epoch and drops the stale pre-RAP deferred pairings) exactly once — the bound is never lost across the RAP (metadata_timecode_n_frames_rap_resent_identical_ci_repairs / scan_type_rap_resent_identical_ci_repairs). (c) counting_type reserved values 7..31: the §6.16.7 counting_type table (line 3823) marks 7..31 'reserved' with NO conformance sentence forbidding them — §6.16.7 only says counting_type 'should be the same for all pictures' (line 3804, a recommendation, not a 'shall'). So a reserved counting_type is a decoder-ignored producer anomaly as metadata/timecode-counting-type-reserved (WARNING, never a conformance error), matching the established reserved-value pattern for table-'reserved'-without-'shall' fields (metadata/persistence-idc-reserved, metadata/group-layer-idc-reserved) — NOT an error like mps_pic_struct_type > 12, which §6.16.10 Table 6.18 backs with a 'shall not be present' sentence (crates/splot-validate/src/checks/mod.rs check_metadata_unit_payload; metadata_timecode_counting_type_reserved_is_warned / _defined_is_silent). validate STAYS partial for TWO named residuals. (1) The §6.16.7 clockTimestamp output-order monotonicity sentence — 'When ci_timing_info_present_flag is equal to 1 and discontinuity_flag is equal to 0, the value of clockTimestamp shall be greater than or equal to the value of clockTimestamp for the previous set of clock timestamp syntax elements in OUTPUT order' (lines 3858-3860) — is blocked on frame OUTPUT-order state (no decoder / output process; the previous set in output order, not decoding order, is unavailable). (2) §7.3.8.11 step-3 content-interpretation INHERITANCE (docs/spec/av2/1.0.0/07-decoding-process.md#s-7-3-8-11, lines 925-929): when no CI OBU is present for embedded layer m, m's parameters are inherited from the highest lower layer k with MLayerPresenceMap[m][k] == 1. The n_frames bound for a LAYER_VALUES timecode targeting m should then pair with the inherited layer-k CI, but MLayerPresenceMap — the §5.4.1 transitive closure of the modeled MLayerDependencyMap (docs/spec/av2/1.0.0/05-syntax-structures.md lines 583-607) — is NOT modeled (splot-core derives MLayerDependencyMap but no presence closure; no mlayer_presence/MLayerPresenceMap state exists in the validator). Rather than guess the closure, timecode_ci_in_scope stays exact: an exact-pair miss with possible inheritance (timecode targets m, only CI is at k != m) compares NOTHING — an honest false-negative, not a silent in-scope-clean pass — and is treated as not-pairable; see the TODO(spec: AV2-5.17.7-METADATA-TIMECODE) at that gate. Do not mark the umbrella done until this child's output-order and inheritance residuals are resolved. Known false-negative: group-form LAYER_VALUES inference chains share the global carrying-pair key across disjoint target sets (TODO in context.rs; never a false positive)."

