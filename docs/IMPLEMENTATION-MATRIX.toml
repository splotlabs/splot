notes = "Child row of AV2-5.17-METADATA. The §6.16.5 'shall have the same content' rule for additional HDR CLL units in a CVS is checked per intersecting embedded-layer association over the exact §7.3.6 CVS boundary (metadata/hdr-cll-repeat-content-differs): each unit's association set is derived from its §6.16.3 muh_layer_idc targeting (global LAYER_GLOBAL = all layers, local LAYER_GLOBAL = every embedded layer of the carrying xlayer, LAYER_CURRENT = the carrying (xlayer, mlayer), LAYER_VALUES = the full muh_xlayer_map/muh_mlayer_map pair set incl. multi-map global units), so cross-mode pairs that share an embedded layer are compared while disjoint targeting never is. Units with no bitstream-derivable association (LAYER_UNSPECIFIED, LAYER_CURRENT on a global OBU, reserved muh_layer_idc) enter no comparison and no baseline — a documented conservative false negative. validate stays partial: the §6.16.5 'shall be indicated at the first coded picture of that embedded layer' half needs metadata-to-picture association within the coded frame unit and is deferred to avoid false positives (TODO(spec: AV2-5.17.5-METADATA-HDR-CLL) in crates/splot-validate/src/context.rs)."

