ixState now tracks a qm_protected bitmap, cleared at a temporal delimiter (§5.5 mirror :1626-1630), set per sent level by a QM OBU (§5.13 mirror :3010/:3033), and consumed by reset_qm_availability_for_key (CLK/OLK, unconditional needsReset arm) / reset_qm_availability_for_switch_or_ras (RAS / restricted SWITCH, the QmMLayerId==-1 arm) at the frame header. The availability presence check (frame-header/qm-level-unavailable, §7.3.8.9) is recorded on AV2-5.18.6-QUANTIZATION. RESIDUAL: the using_qmatrix/qm_y/qm_u/qm_v §6.17.6.2 layer-dependency constraints and the SWITCH/RAS MLayerPresenceMap reset arm stay deferred."

