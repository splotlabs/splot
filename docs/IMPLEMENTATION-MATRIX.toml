[[feature]]
id = "AV2-4.11.4-SVLC"
name = "Signed variable-length code descriptor"
category = "normative"
kind = "bitstream-syntax"
spec_sections = ["4.11.4"]
sources = ["https://av2.aomedia.org/v1.0.0/index.html"]
