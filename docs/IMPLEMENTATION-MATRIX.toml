# Canonical AV2 implementation matrix for `splot`.
#
# This file is the SINGLE SOURCE OF TRUTH for what is implemented and how far.
# GitHub Issues/Projects, README checklists, and STATUS.md are NOT canonical.
#
# Schema, status model, and proof rules: docs/IMPLEMENTATION-MATRIX.schema.md
# Workflow and conventions:               docs/FEATURE-TRACKING.md
# Render it:                              cargo xtask feature-status
# Check it for drift:                     cargo xtask check-feature-status
# Summarize coverage:                     cargo xtask spec-coverage
#
# Status values: todo | partial | done | blocked | not-applicable | experimental | pending
# A code stage may be "done" only when [feature.proof] records proof (see schema).
# Do NOT use percentages.

matrix_version = 1
last_reviewed = "2026-06-06"

# ---------------------------------------------------------------------------
# Normative AV2 bitstream syntax and semantics
# ---------------------------------------------------------------------------

[[feature]]
id = "AV2-4.11.6-LEB128"
name = "LEB128 descriptor"
category = "normative"
kind = "bitstream-syntax"
spec_sections = ["4.11.6"]
sources = ["https://av2.aomedia.org/v1.0.0/index.html"]
crate = "splot-core"
module = "crates/splot-core/src/leb128.rs"
openspec_change = "parse-annexb-and-obu-headers"
tracking_issue = ""
owner = "core"
risk = "high"
notes = "AV2 LEB128 is byte-aligned, up to 8 bytes, bounded to u32, and permits non-minimal encodings. read_leb128 enforces the byte-7-MSB rule and the u32 bound. validate/decode_check are satisfied via the generic bitstream/parse-error diagnostic (no LEB128-specific validator check)."

[feature.status]
mapped = "done"
types = "done"
parse = "done"
validate = "partial"
write = "todo"
encode = "not-applicable"
decode_check = "done"
tests = "done"
avm_diff = "pending"
perf = "not-applicable"

[feature.proof]
tests = ["crates/splot-core/src/leb128.rs::tests"]
commands = ["cargo test -p splot-core leb128"]
fixtures = []
diagnostics = []

