notes = "Child row of AV2-7.3-OBU-ORDERING. The validator now models the exact §7.3.6 sequential-decoding CVS boundary: a new CVS for an extended layer starts at each temporal unit containing a CLK in that layer's coded extended layer unit (detected from raw OBU headers, per-xlayer per-temporal-unit). Same-temporal-unit records join the new CVS (the CVS starts at the temporal unit, so a sequence header preceding the activating CLK belongs to the new CVS); cross-temporal-unit CVS-scoped comparison diagnostics are deferred to the temporal-unit boundary and dropped when that xlayer's CVS started in the just-completed temporal unit. The former temporal-unit-reset approximation's documented cross-TU false negatives are now true positives. §7.4.4 OLK decode-initiation behavior is out of validator scope (OLK/RAS are not CVS boundary events in sequential decoding); CMVS boundaries are tracked by AV2-7.3.2-CMVS-BOUNDARIES. Documented approximation: global-bucket (GLOBAL_XLAYER_ID) CVS-scoped records are pruned at every CVS boundary event. Residual for validate=done: the §7.3.6 coded-frame-unit constraints (in-unit OBU ordering, output-frame presence, OrderHint agreement and monotonicity, CLK/OLK first-coded-frame-unit rules, leading-frame rule, per-frame-unit content-interpretation placement) need frame-unit parsing (AV2-7.3.5-CODED-FRAME-UNIT)."

