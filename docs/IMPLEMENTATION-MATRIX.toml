[[feature]]
id = "AV2-5.18.1-FRAME-HEADER-GENERAL"
name = "Frame header general syntax"
category = "normative"
kind = "bitstream-syntax"
spec_sections = ["5.18.1", "6.17"]
sources = ["https://av2.aomedia.org/v1.0.0/index.html"]
crate = "splot-core"
module = "crates/splot-core/src/headers/frame/mod.rs"
openspec_change = "frame-header-copy-bit-accounting"
tracking_issue = ""
owner = "core"
risk = "high"
notes = "Child row of AV2-5.18-FRAME-HEADER. frame_header(isFirst) is parsed beyond the activation fields by the core parser (AV2-5.18.2-FRAME-HEADER-INFO). Under frame-header-copy-bit-accounting the §5.18.1 NumFrameHeaderBits accounting and the isFirst==0 frame_header_copy() path are now MODELED for completed-intra first headers: when a first tile group's frame_header_info() parses to completion (FrameHeaderParseStatus::IntraHeaderComplete) the core's consumed_bits IS NumFrameHeaderBits (mirror :3924), and splot-core records the exact first-header bits (RecordedFrameHeaderBits, starting AFTER the tile_group_obu() is_first_tile_group flag per §6.17.1 mirror :4303-4305) and parses a non-first tile group's frame_header_copy() as exactly that many header_bit f(1) reads, comparing bit-for-bit (parse_frame_header_copy → FrameHeaderCopyOutcome, crates/splot-core/src/headers/tile_group.rs). The validator (crates/splot-validate/src/context.rs observe_frame_header_copy / check_frame_header_copy) pairs a non-first tile group with ITS coded frame's first tile group using the FrameUnitSegmenter boundary authority (OpensNewUnit records, ContinuesUnit compares, Ambiguous drops the pairing AND poisons/removes the triple's record — an unreadable is_first_tile_group may have opened a new coded frame, so the recorded header can no longer pair until the next OpensNewUnit re-records), keyed per (xlayer, mlayer, tlayer) and cleared at each temporal delimiter. §6.17.1 states it is a requirement of bitstream conformance that header_bit[i] equals the bit at offset i of the first frame header (mirror :4299-4300), surfaced as frame-header/copy-bits-mismatch; a copy region shorter than NumFrameHeaderBits is a §5.18.1/§6.2.1 truncation, frame-header/copy-bits-truncated. An incomplete/coverage-stopped/unresolvable first header records nothing (copy stays unparsed, Unknown routing). inspect surfaces the copy region's presence on non-first tile groups (frame_header_copy view). Residual: frame_header_copy() for an INTER first header (the gate extends when the inter path completes, AV2-5.18.2-FRAME-HEADER-INFO), and a show-existing-frame CLK never pairs (decode_frame_wrapup() runs with no following tile group)."

