notes = "Tracks CVS boundaries per extended layer at CLK-bearing temporal units, attributing pre-CLK records in that unit to the new CVS. CELU checks share frame-unit boundary decisions and cover HLS/layer order, output-slot presence/order, output order-hint disagreement, key placement, CLK/OLK and leading-frame mixes, and CI placement/repetition. Ambiguity suppresses count-dependent judgments but preserves violations proved by decided pairs or OBU types; resolved frame references guard output facts against stale activation. Limitations: decoded-order-hint comparisons use a sound LSB proxy; full output-order regression and per-operating-point key placement require additional state/mapping. Global-bucket CVS records are pruned at each boundary. The documented AVM-aligned leadingness treatment leaves CLK indeterminate."

