[[feature]]
id = "AV2-7.3.6-CODED-EXTENDED-LAYER-UNIT"
name = "Coded extended layer unit ordering semantics"
category = "normative"
kind = "bitstream-semantics"
spec_sections = ["7.3.6"]
sources = ["https://av2.aomedia.org/v1.0.0/index.html"]
crate = "splot-validate"
module = "crates/splot-validate/src/context.rs"
openspec_change = "metadata-semantic-validation"
tracking_issue = ""
owner = "validator"
risk = "high"
notes = "Child row of AV2-7.3-OBU-ORDERING. The validator now models the exact §7.3.6 sequential-decoding CVS boundary: a new CVS for an extended layer starts at each temporal unit containing a CLK in that layer's coded extended layer unit (detected from raw OBU headers, per-xlayer per-temporal-unit). Same-temporal-unit records join the new CVS (the CVS starts at the temporal unit, so a sequence header preceding the activating CLK belongs to the new CVS); cross-temporal-unit CVS-scoped comparison diagnostics are deferred to the temporal-unit boundary and dropped when that xlayer's CVS started in the just-completed temporal unit. The former temporal-unit-reset approximation's documented cross-TU false negatives are now true positives. The §6.4.1 distinct-obu_mlayer_id count (DistinctMlayerTracker, tracked by AV2-6.4-SEQUENCE-HEADER-SEMANTICS) likewise re-attributes the boundary temporal unit's pre-CLK ids (e.g. the §7.3.8.1 resent-at-RAP sequence header at obu_mlayer_id 0) to the new CVS at reset_cvs rather than dropping them, so a new CVS that truly exceeds SeqMaxMlayerCnt is flagged (exact re-attribution replacing the former documented sound under-count); ids from earlier temporal units never enter the re-seeded set. The re-seeded set's §6.4.1 exceedance comparison runs after the CLK's frame header activates the header the CLK references (retroactive_distinct_mlayer_check on the §5.18.2 activation path), so it is checked against the header associated with the new CVS rather than the outgoing header still active when the boundary event fires (PR #41 false-positive fix); if the CLK's frame header is unparsable or its referenced header is not in-band, the comparison is skipped (sound false negative). §7.4.4 OLK decode-initiation behavior is out of validator scope (OLK/RAS are not CVS boundary events in sequential decoding); CMVS boundaries are tracked by AV2-7.3.2-CMVS-BOUNDARIES. Documented approximation: global-bucket (GLOBAL_XLAYER_ID) CVS-scoped records are pruned at every CVS boundary event. The §7.3.6 single-active-sequence-header rule (\"Within each extended layer, only one sequence header shall remain active for the duration of a coded video sequence\") is the citation home for hls/multiple-active-sequence-headers, landed under sequence-multistream-semantics on the §5.18.2 frame-confirmed activation path (gated on same-CVS-epoch, differing seq_header_id, and suppression only when caller-provided external HLS declares a sequence header via declares_any_sequence_header()); its matrix tracking row is AV2-7.3.8-HLS-AVAILABILITY. Residual for validate=done: the §7.3.6 coded-frame-unit constraints (in-unit OBU ordering, output-frame presence, OrderHint agreement and monotonicity, CLK/OLK first-coded-frame-unit rules, leading-frame rule, per-frame-unit content-interpretation placement) need frame-unit parsing (AV2-7.3.5-CODED-FRAME-UNIT)."

