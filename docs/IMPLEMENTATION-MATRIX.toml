openspec_change = "metadata-semantic-validation"
tracking_issue = ""
owner = "core"
risk = "medium"
notes = "Child row of AV2-5.17-METADATA. The Table 6.18 ci_scan_type_idc cross-checks, the equal_picture_interval rule for mps_pic_struct_type 7/8, and the CVS-wide single-pic-struct-group conformance requirement are enforced over the exact §7.3.6 CVS boundary (per-xlayer scopes plus a global bucket; global metadata is compared against each concrete xlayer scope and vice versa). The Table 6.18 CI pairings are additionally scoped to the §7.3.8.11 CI-parameter epoch: a CLK or OLK temporal unit re-initializes the extended layer's content interpretation parameters, so pre-epoch CI records and pre-epoch observations are never paired across the random access point (a CI re-sent in the RAP temporal unit re-enters pairing per §7.3.8.11 step 2); each (observation, CI-content) pair is evaluated exactly once — a repeated CI with identical Table 6.18-decisive content skips re-evaluation, while a CI for a new embedded layer or with changed content is paired with every stored observation. Reserved mps_pic_struct_type values (>12) are excluded from the group/CI state per 'Decoders shall ignore reserved values'. Negative finding (spec honesty): the mirror defines mps_source_scan_type_idc only as having 'the same semantics as for ci_scan_type_idc' (§6.16.10) — no mps_source_scan_type_idc/ci_scan_type_idc consistency rule exists, so none is checked; mps_duplicate_flag is indicative only. metadata/scan-type-ci-scan-type-unestablished is a derived literal-reading warning (the §7.3.8.11 default ci_scan_type_idc 0 satisfies no Table 6.18 row) and deliberately ignores the RAP epoch (lenient documented approximation for a warning-severity diagnostic); absent timing_info is silent for the 7/8 equal-picture-interval rule (the mirror gives no absent-case rule)."

