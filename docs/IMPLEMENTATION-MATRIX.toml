openspec_change = "tile-payload-boundary-validation"
tracking_issue = ""
owner = "core"
risk = "high"
notes = "Deep payload syntax and arithmetic boundary validation. Under tile-payload-boundary-validation the §5.20.1 per-tile FRAMING SLICE has landed: parse_tile_group_framing (crates/splot-core/src/headers/tile_group.rs) walks the tile_group_payload() loop verbatim (mirror :8553-8640) over the §5.19 structure's COMPLETE payload_size region — each non-last, non-bridge tile reads tile_size_minus_1 le(TileSizeBytes) (§4.11.5: exactly TileSizeBytes bytes, little-endian), sets tileSize = +1 (mirror :8569), and bookkeeps sz -= tileSize + TileSizeBytes (mirror :8571); the last tile takes the remaining sz (mirror :8557); a bridge frame's tiles read no size field (the else-if(!IsBridge) arm is skipped, mirror :8559). It records per-tile framing (size-field offset, tile-data offset, tileSize) and stops at the first provable defect. TileSizeBytes is the parsed tile_info()'s tile_size_bytes_minus_1 + 1 (§6.17.7.3, 1..=4). Validate side (crates/splot-validate/src/context.rs tile_group_framing_checks via the shared tile_group_structure_checks, gated on a COMPLETE §5.19 structure with a self-consistent tg-range): three provable framing defects — tile-payload/size-field-truncated (§5.20.1 / §4.11.5 / §6.2.1: the le(TileSizeBytes) field runs past the region), tile-payload/tile-size-overflows-payload (§5.20.1 mirror :8571: tileSize + TileSizeBytes exceeds the remaining sz), and tile-payload/zero-size-tile (§8.2.2/§8.2.4: a zero-size non-bridge tile cannot satisfy SymbolMaxBits >= -14 at exit_symbol()), each anchored at the offending tile's size-field byte offset within the bitstream. The framing now runs on EVERY tile-group OBU of a paired intra-complete coded frame, NOT only the first: the FIRST tile group (layout from its parsed tile_info(), via tile_group_range_checks) AND each CONTINUATION (is_first_tile_group == 0, via check_frame_header_copy) — the §5.18.1 layout (NumTiles / tileBits / TileSizeBytes) for a continuation comes from the recorded first tile group's header (FrameHeaderCopyRecord), since a continuation reads frame_header_copy() not a fresh tile_info(). A continuation's structure starts after the optional frame_header_copy() region (both the frame_header_present_flag == 1 copy arm and the frame_header_present_flag == 0 no-copy arm are handled); the structure-start bit is exact (2 prefix bits + NumFrameHeaderBits) whether or not the copy matched, so the framing still runs after a frame-header/copy-bits-mismatch (a copy TRUNCATION leaves no structure bits, so it does not). A continuation with no recorded first-header layout (Unknown routing) leaves the structure unparsed. inspect surfaces the per-tile framing (tile_framing array: tile_num / size_field_offset / tile_data_offset / tile_size, plus tile_framing_defect) on the completed FIRST tile group only — a continuation's view needs the validator's pairing state (the layer-triple key + the segmenter's FrameBoundary decisions incl. the Ambiguous poison), so the per-OBU inspector omits it rather than mis-pair interleaved layers (named residual: a stateful inspect surface); a continuation's framing IS validated via the recorded first-header layout. §8.2 checkability decision (grounded): a zero-size non-bridge tile IS framing-provable — init_symbol(0) (§8.2.2, mirror 08:87) starts SymbolMaxBits at 8*0-15 = -15, the counter only decreases (08:327), and §8.2.4 requires >= -14 at exit_symbol() (08:342), unsatisfiable regardless of tile content — emitted as tile-payload/zero-size-tile (bridge tiles exempt: they read no size field and take the region differently). The exit_symbol() conformance for NONZERO tiles (the exact exit value, the trailing one-bit at trailingBitPosition, §8.2.4) depends on the symbol decoder's consumption during decode_tile() and stays a named residual. CHILD TERRITORY (named residuals, split further): decode_tile() and the §5.20.2-.10 block syntax / §8 entropy decode / §9 table consumers / pixel reconstruction; the bridge and use_bru/BruTileActives size-skipping arms (mirror :8559 / :8585) are dead on the intra-complete tile-group path (IsBridge == 0, use_bru == 0) and inter-gated (owned by frame-header-inter-reference-paths). The AV2-5.19-TILE-GROUP handoff (headerBytes + payload_size + tg_start/tg_end + the recorded boundary) feeds this framing slice."

