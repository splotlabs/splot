e referenced MFH's STORED dims via the dedicated frame-header/mfh-frame-size-exceeds-sequence-max: frame_header_core_checks resolves the cur_mfh_id > 0 record (shared resolve_frame_mfh_record §7.3.8.7 discipline) and compares the record's stored mfh_frame_size dims against the active maxima REGARDLESS of frame_size_override_flag AND of the frame-header core parse outcome — so a frame overriding to in-range dims no longer hides an out-of-range MFH, and a truncated/malformed frame-header remainder no longer silences the check (the predicate needs only the resolved record + the sequence maxima, so it runs at the load_sequence_header point before the core parse). An omitted mfh_frame_size infers the maxima (§5.18.2, mirror :4101) and stays silent; an unresolvable MFH stays silent. No double-fire on the override==0 default path: the §6.17.2 stored-MFH rule is the single home and the §6.17.4.1 derived frame-header/frame-size-exceeds-sequence-max defers by parsed PATH (frame_size_override_flag == 0 on the resolved cur_mfh_id > 0 frame), NOT by dimension equality — so an override==1 frame coding the same out-of-range dims fires both rules (tracked on AV2-6.17.2-FRAME-HEADER-INFO-SEMANTICS / AV2-5.18.4-FRAME-SIZE). Remaining residual (keeps validate=partial): mfh_deblocking_filter_update is recorded but the deblocking parse it gates lands with frame-filtering-deblocking-gdf-cdef (AV2-5.18.5-FILTERING)."

