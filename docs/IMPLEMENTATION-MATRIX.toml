[[feature]]
id = "AV2-4.11.6-LEB128"
name = "LEB128 descriptor"
category = "normative"
kind = "bitstream-syntax"
spec_sections = ["4.11.6"]
sources = ["https://av2.aomedia.org/v1.0.0/index.html"]
crate = "splot-core"
module = "crates/splot-core/src/leb128.rs"
openspec_change = "parse-annexb-and-obu-headers"
tracking_issue = ""
owner = "core"
risk = "high"
notes = "AV2 LEB128 is byte-aligned, up to 8 bytes, bounded to u32, and permits non-minimal encodings. §4.11.6 states exactly two requirements of bitstream conformance (docs/spec/av2/1.0.0/04-conventions.md#s-4-11-6, lines 657-664): the returned value is <= (1 << 32) - 1, and the MSB of leb128_byte is 0 when i == 7. read_leb128 (crates/splot-core/src/leb128.rs) enforces both as Error::InvalidLeb128, which the validator converts into bitstream/parse-error (crates/splot-validate/src/validator/diagnostics.rs::parse_error_diagnostic). No LEB128-specific rule_id remains because the spec carries no further locally-decidable constraint."

