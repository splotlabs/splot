ng). The parser ALSO flags an out-of-NUM_REF_FRAMES ref_frame_idx (a non-conformant CeilLog2(NumRefFrames) with NumRefFrames > 16, decidable from the active sequence alone, frame_header_core_checks). reference-state-and-random-access adds the §6.17.2 RAS long_term_id_in_use(RefLongTermId[ ref_frame_idx[i] ]) == 1 check (frame-header/ras-ref-long-term-id-not-in-use, mirror :4615-4616): a per-slot RefLongTermId is now tracked in the §7.23 reference-state model (reference_state.rs SlotFacts.long_term_id) from a KEY frame's long_term_id_plus_1 - 1 (§5.18.2 mirror :4231-4239; every other refresh sets -1), and reference_state_checks fires when a RAS frame's proven-valid selected slot's RefLongTermId is not in the frame's own ref_long_term_id list — a proven-valid -1 (non-long-term) slot is never in-use and fires; an Unknown/ProvenInvalid slot drops to silence. REACHABILITY RESIDUAL: the rule fires only for max_mlayer_id != 0 RAS frames (whose refresh is read explicitly so the inter parse reaches ref_frame_idx); the max_mlayer_id == 0 case stops before ref_frame_idx (the RAS refresh derivation needs unmodeled reference state) and under-reports (no false positive). Remaining reference-frame-buffer / long-term-reference availability checks (primary_ref_frame range against NumTotalRefs, NumTotalRefs bounds beyond the f(3) width, the implicit-map slot validity) need the unmodeled get_ref_frames() derivation and stay partial, never guessed."

