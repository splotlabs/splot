notes = "Opens the RECTANGULAR (non-square) partition leaf zone — the §5.20.3.2 PARTITION_HORZ and PARTITION_VERT family — by admitting a DC_PRED luma + DC chroma rectangular leaf, the first general-intra decode of a n4w != n4h block (every prior fixture, DC/SMOOTH/directional, was a square 64x64/32x32/16x16 block; a rectangular leaf was rejected up front with general_intra_non_square_block). The §5.20.3.1 partition traversal already reads the real §8.3.2 partition CDF and recurses through every partition type; the gap was only the per-leaf block decode plus reconstruction, which assumed a square block. The §7.13.2.4 DC predictor reads only the immediate in-frame left column and above row from the persistent CurrentFrameWorkspace (NO §7.13.2.1 above-right or below-left sentinels, so NO §5.20.2.3 BlockDecoded state is needed — the same property the deep-split square brick relied on, now applied to a rectangular block), so a rectangular DC leaf reconstructs correctly at any superblock position. Three minimal splot-decode changes: (1) decode_general_intra_plane_coeffs now derives the §5.20.7.27 above/left context-line OR-reduction spans as w4 = Tx_Width[txSz] >> 2 and h4 = Tx_Height[txSz] >> 2 independently from the generated §9.2 conversion tables (square is the w4 == h4 special case) — the nonzero coefficient geometry already read width and height independently; (2) new reconstruct_general_intra_block_rect and reconstruct_general_intra_block_rect_into compose the §7.14.4 dequantization over the adjusted Min(1<<log2_w,32) x Min(1<<log2_h,32) coefficient grid, the §7.15.4 inverse transform (which already applies the §7.15.4.1 sqrt(2) rescale for an odd abs(log2_w - log2_h) ratio), and the §7.14.3 residual add over the rectangular flat §7.13.2.4 DC prediction (the existing IntraRectBlockSize and intra_dc_edges_for_rect and predict_intra_dc_rect_value and write_rect_block primitives already accept a rectangular size); (3) decode_one_general_intra_rect_block dispatches the rectangular leaf, gated to DC luma + DC chroma, deriving the rectangular txSz (Max_Tx_Size_Rect under TX_MODE_LARGEST) by mapping the block width/height log2 to its §9.2 TX_SIZES_ALL index via the conversion tables (TX_64X32 luma, TX_32X16 chroma; both resolve to DCT_DCT since §5.20.8.2 get_tx_set returns TX_SET_DCTONLY for txSzSqrUp >= TX_32X32). The committed syn-hrect-intra-64x64-q120.ivf (64x64, strong horizontal LUMA edge top 60 and bottom 200, FLAT chroma U=V=128, encoded with broad decode tools disabled plus --enable-ext-partitions=0 --enable-smooth-intra=0 at base_q_idx 120) has its 64x64 superblock SPLIT via PARTITION_HORZ into two rectangular 64x32 DC_PRED leaves (confirmed by temporary instrumentation: two leaves r=0/r=8, n4w == 16, n4h == 8, DC luma). It decodes bit-exactly to the avmdec AND dav2d oracle (raw output md5 2234d07aa62a60f347917f340a964425; pinned splot frame hash 6d2e94d795d46cae62d1e2cf06cf4fe5b727b0917742745af998b002a7686142), guarded by the §8.2.4 exit_symbol() bit-exactness check: the bottom 64x32 leaf DC-predicts from the reconstructed top leaf, the top band reconstructs to 60 and the bottom to 200, chroma flat 128. The OLD code rejected this exact frame (general_intra_non_square_block). All existing general-intra fixtures still decode bit-exact. Only the oracle-verified 64x32 (n4w == 16, n4h == 8) PARTITION_HORZ DC leaf is admitted; three rejects guard the unverified surface by construction (each returns a structured decode/unsupported-feature before any coefficient read or sample write, so no desync and no output) but are not yet individually fixture-backed (deferred follow-on negative vectors): a non-DC luma rectangular leaf (general_intra_rect_non_dc_luma), a non-DC chroma rectangular leaf (general_intra_rect_non_dc_chroma), and any rectangular geometry other than the verified 64x32 (general_intra_rect_unverified_geometry). This row stays partial: non-DC rectangular luma (SMOOTH and directional, which need rectangular §7.13.2.8 and §7.13.2.13 predictors plus the §7.13.2.1 sentinels), non-DC rectangular chroma, rectangular leaves whose DC neighbour edge needs the §7.13.2.1 above-right or below-left sentinels, the §5.20.3.2 extended HORZ3/VERT3/HORZ4A/B/VERT4A/B rectangular sub-shapes beyond the verified 64x32, non-64x64 frames, inter prediction, in-loop filters, and live AVM or dav2d invocation in CI remain unimplemented."

