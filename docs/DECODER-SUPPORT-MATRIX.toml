notes = "Source-backed scheduler-free `splot-recon` AV2 §7.17.7.2 filter-choice process `deblock_filter_choice(s, t, params)` choosing the deblocking filter width (0 through maxWidthPos) from the two perpendicular edge sample lines s (the first row or column of the edge) and t (the last, count-1 row or column). It returns 0 immediately when qThr or sideThr is 0, estimates the second derivative secondDeriv of indices -2 through 1 of the samples at the edge from both lines, then walks the threshold cascade (sideThr, sideThr shifted right by 2, sideThr shifted right by 3, (sideThr times 3) shifted right by 4, and the per-distance (sideThr times dist) shifted right by 4 and qThr times Q_First[dist minus 4]) widening the chosen width while the local curvature stays under threshold and stopping at the first threshold it exceeds. The spec directional-derivative gradient term is asymmetric (the negative side uses s[-1] minus s[-2], the positive side uses s[0] minus s[1]); both are transcribed exactly and confirmed by an adversarial spec re-trace. boundary indexes the spec s[0] and t[0] in each line; the §7.17.3 widths maxWidthNeg and maxWidthPos and the §9.2 Q_First array (a fixed-size array of length DBL_REG_DECIS_LEN equal to 9) are caller-resolved (Q_First lives in splot-core conversion which splot-recon cannot reach), as are the per-edge sample gathering into s and t and the §7.17.5 qThr and sideThr thresholds. Total and panic-free: every sample access stays within the validated window from boundary minus maxSamplesNeg through boundary plus maxSamplesPos minus 1 (with the unconditional s[3] read covered for every maxWidthPos greater than 1, and the deeper negative reads guarded by the matching maxWidthNeg conditions), line lengths are validated before any read, widths are validated to be 1 through 8, the i64 arithmetic cannot overflow, and the fixed-size Q_First makes the Q_First[dist minus 4] lookup in bounds. Strictly additive and no-output-change (`pub` items with no