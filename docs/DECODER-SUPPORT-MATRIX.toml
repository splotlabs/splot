notes = "Historical fail-closed support row for deriving proven active Wiener NS LR source-bound facts. `TileLoopRestorationRootFrontier` retains active §7.20.1 `WienerNsLrSourceBlock` entries with plane, luma 4x4 row/column, selected LR unit row/column, current-plane block coordinates and size, tile-local luma source/stripe bounds, and full-frame luma Y extent for later §7.20.3 chroma luma-source pre-clipping. The tile CDF subset carries the §9.3 Wiener NS length, UV-symmetry, and base CDF rows so the traversal can consume the §5.20.10.6 entropy-coded per-unit Wiener NS filter syntax required by local decoder mission chroma planes before retaining source-bound facts; the decoded coefficients are not exposed or applied. Source-bound derivation carries the sequence `disable_loopfilters_across_tiles` flag: tile-clamped luma extents are used when it is set, otherwise frame-wide luma extents are used. `lr-source-read-frontier` supersedes this row with source-read derivation for non-classified Wiener NS paths and with the live local decoder mission §7.20.4 classified-Wiener gate. This row does not claim loop-restoration filtering/reconstruction, PC-Wiener classification, chroma Wiener NS filtering, switchable LR, SDP PlaneStart/PlaneEnd LR traversal, temporal/reference Wiener state, 10-bit output, reference refresh, or successful local decoder mission decode."

