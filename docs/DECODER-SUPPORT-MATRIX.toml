6 full pels ref 0 has_neighbour=false; SB1 @ MI(0,16) in the SECOND superblock NEARMV NewMvContext 3 reconstructing col 48 from SB0 across the superblock boundary via the §7.12.2 stack, NOT the zero fallback): the only decoder change over DECODE-INTER-MVSTACK-SPATIAL is the §5.18.3 frame-size gate in validate_inter_frame_core, which now admits a single superblock row (height 64, width a multiple of 64) instead of exactly 64x64; the §5.20.2.1 SB raster loop, the frame-wide find_mv_stack grid, decode_inter_blocks, and the tile-payload boundary derivation were already geometry-agnostic — validated by §8.2.4 exit_symbol() (NO hardcoding). This row stays partial: a full 2-D superblock grid (both dimensions > 64) is REJECTED (inter_unsupported_frame_size) because a non-leftmost non-top superblock's §7.12.2 above-right and below-left scan positions reach a not-yet-decoded superblock; the skip == 0 residual is still gated to the top-left 64x64 block (so the admitted multi-SB frame is skip == 1); the existing >= 32x32-leaf, single-reference, no-tools, and spatial-only-find_mv_stack gates are unchanged, so all existing inter (zero-MV 4e1bd39f, sub-pel a0e82de3, residual ab2b067a, mvstack e5b581a5) and general-intra fixtures stay byte-identical. The single-superblock COLUMN (64x128) is analytically correct and was verified bit-exact locally, but it is REJECTED by the gate (inter_unsupported_frame_size) — not yet admitted — pending its own committed 3-oracle fixture (deferred follow-on); only the ROW is admitted and committed. In-loop filters and live AVM/dav2d invocation in CI remain unimplemented."

