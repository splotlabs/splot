notes = "Eighth brick of the AVM-oracle general intra decode path: relaxes the frame-size admission from a single superblock row (height 64) to also a single superblock column, admitting frames whose width and height are positive multiples of 64 with width == 64 or height == 64. The §5.20.2.1 superblock raster loop already iterates rows and columns (clear_left_context per superblock row) and the DC path reads above neighbours, so a second-row superblock DC-predicts its luma from the reconstructed first-row neighbour. The single-row-or-column restriction keeps every full-superblock SMOOTH chroma block free of a decoded above-right neighbour (a row-0 block has no above; a rightmost-column block has no above-right), so the §7.13.2.1 AboveRow[w] sentinel this path builds by edge-clamping equals the spec value; a 2-D grid is rejected because a non-rightmost row>0 superblock's above-right IS decoded (clear_block_decoded_flags marks BlockDecoded[-1][x] up to (MiColEnd - c) >> subX, exceeding the superblock width). The committed syn-2sbcol-intra-64x128-q80.ivf (two vertically stacked 64x64 DC superblocks, top luma 80, bottom luma 180, chroma 120/130) decodes bit-exactly to the avmdec and dav2d oracle (raw output md5 bd09ea820e68abdc002e80c8c4e30bb7; raw outputs agree, recorded in LOCAL-REFERENCE-EVIDENCE.toml; pinned splot frame hash asserted by the multi_row oracle test); all single-row 64x64 and 128x64 fixtures are unchanged. 2-D grid frames are extended by general-intra-grid (DECODE-GENERAL-INTRA-GRID). This row stays partial: distinct content needing directional luma, SMOOTH chroma on sub-partitioned blocks, partial (non-multiple-of-64) frames, multiple tiles, inter prediction, in-loop filters, and live AVM or dav2d invocation in CI remain unimplemented."

