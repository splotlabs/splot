notes = "Completes the §7.13.2.8 MIDDLE-angle zone (90 below pAngle below 180, D135 and D157 already done) by admitting the §7.13.2.8 D113_PRED directional luma mode (pAngle 113, canonical §9.2 mode 5, AngleDeltaY == 0) over a REAL reconstructed above edge plus its uv_mode == 0 directional-follow D113 chroma. D113 is VERTICAL-LEANING (pAngle near 90): dx = Dr_Intra_Derivative[180 - 113] = Dr_Intra_Derivative[67] = 24 and dy = Dr_Intra_Derivative[113 - 90] = Dr_Intra_Derivative[23] = 170 (§9.2, confirmed against the committed Mode_To_Angle[5] == 113 and the Dr_Intra_Derivative[90] table). Most projections take the §7.13.2.8 ABOVE branch (base >= -(1 + mrlIndex)) and land on a NONZERO shift for 2940 of the 4096 luma samples, so it genuinely exercises the luma §7.13.2.8 IDIF 4-tap Dr_Interp_Filter over the real reconstructed above row plus diagonally-above-left corner — unlike D135 (every shift == 0, the IDIF reduces to a sample copy) and complementary to D157 (mostly LEFT-branch). This is purely a wiring and fixture brick: the §7.13.2.8 luma IDIF 4-tap kernel (predict_intra_middle_directional_angle_rect_idif_into, DECODE-GENERAL-INTRA-IDIF-D157 and RECON-INTRA-MIDDLE-DIRECTIONAL-ANGLE-PREDICTION) and the real §7.13.2.1 corner builder (build_directional_middle_edges (true, true) arm reading CurrFrame[plane][y-1][x-1], DECODE-GENERAL-INTRA-DIRECTIONAL-CORNER) both already exist and are reused UNCHANGED. The production luma route resolves mode value 5 through `IntraYMode::mode_to_angle`; `rect_luma_plan` applies `AngleDeltaY` and rectangular wide-angle mapping and dispatches pAngle 113 as `RectLumaPlan::Middle` to the middle-angle reconstruction path, while the D113-follow chroma (SupportedChromaMode::D113Follow, resolved when uv_mode == 0 over the D113 luma makes §5.20.5.3 return UVMode == D113_PRED, AngleDeltaUV == 0) routes to the same function on the chroma plane (the enableIdif == 0 bilinear branch). D113 is decoded via the §5.20.5.3 y_mode_offset escape (y_mode_offset == 2 -> modeIdx 9 -> modeDelta 29 -> Reordered_Y_Mode[8] == D113_PRED) at §8.3.2 ctx == 0 (the DC neighbour stored a non-directional IntraJointMode 0). The committed syn-d113-intra-128x128-q80.ivf (128x128 = two superblock columns by two rows: the top-left, top-right, and bottom-left 64x64 superblocks DC_PRED — uniform top 100, bottom-left a vertical gradient coded DC; BOTTOM-RIGHT 64x64 superblock at frontier.r == 16, frontier.c == 16, haveLeft and haveAbove codes D113_PRED luma plus uv_mode == 0 directional-follow D113 chroma) decodes bit-exactly to the avmdec AND dav2d oracle (raw output md5 ba857e73ad624d0409d1189b387d1ef7; pinned splot frame hash d32bc2b11585e7ea55f0d2401f18402c55e781c0a861bb613b55f5dc26a2a395), guarded by the §8.2.4 exit_symbol() bit-exactness check. Confirmed by temporary instrumentation (since removed): the bottom-right block decodes y_mode == IntraYMode(5) (canonical D113), angle_delta_y == 0, frontier.r == 16 (row>0), dir == Some(D113), chroma == Some(D113Follow). The OLD code rejected this exact frame (general_intra_non_dc_chroma_mode, verified by building origin/main and decoding the fixture). The `directional_luma_always_plans_through_the_rect_planner` and `classifies_rect_directional_luma_angles` tests cover D113 through the current planner, while the D113 reconstruction and oracle tests pin the claimed edge and output behavior. The 77-byte q192 fixture adds explicit D113 chroma over DC luma at the no-neighbour top-left and matches both AVM decoders and Splot byte-for-byte; the obsolete general_intra_directional_d113_chroma_neighbour reason is removed. D113 luma and D113-follow chroma at every top-left, first-row, first-column, sub-partitioned, and non-64x64 position are now planned by the generic §7.13.2.8 rectangular directional planner; the general_intra_d113_unverified_position whitelist is retired. This historical row remains partial because its direct external-oracle evidence is fixture based and live AVM or dav2d invocation is not part of CI; later rows own broader positions, angle deltas, MRL, IBP, wide-angle, neighbour reorder, subpartitions, inter prediction, and filters."

[[row]]
id = "general-intra-angle-d45"
name = "General intra D45 zone-1 one-sided luma + follow chroma reading the real above-right"
feature_id = "DECODE-GENERAL-INTRA-ANGLE-D45"
spec_sections = ["5.20.5.3", "5.20.7.25", "5.20.7.27", "7.13.2.1", "7.13.2.7", "7.13.2.8", "8.2.4", "9.2"]
