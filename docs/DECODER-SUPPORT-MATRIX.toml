local_reference_evidence = []
notes = "Partial support row for parsing supported AV2 §5.20.5.3 and §5.20.5.4 IntrABC mode-info plus §5.20.6.1 and §5.20.6.3 `TX_MODE_SELECT` luma transform-size records in the local decoder mission Wiener NS LR runtime path. A reconstruction bridge (`wienerns_lr/recon.rs`) threads an optional reconstruction sink through the selectable residual-chunk decode that reconstructs the verified NON-IntrABC general-intra DC subset into a `CurrentFrameWorkspace<u16>` in decode order using the existing reconstruction primitives; the public decode runs the walk with NO sink and stays fail-closed. The sink wiring is proven by focused `recon::tests` and the `frontier_reconstruction_bridge_populates_a_workspace_region` test. With PR #497's per-block §5.20.10.2 CCSO read the first-superblock parse is now AVM-faithful (the former 2x TX_16X32 vs 4x TX_16X16 `txb_skip` desync is resolved), so the bridge reconstructs the verified DC subset BIT-EXACT vs the AVM pre-filter oracle: the frame-origin §5.20.5.3 `DC_PRED` 16x16 luma leaf is bit-exact (all `68`), proven by `frontier_frame_origin_dc_block_reconstructs_bit_exact_against_prefilter_oracle`. The sink reconstructs ONLY genuinely-proven-correct blocks and DEFERS everything else, so the whole reconstructed region is strictly bit-exact vs the oracle (1024 luma samples, zero diff — no confident-wrong workspace sample). It defers, never writes: NON-DC luma; the first-SB chroma leaf (`SMOOTH`, not `DC`); a non-`all_zero` NON-SQUARE `DC_PRED` leaf (the `TX_16X64` rectangular-residual inverse transform is unproven); any IST/FSC leaf; a frame with a non-zero quantizer delta or matrix; and any `DC_PRED` block whose §7.13.2 edges border a deferred neighbour. Full-superblock bit-exact needs SMOOTH/directional/CfL prediction, the rectangular and IST/FSC residual inverse transforms, and quantizer-delta-aware dequant (follow-on rows), then chroma/IntrABC reconstruction. The local stream's active CfL mode-info prerequisite is tracked by `cfl-chroma-mode-frontier`; follow-on rows admit the observed luma-only transform leaves, retain SDP `CflAllowedInSdp`, add the pre-tile unsupported-tool gate, consume active intra IST metadata, and hand off chroma CCTX metadata plus non-DCT chroma coefficient syntax for LR tx-skip records. This row now threads each selectable luma transform record's full-block fill fact into the §8.3.2 `all_zero` context, consumes §5.20.6.3 partition syntax for observed luma-only narrow leaves and falls back to their actual 2x8 and 2x16 4x4-grid extents only when applying the consumed partition would produce empty geometry, consumes active luma `fsc_mode` metadata, derives the §5.20.7.27 `useFsc` FSC coefficient branch through the existing residual handoff, consumes the observed active IntrABC prelude (`use_intrabc`, `read_skip`, `intrabc_mode`, DRL, and optional precision), uses the bounded §7.12.2 IntrABC fallback block-vector stack only when tile-local prelude state proves no prior IntrABC spatial/ref-MV-bank candidates exist, consumes §5.20.7.13 and §5.20.7.20 NEWMV `assign_mv` and `read_mv` syntax into a retained block vector, and converts retained NEARMV/NEWMV vectors into checked luma current-frame prediction geometry against tile-local padded MI-domain luma bounds, including BILINEAR source sample envelopes, subpel phase, and conservative §6.19.7.12 source-overlap rejection, for the §7.13.3.18 block inter prediction process. The live local decoder mission probe now advances past the former `unsupported_wienerns_lr_live_transform_record_fsc_mode`, `unsupported_wienerns_lr_selectable_transform_records_empty_transform`, `unsupported_wienerns_lr_selectable_transform_records_intrabc`, `unsupported_wienerns_lr_selectable_transform_records_intrabc_newmv`, and `unsupported_wienerns_lr_selectable_transform_records_intrabc_prediction` stops and reaches `unsupported_wienerns_lr_selectable_transform_records_intrabc_currframe_samples` at byte offset 110; the progress is semantic at the first active IntrABC block, not a later byte position. This row feeds supported selectable transform extents and §5.20.7.27 coefficient skip/EOB facts into live `LrTxSkip` storage for admitted subsets only, and the live path stops before calling the `recon-intrabc-current-frame-copy` storage primitive because decoded current-frame samples are not populated. It does not claim IntrABC sample availability or block-copy output, active MRL prediction, DIP, intra-edge, IBP prediction semantics, broad FSC or IDTX reconstruction, CfL prediction, chroma residual coordinate handoff, decoded CurrFrame or CdefFrame sample population, `FilterClass`, `SubclassLookup`, loop-restoration filtering or output, reference refresh, AVM and dav2d byte equality, or successful local decoder mission decode."

