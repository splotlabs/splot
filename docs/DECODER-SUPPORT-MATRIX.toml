notes = "Implements the AV2 §7.3.6/§7.4.3 coded-video-sequence boundary at every repeated CLK. The runtime parses and validates the CLK-referenced sequence, flushes pending implicit output in display order, recreates scheduler slots for the new NumRefFrames, invalidates every old reference by replacing RuntimeReferenceBuffer, resets its frame counter, activates the new sequence for the key and every following inter frame, and preserves the output history. Film-grain models remain available because §7.3.8.8 does not reset them; content-interpretation state is not consumed by decoded pixel output, and quantizer-matrix frame state is already scoped to each frame rather than cached across temporal units. Raw output concatenates valid per-frame visible formats and bit depths. A Y4M stream accepts changed sequence parameters only when visible dimensions, pixel format, and bit depth still match its one stream header; incompatible crop or bit-depth transitions return a typed output error before caller-visible bytes or CLI output replacement. The 52-byte compatible and 56-byte crop-transition AVMenc-derived fixtures validate clean. Fixed splot, pinned AVM revision 457cd58681a747465661baccb1f32095bc5b7774, and current AVM revision 3935f4bf31ee774177d9300341bbbaf5b6116500 agree byte-for-byte on complete raw output SHA-256 a29b83d3b3d8b9dc2336e7b29e8a9f9ea64b3cdf18f5816d82ed64e73a2c964c and 215d5e9d52a581a9ada3ba4d153016f2a65012661fc1e67289bd27e3ff74af0e. Additional composed proofs cover 8-bit to 10-bit transition and a following inter frame under the newly active sequence/reference state; malformed EOF and resource/output limits remain typed and transactional."

