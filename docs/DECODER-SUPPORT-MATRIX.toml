notes = "Thirteenth brick of the AVM-oracle general intra decode path and the first directional-follow CHROMA prediction: the §7.13.2.8 D135_PRED chroma mode the minimal-tool avmenc pairs with a D135 luma block, which the prior chroma admission rejected (general_intra_non_dc_chroma_mode). The §5.20.5.3 read_intra_uv_mode decodes uv_mode == 0 over the directional luma, so get_intra_uv_mode_set(0) returns YMode (the directional-follow branch, §5.20.5.3 mirror line 11316) and the spec sets AngleDeltaUV = AngleDeltaY (line 11288); for the supported luma D135 (AngleDeltaY == 0) the chroma resolves to UVMode == D135_PRED, AngleDeltaUV == 0 — a plain §7.13.2.8 middle-angle chroma intra prediction, NOT CfL (UV_CFL_PRED, §5.20.5.3 line 11268), CCTX, or MHCCP (those read separate cross-component syntax and are out of scope and still rejected). Confirmed by temporary mode instrumentation (since removed): the committed fixture decodes y_mode == 4 (D135), uv_mode == 0, resolved UVMode == 4 (D135). supported_chroma_mode distinguishes directional-follow D135Follow from explicit non-follow D135, and both variants now share the total §7.13.2.1 edge preparation and §7.13.2.8 bilinear reconstruction. The runtime admits D135Follow and explicit D135 for every valid block position and neighbour state. In the no-neighbour case the chroma plane has no above/left neighbour so the §7.13.2.1 prediction edges reduce to the flat fallbacks (8-bit: AboveRow 127, LeftCol 129, shared corner 128) and the enable_intra_edge_filter/IDIF/upsample synthesis is a no-op; pAngle 135's dx = dy = Dr_Intra_Derivative[45] = 64 give shift == 0 so the §7.13.2.8 bilinear middle-angle predictor (enableIdif == 0 for chroma, since enableIdif = plane == 0) is a sample copy of the flat fallback edge. The new reconstruct_general_intra_chroma_directional_first_into builds that prediction via the shared splot-recon predict_intra_middle_directional_angle_rect_into (the SAME predict_directional_noneighbour helper the luma D135 path uses) and adds the §5.20.7.27 chroma residual through reconstruct_general_intra_block_with_prediction. Over the flat fallback edges the D135 chroma prediction is a genuine 135-degree anti-diagonal split (upper-right 127, lower-left 129, anti-diagonal 128), so with the diagonal chroma residual both U and V reconstruct as a genuine directional pattern (17 distinct values each), NOT a flat DC level. The committed syn-dfchroma-intra-64x64-q80.ivf (one 64x64 D135 luma block, top half near 40/bottom half near 210, 135-degree anti-diagonal chroma) decodes bit-exactly to the avmdec AND dav2d oracle (raw output md5 09fc23f0bced8ab5b9562d6d2478af1c; raw outputs agree, recorded in LOCAL-REFERENCE-EVIDENCE.toml; pinned splot frame hash 628b759dcb63356ad3174063652c54d7ebf6f54d1566ab9f1b64b3a74542154f asserted by the dfchroma oracle test), guarded by the §8.2.4 exit_symbol() check; all existing general-intra fixtures still decode bit-exact (the original syn-hedge fixture, which uses the uv_mode == 1 DC chroma, is unchanged). The follow-up syn-d135-chroma-nonfull-32x32-q7.ivf is a deterministic 66-byte current-AVMenc fixture whose only non-full-superblock 32x32 block has DC luma, explicit D135 chroma, and neither neighbour available. Pre-fix splot rejected it at byte 64 with general_intra_directional_chroma_neighbour; fixed splot, pinned avmdec, and current avmdec emit byte-identical 1,536-byte raw I420 SHA-256 9a1caf04eeed5402053edc129525d145477fcac645984e84ea2ec735ca4d47fa. Together with the existing real-edge fixtures and 8/10-bit frame-origin/tile-origin unit coverage, this removes the D135/D135Follow neighbour/position gate. This row stays partial for other directional chroma angles, non-zero AngleDeltaUV, CfL/CCTX/MHCCP, unsupported transform and partition syntax, inter prediction, in-loop filters, and live AVM invocation in CI."

