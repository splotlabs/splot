notes = "Opens the 10-bit (AV2 §6.4.1 Table 6.3 bit_depth_idc == 0) reconstruction zone — the first 10-bit decoded output. The whole general-intra reconstruction graph in splot-decode was hard-coded to 8-bit DecodedFrame<u8> and BitDepth::Eight, and the runtime sample-storage gate rejected every 10-bit sequence with unsupported_bit_depth before any reconstruction. The splot-recon primitives (predict_intra_dc_rect_value, reconstruct_transform_block_residual, dc_quantizer and ac_quantizer, InverseTransform2dOuter::resolve, CurrentFrameWorkspace, DecodedFrame, and the hash/raw/Y4M emitters) are ALREADY generic over T: ReconSample (u8 and u16) and already accept a runtime BitDepth, so the change is purely threading T plus a runtime bit_depth: BitDepth (derived from bit_depth_idc: Eight->u8, Ten->u16) through the splot-decode orchestration: new_general_intra_workspace, every reconstruct_general_intra_*_into in pipeline::reconstruct.rs, the §7.13.2.1 edge builders, and the reconstruct_general_intra_block and _with_prediction and _rect residual helpers in tile_payload/general_intra_residual.rs. The §7.13.2.1 no-neighbour fallbacks (AboveRow = (1 << (BitDepth - 1)) - 1, LeftCol = (1 << (BitDepth - 1)) + 1, corner 1 << (BitDepth - 1)) are derived from bit_depth instead of the hard-coded 8-bit 127/129/128 (8-bit stays byte-identical: the T == u8 and BitDepth::Eight specialization reproduces them exactly). MinimalRuntimeFrame now carries an 8-bit OR 10-bit frame (MinimalRuntimeDecodedFrame), and the hash/raw/Y4M adapters dispatch on the storage arm and call the already-generic splot-recon emitters (10-bit packs each visible sample 16-bit-LE); the inter/reference path stays 8-bit only and rejects a 10-bit frame with a structured diagnostic. VERIFIED-SUBSET DISCIPLINE: 10-bit (§6.4.1 Table 6.3 bit_depth_idc==0) general-intra reconstruction is oracle-verified (avmdec AND dav2d, byte-for-byte) for the DC_PRED-luma + DC-chroma SQUARE-leaf subset across three committed fixtures — single 64x64 flat DC (syn-flat-intra-64x64-10bit-q80.ivf, raw md5 9983be8c8398de1db3127db7e6914bfa, Y=400/U=480/V=520), single 64x64 with eob>1 AC luma residual (syn-cos-intra-64x64-10bit-q180.ivf, frame hash bfec72ffcddf982499eebfa21bdfb400fc66aa96b40281298387420ef2124649), and multi-64x64-superblock DC (syn-2sb-intra-128x64-10bit-q80.ivf, frame hash ceff974fde25c8d05c9010d2a7f414845dc3a626ab3c45a9dabb08634c29dd66, left SB luma 400, right SB luma 460). The reconstruction graph is bit-depth-generic so other 10-bit shapes WOULD reconstruct, but to avoid a confident-but-unverified hash (the cardinal sin) the runtime rejects everything outside the verified subset before any output: 10-bit non-DC luma/chroma (SMOOTH/directional/PAETH) -> unsupported_10bit_non_dc_intra; 10-bit CFL -> unsupported_cfl_intra; 10-bit non-64x64 partition leaves (rectangular, or a split 32x32 or 16x16 square sub-block) -> unsupported_10bit_non_64x64_leaf; a 10-bit frame on the frozen base_q_idx==255 minimal-tier path (which hard-codes 8-bit reconstruction) -> unsupported_10bit_frozen_minimal_tier; 10-bit inter/reference-frame retention -> unsupported_10bit_reference_retention. Each of these four reject guards is pinned by a committed, validator-clean negative fixture (syn-smooth-intra-64x64-10bit-q80.ivf, syn-split-intra-64x64-10bit-q110.ivf, syn-flat-intra-64x64-10bit-q255.ivf, syn-2frame-inter-64x64-10bit.ivf). The §6.4.1 decoded-frame byte budget charges 2 bytes/sample at 10-bit. The 8-bit reconstruction path stays byte-identical. In-loop filters and live AVM/dav2d in CI remain out of scope."

