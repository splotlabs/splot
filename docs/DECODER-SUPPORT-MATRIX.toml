notes = "Adds crate-private `splot-decode` symbol-read sequencing for ordinary non-FSC coefficient base/base-EOB/base-range reads after nonzero EOB and checked scan-walk handoff. `read_nonzero_coeff_base_symbols` validates caller-provided scan-entry/input matching, reads caller-resolved `coeff_base_eob` or `coeff_base` rows through `SymbolDecoder`, applies the base-EOB `+1` level bias, conditionally reads caller-resolved `coeff_br` rows when the decoded level crosses the caller-provided `baseLevels` threshold and BR is enabled, and returns decoded level summaries without writing coefficient state. Tests prove direct-read equivalence, no-consumption behavior for mismatched scan entries and reached invalid selectors, disabled CDF updates, unreachable invalid BR selector behavior, disabled BR above threshold, and input-count mismatch. SymbolEncoder roundtrip proofs additionally drive the real decode helper with bytes the encoder writes against the same default CDF rows the decoder reads (an identical tile_copy via with_row_mut), recovering the chosen base/base-EOB/base-range symbols and levels with the encode and decode CDF tiles ending in the same adapted state; this is the first context-CDF (non-bypass) coefficient roundtrip and the enabler for future context-CDF roundtrips. This row remains partial: the helper is not wired into runtime `coeffs()`, does not derive selectors from real block syntax, does not write nonzero `Level[]`, `QuantSign[]`, or `Quant[]`, does not read signs or run `read_quant`, and does not support dequantization, inverse transform, residual add, reconstruction, output expansion, reference refresh, public API, AVM/dav2d invocation, broad `decode_block()`, or broad `decode_tile()`."

