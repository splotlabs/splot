notes = "Proves the general intra decode handles a partition tree TWO levels deep, one level deeper than the syn-quad merged-quad case (a single 32x32 split). The 64x64 superblock SPLITs into four 32x32 quadrants and one 32x32 SPLITs AGAIN into four square 16x16 DC_PRED leaves (the other three quadrants stay 32x32 DC_PRED). The §5.20.4.1 partition recursion (child_calls PARTITION_SPLIT) already pushes the 16x16 children depth-first, and each 16x16 leaf's §7.13.2.10 DC intra prediction reads its in-frame left column and above row from the persistent CurrentFrameWorkspace; the §5.20.2.3 left-and-above availability for the DC predictor is frame-position-based (x==0 and y==0), so a sub-32x32 16x16 leaf correctly DC-predicts from the already-reconstructed sibling 16x16 neighbour INSIDE the parent 32x32 sub-block with NO §5.20.2.3 BlockDecoded flag state required (the DC predictor never reads the above-right or below-left sentinels that BlockDecoded gates). No production code changed: the deeper square DC split is bit-identical to the verified shared reconstruct_general_intra_block_into and partition-walk code, just at a smaller transform log2 and one recursion level deeper. The committed syn-deep-intra-64x64-q120.ivf (top-left 32x32 = 16x16 checkerboard 240,20,20,240; TR 130, BL 70, BR 200; chroma U=120 V=130) decodes bit-exactly to the avmdec AND dav2d oracle (raw output md5 5e3484135608ea2cd1457d4c50df7855; raw outputs agree, recorded in LOCAL-REFERENCE-EVIDENCE.toml; pinned splot frame hash 73123e51c66787b59fb6b93a6221e9d78a550c6e0d1c4e0c1adfd21a41ed39ab asserted by the deep_split oracle test), guarded by the §8.2.4 exit_symbol() check; all existing general-intra fixtures still decode bit-exact and a non-DC or rectangular-leaf deeper split still rejects with decode/unsupported-feature (verified). This row stays partial: the §5.20.2.3 per-block BlockDecoded flag state itself is still deferred (only needed for non-DC or SMOOTH sub-superblock blocks reading the §7.13.2.1 above-right or below-left sentinels, which stay gated to the full 64x64 superblock); rectangular-leaf and non-DC sub-32x32 partitions, non-64x64 frames, inter prediction, in-loop filters, and live AVM or dav2d invocation in CI remain unimplemented."

