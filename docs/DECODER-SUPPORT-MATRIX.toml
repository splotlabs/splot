notes = "Fifth brick of the AVM-oracle general intra decode path: split-partition multi-block frames. `decode_general_intra_partition_tree` walks the full §5.20.3.1 partition tree depth-first, reading partition-split symbols and per-block syntax interleaved on one symbol decoder and the tile CDFs, maintaining the §5.20.4.1 MI-size partition context across blocks. Each PARTITION_NONE leaf decodes its §5.20.5.3 mode info and §5.20.7.27 Y/U/V coefficients and reconstructs into a persistent CurrentFrameWorkspace in decode order, so each non-first block's §7.13.2 DC prediction reads its already-reconstructed above/left neighbours; the §8.3.2 coefficient contexts come from the persistent TileCoeffContextState neighbour lines. The single-block path is unified through this driver. The committed syn-quad-intra-64x64-q80.ivf (four flat quadrants splitting Horz/Vert/Vert into four square 32x32 DC blocks) decodes bit-exactly to the avmdec/dav2d oracle (pinned frame hash c54ed4e9...). This row stays partial: it is gated to DC_PRED square blocks of at least 8x8 luma with chroma present (mode contexts reduce to the tile-origin ctx 0) with the §8.2.4 exit_symbol() guard; non-DC modes, non-square (rectangular leaf) partitions, sub-8x8 luma leaves and luma-only blocks (rejected before the mode read), multiple tiles, non-64x64 frames, inter prediction, in-loop filters, and live AVM or dav2d invocation in CI remain unimplemented."

