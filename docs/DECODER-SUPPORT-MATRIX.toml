notes = "Widens the inter decode arc from a single superblock ROW/column (DECODE-INTER-MULTI-SB-SPATIAL) to a full 2-D superblock GRID — width AND height each a positive multiple of 64, iterated by the §5.20.2.1 decode_tile() raster loop (sb_row outer, sb_col inner) — where a block in the SECOND superblock ROW predicts its motion vector from an already-decoded SB-row-0 superblock ACROSS the superblock-row boundary via the frame-wide §7.11/§7.12 find_mv_stack grid (a further prerequisite for real-content scale; local decoder mission is 1920x1080). The committed syn-grid-inter-128x128-q80.ivf (project-owned synthetic input: frame 0 four flat 64x64 luma superblocks 100/150/80/200 + flat chroma, frame 1 shifted left 6 luma samples; broad decode tools incl. GDF/cdef/deblocking/restoration/ccso/cfl/mhccp/cctx/qm/ibp/mrls/intra-edge-filter/angle-delta/ist/inter-ist/intra-dip/idtx-intra/smooth-intra/paeth-intra/bawp/cwp/tcq/trellis/all-warp/tip/opfl-refine/refinemv/masked-wedge-interintra-onesided-diffwtd-compound/joint-mvd/adaptive-mvd/flex-mvres/ref-frame-mvs/refmvbank/drl-reorder/mv-traj/high-motion/inter-ddt/skip-mode/bru/global-motion/tx-partition/rect/ext/uneven-partitions/parity-hiding/mvd-sign-derive disabled; --qp 80 --sb-size 64 --min-partition-size 64 --max-partition-size 64) is a two-frame 128x128 stream: frame 0 = OBU_CLOSED_LOOP_KEY (four DC_PRED intra superblocks, decoded by the general-intra 2-D grid path), frame 1 = OBU_REGULAR_TILE_GROUP whose four 64x64 superblocks are each a single 64x64 single-reference inter block, all skip==1. avmdec --rawvideo --i420 and dav2d --demuxer ivf decode the whole stream byte-for-byte identically (decoded-output md5 897bf67e72ec04cb7275fae08eab700c, 49152 bytes); the fixture validates clean and is registered in the conformance corpus with the reciprocal LOCAL-REFERENCE-EVIDENCE entry lref-avm-dav2d-syn-grid-inter-128x128-q80. THE FIRST 2-D-GRID INTER FRAME NOW DECODES BIT-EXACT (confirmed via splot's own instrumentation: SB0 @ MI(0,0) NEWMV col 48 = +6 full pels ref 0 has_neighbour=false; SB1 @ MI(0,16), SB2 @ MI(16,0), SB3 @ MI(16,16) NEARMV NewMvContext 3 reconstructing col 48 from SB0 — SB2/SB3, in the SECOND superblock ROW, predict across the superblock-row boundary, NOT the zero fallback): the only decoder change over DECODE-INTER-MULTI-SB-SPATIAL is the §5.18.3 frame-size gate in validate_inter_frame_core, which now admits a full 2-D grid (width and height each a multiple of 64) instead of a single SB row/column. NO find_mv_stack change was needed: the §7.12.2.6 Scan point process invokes the add-reference-MV step only when `is_inside(mvRow, mvCol)` AND `RefFrames[mvRow][mvCol][0] has been written for this frame (this checks that the candidate location has been decoded)` — both conditions are already modelled by NeighbourMvGrid::get returning None for an out-of-bounds position (is_inside == 0) OR an undecoded MI cell (RefFrames not written), and the §5.20.2.1 raster order guarantees a later superblock's above/above-right/below-left probe into a not-yet-decoded superblock reads an unwritten cell → no candidate, exactly as the spec's availability gate prescribes — validated by §8.2.4 exit_symbol() (NO hardcoding). This row stays partial: a partial (non-multiple-of-64) frame size is REJECTED (inter_unsupported_frame_size); the skip == 0 residual is still gated to the top-left 64x64 block (so the admitted grid frame is skip == 1; a multi-superblock skip==0 residual stays rejected); the existing >= 32x32-leaf, single-reference, no-tools, and spatial-only-find_mv_stack gates are unchanged, so all existing inter (zero-MV 4e1bd39f, sub-pel a0e82de3, residual ab2b067a, mvstack e5b581a5, SB-row 477a993d) and general-intra fixtures stay byte-identical. The deferred §7.12.2 temporal/compound/warp/ref-MV-bank/derived-SMVP/DRL-reorder candidates inherited from DECODE-INTER-MVSTACK-SPATIAL remain rejected-once-a-neighbour-exists. In-loop filters and live AVM/dav2d invocation in CI remain unimplemented."

