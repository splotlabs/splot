notes = "Wires the staged AV2 §5.20.7.29 `Lossless` ordinary coefficient branch into the general-intra runtime subset. Runtime coefficient decode derives `Lossless` from segment facts, forces intra non-FSC transform units to TX_4X4, selects DCT_DCT before lower non-lossless `txSet` handling, suppresses non-lossless parity-hiding/TCQ flags for the lossless path, and threads the lossless flag into reconstruction. The committed `syn-lossless-intra-64x64.ivf` fixture carries a flat 8-bit 4:2:0 lossless DC/DC all-zero residual segment and decodes byte-exact to AVM raw SHA-256 cb11e05cb5da949c0e0f5b5a7cb310df35a96a22c45d1ada70d950859fe697d1; `syn-lossless-nonzero-intra-64x64.ivf` carries nonzero lossless ordinary coefficients and decodes byte-exact to AVM raw SHA-256 1af4a4343927b77994b57ce50d3e0b09d57dc698e2ec122d8abcdc1667d70782. Lossless non-DPCM 8-bit 64x64-superblock top-left V_PRED, H_PRED, and explicit D135_PRED luma are oracle-pinned by `syn-lossless-cardinal-y-v-intra-64x64.ivf`, `syn-lossless-cardinal-y-h-intra-64x64.ivf`, and `syn-lossless-nondc-luma-d135-intra-64x64.ivf` (raw SHA-256 1ed57e96fd8e3107284d54007af41a0974ea5f75b2adb16de2d3c9943dc5a7fc, 9b37c3e091251b52640f7574105d307a638bbefd0042e900249e3f93bc5148ea, and 71248f8ced1be4c7b0ac9a1c5b4d4eda9b616249b91b0c1464029f06e86cb942); the D135 luma fixture also verifies the lossless TX_4X4 transform-unit split handoff for reconstructed interior edges in that same top-left full-SB subset. Lossless normal-block non-DPCM H_PRED and explicit D135_PRED chroma over top-left 64x64 8-bit 4:2:0 blocks are oracle-pinned by `syn-lossless-nondc-chroma-h-intra-64x64.ivf` and `syn-lossless-nondc-chroma-d135-intra-64x64.ivf` (raw SHA-256 d72b424056b3f818fea000d6847c90733ac85e36a87396c4d8731f0d16e0820f and b0ca9c37b56e8144a85510c024dbf468738cbda9bb77218bcffbc68d4b634725). Lossless SDP/chroma-part non-DPCM H_PRED and explicit D135_PRED over top-left 64x64 8-bit 4:2:0 DC luma are oracle-pinned by `syn-lossless-sdp-nondc-chroma-h-intra-64x64.ivf` and `syn-lossless-sdp-nondc-chroma-d135-intra-64x64.ivf` (raw SHA-256 d72b424056b3f818fea000d6847c90733ac85e36a87396c4d8731f0d16e0820f and 73ffedb0ffe07b92f4f48c4da43f2572687397ad3e136e4553629de993096f5d). Lossless DPCM-Y, normal-block DPCM-UV, and both SDP/chroma-part DPCM-UV directions are verified by committed AVM oracle fixtures and share the DPCM direction handoff into residual reconstruction. Lossless non-DPCM non-DC luma outside the 8-bit 64x64-SB top-left V/H/D135 directional subset, lossless non-DPCM non-DC chroma block modes outside H/D135, SDP/chroma-part non-DPCM chroma outside the DC-luma H_PRED/D135_PRED top-left subset, active FSC, and mixed-lossless frames with active loop filters still fail closed pending AVM oracle coverage or per-segment filter lossless support. This row remains partial: FSC/IDTX lossless cases, lossless inter inputs, unverified DPCM shapes, live AVM/dav2d invocation in CI, broad `decode_block()`, and broad `decode_tile()` remain unimplemented."

