local_reference_evidence = ["docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-dav2d-syn-d157-intra-128x64-q80", "docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-syn-d157-chroma-nonfull-32x32-q1"]
notes = "First general-intra decode to ORACLE-PROVE the §7.13.2.8 luma IDIF 4-tap kernel: the §7.13.2.8 D157_PRED directional luma mode (pAngle 157, AngleDeltaY == 0) over a REAL reconstructed neighbour edge plus its uv_mode == 0 directional-follow D157 chroma. D157 is a §7.13.2.8 MIDDLE angle (90 below pAngle below 180) with dx = Dr_Intra_Derivative[23] = 170 and dy = Dr_Intra_Derivative[67] = 24 (§9.2). Unlike D135 (dx = dy = Dr[45] = 64, every projection shift == 0 so the IDIF reduces to a sample copy bit-identical to bilinear), D157's projection lands on a NONZERO shift for 2940 of its 3344 left-branch samples, so it genuinely exercises the luma IDIF 4-tap. This brick adds the §7.13.2.8 and §9.2 Dr_Interp_Filter[32][4] table to splot-recon (copied VERBATIM from the committed spec mirror) and the enableIdif == 1 luma 4-tap path predict_intra_middle_directional_angle_rect_idif_into (s = sum over t of Dr_Interp_Filter[shift][t] * Edge[base + t - 1]; pred = Clip1(Round2(s, 7)), signed sum floored by Round2 and Clip1 clamping negatives to 0), tracked by RECON-INTRA-MIDDLE-DIRECTIONAL-ANGLE-PREDICTION. The runtime maps mode value 6 to SupportedDirectionalLumaMode::D157, routing the neighbour-having luma D157 block to reconstruct_general_intra_directional_neighbour_block_into, which now dispatches on plane (enableIdif = plane == 0): luma builds the wider §7.13.2.8 IDIF edges AboveRow[-2..=w+1] and LeftCol[-2..=h+1] (the spec edge extension) and runs the IDIF 4-tap; chroma keeps the bilinear branch. The D157-follow chroma (SupportedChromaMode::D157Follow, resolved when uv_mode == 0 over the D157 luma makes §5.20.5.3 return UVMode == D157_PRED, AngleDeltaUV == 0) routes to the same function on the chroma plane (bilinear over the flat real chroma edge). D157 is decoded via the §5.20.5.3 y_mode_offset escape at §8.3.2 ctx == 0 (the SMOOTH_V left neighbour stored a non-directional IntraJointMode 2). The committed syn-d157-intra-128x64-q80.ivf (128x64: LEFT 64x64 SMOOTH_V_PRED smooth vertical gradient with DC chroma; RIGHT 64x64 D157-exact construction reading the LEFT superblock's real reconstructed right column as its §7.13.2.1 left edge at frontier.r == 0, frontier.c == 16, haveLeft and not haveAbove; flat chroma U=120 V=130) decodes bit-exactly to the avmdec AND dav2d oracle (raw md5 c8698fdb7628843971bc9e37a82391ae, sha256 bf93ca6b8f55e1fb7db2584f3e3821ad67f21018b774c6e326634362ee5ef046; pinned splot frame hash bf93ca6b8f55e1fb7db2584f3e3821ad67f21018b774c6e326634362ee5ef046), guarded by the §8.2.4 exit_symbol() check. The OLD code rejected this exact frame (general_intra_non_dc_chroma_mode, verified by building origin/main and decoding the fixture). All existing general-intra fixtures remain byte-exact; later rows make every canonical directional luma mode total. The follow-up syn-d157-chroma-nonfull-32x32-q1.ivf is a deterministic 66-byte current-AVMenc fixture whose only non-full-superblock 32x32 block has DC luma, explicit D157 chroma, and neither neighbour available. Pre-fix splot rejected it at byte 64 with general_intra_directional_d157_chroma_neighbour; fixed splot, pinned avmdec, and current avmdec emit byte-identical 1,536-byte raw I420 SHA-256 9084f7311718d3558b0e9b5ed09315a989f39b55b585d3e387fe878c436d40e7. D157 and D157Follow chroma admission is now total across every valid block position, neighbour state, and transform rectangle through the existing total middle-angle handoff. This row stays partial for D157 luma positions outside the first-superblock-row, non-first-column full 64x64 oracle fixture, plus non-zero angle deltas, MRL, directional IBP, wide-angle, the directional-neighbour escape reorder, inter prediction, in-loop filters, and live AVM or dav2d invocation in CI."

