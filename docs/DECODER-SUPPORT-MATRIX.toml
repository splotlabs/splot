notes = "Twelfth brick of the AVM-oracle general intra decode path: lifts the general-intra-mb-neighbour-smooth first-superblock-row gate so a §7.13.2.13 SMOOTH_V/H luma block at ANY 2-D grid position decodes. The admission match collapses the prior two arms (first-row admit + row>0 reject with general_intra_multirow_neighbour_non_dc) into one n4w == FULL_SB_N4_LUMA admit, and nondc_luma_has_neighbour drops its && frontier.r == 0. The reconstruction is unchanged: reconstruct_general_intra_luma_nondc_neighbour_block_into already delegates to the plane-general reconstruct_general_intra_smooth_over_edges_into, which builds the §7.13.2.1 edges from the partially-built frame (haveAbove/haveLeft per position) and resolves the top-right sentinel via resolve_smooth_above_right_sentinel over full_sb_num4_above_right (§5.20.7.25 count_top_right_avail over the §5.20.2.3 BlockDecoded state) — the SAME machinery the SMOOTH chroma grid (general-intra-grid) already uses bit-exact. For a row>0 block §7.13.2.1 supplies the REAL reconstructed above row CurrFrame[0][y-1][...] (the bottom row of the already-decoded above superblock); SMOOTH_V reads AboveRow[j] and the bottom-left sentinel LeftCol[h], so this is the first general-intra path to read a real reconstructed above row for non-DC luma. SMOOTH prediction is linear interpolation (no enable_intra_edge_filter/IDIF/upsample synthesis), so the non-flat real above-row edge is bit-exact. The §8.3.2 y_mode_index ctx is unchanged (per-MI IntraJointModes grid): SMOOTH_V/H are non-directional (modeDelta < NON_DIRECTIONAL_MODES_COUNT) so ctx stays 0 and they are admitted; a directional neighbour (ctx != 0) is still REJECTED (general_intra_directional_neighbour_y_mode_index_ctx). The committed syn-vgrid-intra-192x128-q120.ivf (192x128 = three superblock columns by two rows, vertical gradient top 20 -> bottom 230 with a small per-superblock-column tint, flat chroma U=120 V=130) codes the right two columns as SMOOTH_V_PRED luma; the decisive 