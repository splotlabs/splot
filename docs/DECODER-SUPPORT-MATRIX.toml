self_contained_tests = ["crates/splot-decode/src/pipeline/mod.rs::general_intra_tests::hedge_directional_d135_intra_frame_decodes_to_oracle", "crates/splot-decode/src/bitstream/tile_payload/cdf/block_context.rs::tests::y_mode_offset_escape_reconstructs_d135_for_the_hedge_fixture", "cargo test -p splot-decode general_intra --locked", "cargo test -p splot-decode block_context --locked", "cargo test -p splot-cli --test conformance --locked", "cargo xtask check-decoder-support", "cargo xtask check-feature-status"]
