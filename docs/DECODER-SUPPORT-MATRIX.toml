notes = "Retires the inter.compound.local_warp gate. For a NEW_NEWMV compound block whose §5.20.7.14 read_motion_mode returns LOCALWARP (AVM WARP_CAUSAL), the §7.12.3 warp-sample search and §7.13.3.23 least-squares estimation run once per reference list; a signalled list that gathers no samples fails closed (inter.compound.local_warp.empty_sample_list: the \u00a75.20.7.14 WarpSampleFound scan is wider than the \u00a77.12.3.1 gathering, and the spec det==0 identity model diverges from AVM wm_params[ref].invalid there). Each list is warped with its own model through §7.13.3.19/§7.13.3.20 emitting the §7.13.3.16 compound InterRound1=7 intermediate, then the ordinary compound average/wedge/diff-weighted blend runs; compoundWarp=1 forces the plain average. Refine-MV and CWP are suppressed and the interpolation filter is unsignalled (needs_interp_filter=0) per §5.20.7.14/16/17; masked wedge/diff-weighted remain reachable. Per-8x8 SubMvs are stored for both lists into the neighbour grid and the §7.22 motion field. On the current base (#774-#778) the ac0ej3 vector signals no compound LOCALWARP block in its reachable prefix and fails with decode/malformed-source (source_issue_kind tile_payload_parse_error) for an undefined UV mode at byte 12463 with or without this row, so the runtime path is proven by the bit-exact round-7 kernel, model-derivation, and parse-flow unit tests; full-stream AVM checksum agreement remains partial pending prior-reference-frame and entropy-state alignment."

