notes = "Source-backed `DecodeContext::plan_bytes` byte-consuming stream planner: raw bytes are treated as Annex B unless they begin with IVF/DKIF, IVF frame payloads are traversed as Annex B, and the result is the same deterministic `DecodeStreamPlan` shape as the parsed-input planner. The byte walker uses `splot-core`'s `AnnexBObuCursor` and `IvfFrameCursor` as the single source of parser truth while checking `max_input_bytes` before traversal, `max_obus` before retaining the next OBU across the whole stream, `max_ivf_frame_records` before processing each complete IVF frame record, and `max_frames_to_decode` before retaining each accepted `OBU_CLOSED_LOOP_KEY` candidate. It preserves OBU source order, offsets, sizes, payload lengths, headers, IVF frame context, and warnings, rejects malformed sources or unsupported structures transactionally, and runs inside `DecodeContext`'s context-owned `splot_parallel::WorkerPool`. `splot decode` now uses this planner to emit malformed-source, resource-limit, planner unsupported, or runtime-deferral diagnostics. It does not parse tile payloads, call `payload_status()`, reconstruct pixels, compute hashes, write Y4M, refresh references, invoke AVM/dav2d, or add AVM/dav2d integration."

