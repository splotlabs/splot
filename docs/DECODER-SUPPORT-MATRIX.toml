notes = "Opens the INTER decode arc (the gate to real content). The committed syn-2frame-inter-64x64.ivf is a minimal two-frame stream from a project-owned flat synthetic input (luma 100, U 120, V 130, both frames identical; broad decode tools disabled; --enable-global-motion=1 --qp=80 --sb-size=64 --min/max-partition-size=64): frame 0 = OBU_TEMPORAL_DELIMITER + OBU_SEQUENCE_HEADER + OBU_CLOSED_LOOP_KEY (a single flat 64x64 intra key block), frame 1 = OBU_TEMPORAL_DELIMITER + OBU_REGULAR_TILE_GROUP (a single 64x64 inter block, single reference, the zero-MV NEARMV mode with skip=1, so §7.13.3.18 zero-fraction motion compensation reduces to a straight copy of the co-located key block; no residual). avmdec --rawvideo --i420 and dav2d --demuxer ivf decode the whole stream byte-for-byte identically (decoded-output md5 4e1bd39f0b541ef1f479cff049e6985c, 12288 bytes; frame 1 == a copy of frame 0). The fixture validates clean and is registered in the conformance corpus with the reciprocal LOCAL-REFERENCE-EVIDENCE entry lref-avm-dav2d-syn-2frame-inter-64x64. The FIRST INTER FRAME NOW DECODES BIT-EXACT: the planner admits the inter OBU_REGULAR_TILE_GROUP as DecodePlannedObuRole::InterFrameCandidate (§5.2.1), the multi-frame runtime decodes the key frame, retains its planes in a splot-recon ReferenceFrameStore (§7.23, one valid slot modeled so the §7.7 implicit ref map is exact), parses the §5.18.2 inter header to InterHeaderComplete, walks the §5.20.3 partition tree to the single 64x64 NONE block, reads §5.20.7.6 inter mode_info (is_inter==1, skip==1, single_mode==0/NEARMV, then read_drl_idx; read_skip_mode/single_ref/read_motion_mode read no symbols), derives the §7.11 zero MV, and runs the §7.13.3.18 zero-fraction copy — validated by §8.2.4 exit_symbol() (NO hardcoding; a wrong symbol read rejects). New inter CDF rows/selectors (is_inter/skip/single_mode/drl_mode), the from_inter_frame_core tile-facts derivation, and the frame-type-agnostic §5.20.3 partition traversal + tile-payload boundary admit the inter OBU. Single-frame intra fixtures still decode byte-identical. This row stays partial: the VERIFIED-SUBSET DISCIPLINE rejects everything outside the single-reference zero-MV (NEARMV/GLOBALMV) skip==1 subset (compound reference, reference_select, non-zero/NEWMV MV, residual, motion modes, multi-reference §7.7, non-64x64, sub-pel motion compensation, a second/third following frame) with a structured decode/unsupported-feature diagnostic before any output; inter residual, in-loop filters, sub-pel motion compensation, and live AVM/dav2d invocation in CI remain unimplemented. BridgeFrames are complete within this partial umbrella: video-sequence bridges and the single-picture hybrid parse to complete reference-grounded state, reconstruct every plane through §5.20.5.2 zero-MV EIGHTTAP_SHARP scaling, refresh without a KEY reset, and match the recorded AVM oracles byte-for-byte; the unmodified single-picture AVM crash remains an explicit oracle xfail."

