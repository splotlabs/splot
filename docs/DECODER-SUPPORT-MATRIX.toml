local_reference_evidence = ["docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-dav2d-syn-d113-intra-128x128-q80"]
notes = "Completes the §7.13.2.8 MIDDLE-angle zone (90 below pAngle below 180, D135 and D157 already done) by admitting the §7.13.2.8 D113_PRED directional luma mode (pAngle 113, canonical §9.2 mode 5, AngleDeltaY == 0) over a REAL reconstructed above edge plus its uv_mode == 0 directional-follow D113 chroma. D113 is VERTICAL-LEANING (pAngle near 90): dx = Dr_Intra_Derivative[180 - 113] = Dr_Intra_Derivative[67] = 24 and dy = Dr_Intra_Derivative[113 - 90] = Dr_Intra_Derivative[23] = 170 (§9.2, confirmed against the committed Mode_To_Angle[5] == 113 and the Dr_Intra_Derivative[90] table). Most projections take the §7.13.2.8 ABOVE branch (base >= -(1 + mrlIndex)) and land on a NONZERO shift for 2940 of the 4096 luma samples, so it genuinely exercises the luma §7.13.2.8 IDIF 4-tap Dr_Interp_Filter over the real reconstructed above row plus diagonally-above-left corner — unlike D135 (every shift == 0, the IDIF reduces to a sample copy) and complementary to D157 (mostly LEFT-branch). This is purely a wiring and fixture brick: the §7.13.2.8 luma IDIF 4-tap kernel (predict_intra_middle_directional_angle_rect_idif_into, DECODE-GENERAL-INTRA-IDIF-D157 and RECON-INTRA-MIDDLE-DIRECTIONAL-ANGLE-PREDICTION) and the real §7.13.2.1 corner builder (build_directional_middle_edges (true, true) arm reading CurrFrame[plane][y-1][x-1], DECODE-GENERAL-INTRA-DIRECTIONAL-CORNER) both already exist and are reused UNCHANGED. The runtime maps mode value 5 to SupportedDirectionalLumaMode::D113 (IntraYMode::supported_directional) and pAngle 113 to IntraMiddleDirectionalAngle::D113 (middle_directional_angle), routing the neighbour-having luma D113 block to reconstruct_general_intra_directional_neighbour_block_into (luma enableIdif == 1 IDIF path) and the D113-follow chroma (SupportedChromaMode::D113Follow, resolved when uv_mode == 0 over the D113 luma makes §5.20.5.3 return UVMode == D113_PRED, AngleDeltaUV == 0) to the same function on the chroma plane (the enableIdif == 0 bilinear branch). D113 is decoded via the §5.20.5.3 y_mode_offset escape (y_mode_offset == 2 -> modeIdx 9 -> modeDelta 29 -> Reordered_Y_Mode[8] == D113_PRED) at §8.3.2 ctx == 0 (the DC neighbour stored a non-directional IntraJointMode 0). The committed syn-d113-intra-128x128-q80.ivf (128x128 = two superblock columns by two rows: the top-left, top-right, and bottom-left 64x64 superblocks DC_PRED — uniform top 100, bottom-left a vertical gradient coded DC; BOTTOM-RIGHT 64x64 superblock at frontier.r == 16, frontier.c == 16, haveLeft and haveAbove codes D113_PRED luma plus uv_mode == 0 directional-follow D113 chroma) decodes bit-exactly to the avmdec AND dav2d oracle (raw output md5 ba857e73ad624d0409d1189b387d1ef7; pinned splot frame hash d32bc2b11585e7ea55f0d2401f18402c55e781c0a861bb613b55f5dc26a2a395), guarded by the §8.2.4 exit_symbol() bit-exactness check. Confirmed by temporary instrumentation (since removed): the bottom-right block decodes y_mode == IntraYMode(5) (canonical D113), angle_delta_y == 0, frontier.r == 16 (row>0), dir == Some(D113), chroma == Some(D113Follow). The OLD code rejected this exact frame (general_intra_non_dc_chroma_mode, verified by building origin/main and decoding the fixture). All existing general-intra fixtures still decode bit-exact (the D135/D157/cardinal/SMOOTH arms are byte-identical), and a still-unsupported angle (D45 value 3, D67 value 8, D203 value 7, the one-sided angles) still rejects (general_intra_unsupported_luma_mode). This row stays partial: the top-left no-neighbour, first-row (haveAbove == 0), first-column, sub-partitioned, and non-64x64 D113 positions (general_intra_d113_unverified_position and general_intra_directional_d113_chroma_neighbour), the one-sided angles D45/D67/D203, non-zero angle deltas, MRL, directional IBP, wide-angle, the directional-neighbour (ctx != 0) escape reorder, sub-superblock non-DC blocks, multiple tiles, inter prediction, in-loop filters, and live AVM or dav2d invocation in CI remain unimplemented."

[[row]]
id = "general-intra-angle-d45"
name = "General intra D45 zone-1 one-sided luma + follow chroma reading the real above-right"
feature_id = "DECODE-GENERAL-INTRA-ANGLE-D45"
spec_sections = ["5.20.5.3", "5.20.7.25", "5.20.7.27", "7.13.2.1", "7.13.2.7", "7.13.2.8", "8.2.4", "9.2"]
parser_source = "docs/spec/av2/1.0.0/05-syntax-structures.md; docs/spec/av2/1.0.0/07-decoding-process.md"
decode_module = "crates/splot-decode/src/runtime_minimal/general_intra.rs"
tier = "tier1-intra"
status = "partial"
self_contained_tests = ["crates/splot-decode/src/runtime_minimal.rs::general_intra_tests::d45_neighbour_one_sided_above_right_intra_frame_decodes_to_oracle", "crates/splot-decode/src/tile_payload/cdf/block_context.rs::tests::supported_directional_admits_middle_d45_and_d203_but_rejects_d67", "crates/splot-recon/src/intra_directional_angle.rs::tests::d45_one_sided_idif_matches_bilinear_copy_for_shift_zero", "crates/splot-recon/src/intra_directional_angle.rs::tests::d45_one_sided_idif_clamps_base_at_max_base_x", "cargo test -p splot-decode general_intra --locked", "cargo test -p splot-recon d45_one_sided --locked", "cargo xtask check-decoder-support", "cargo xtask check-feature-status"]
diagnostics = ["decode/unsupported-feature"]
local_reference_evidence = ["docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-dav2d-syn-d45-intra-192x128-q80"]
notes = "Opens the §7.13.2.8 ZONE-1 one-sided angle zone (pAngle below 90, needRight) by admitting the §7.13.2.8 D45_PRED directional luma mode (pAngle 45, canonical §9.2 mode 3, AngleDeltaY == 0) over a REAL reconstructed above row plus ABOVE-RIGHT plus its uv_mode == 0 directional-follow D45 chroma. Unlike the §7.13.2.8 MIDDLE angles (D113/D135/D157, 90 below pAngle below 180, which read AboveRow[0..w) and LeftCol[0..h)), the zone-1 step-1 projection reads UP-AND-RIGHT into the ABOVE-RIGHT: pred[i][j] = AboveRow[base] with base = (i + 1) + j (dx = Dr_Intra_Derivative[45] = 64, §9.2), up to maxBaseX = w + h - 1 = 127 for a 64x64 block — the upper-right triangle reads h real reconstructed above-right samples the middle angles never touch. This brick adds the zone-1 luma IDIF kernel to splot-recon (predict_intra_directional_angle_rect_one_sided_idif_into and IntraDirectionalAngleIdifEdges, RECON-INTRA-ONE-SIDED-DIRECTIONAL-ANGLE-PREDICTION): it implements §7.13.2.8 step 1 (idx = (i + 1 + mrlIndex) * dx, base = (idx >> 6) + j, shift = (idx >> 1) and 0x1F; for base below maxBaseX + 1 the 4-tap s = sum(t=0..3) Dr_Interp_Filter[shift][t] * AboveRow[base + t - 1], pred = Clip1(Round2(s, 7)), else pred = AboveRow[maxBaseX]) over the wider above edge AboveRow[-2 ..= w + h + 1] (length w + h + 4, slice index 0 = logical -2), reusing the existing §7.13.2.8 and §9.2 Dr_Interp_Filter[32][4] table UNCHANGED. Every D45 projection has shift == 0 ((i + 1) * 64 >> 1 and 0x1F == 0), so the IDIF reduces to the sample copy AboveRow[base] — but it still reads far into the real reconstructed above-right (the one-sided zone). The runtime maps mode value 3 to SupportedDirectionalLumaMode::D45 (IntraYMode::supported_directional) and routes the neighbour-having luma D45 block to the new reconstruct_general_intra_one_sided_neighbour_block_into, which builds the §7.13.2.1 above edge AboveRow[i] = CurrFrame[plane][y-1][Min(aboveLimit, x+i)] (aboveLimit = Min(maxX, x + w + 4 * num4AboveRight - 1), num4AboveRight from §5.20.7.25 count_top_right_avail over the §5.20.2.3 BlockDecoded state) plus the real corner AboveRow[-1] = CurrFrame[plane][y-1][x-1], plus the §7.13.2.8 edge extensions, then runs the luma IDIF kernel; the D45-follow chroma (SupportedChromaMode::D45Follow, resolved when uv_mode == 0 over the D45 luma makes §5.20.5.3 return UVMode == D45_PRED, AngleDeltaUV == 0) routes to the same function on the chroma plane (the enableIdif == 0 bilinear one-sided branch, bit-identical for D45's shift == 0). D45 is decoded via the §5.20.5.3 y_mode_offset escape (y_mode_offset == 0 -> modeIdx 7 -> modeDelta 8 -> Reordered_Y_Mode[5] == D45_PRED) at §8.3.2 ctx == 0. enable_ibp == 0 keeps useIBP == 0 (§7.13.2.7 gates useIBP on pAngle below 90); enable_intra_edge_filter == 0 and MrlIndex == 0 keep the §7.13.2.x edge-filter and upsample synthesis a no-op. The committed syn-d45-intra-192x128-q80.ivf (192x128 = three superblock columns by two rows: the top-left, top-middle, bottom-left, bottom-right 64x64 superblocks DC_PRED, the top-right DC superblock carrying a horizontal-gradient residual so it reconstructs NON-FLAT; BOTTOM-MIDDLE 64x64 superblock at frontier.r == 16, frontier.c == 16, haveLeft and haveAbove, NON-rightmost, codes D45_PRED luma plus uv_mode == 0 directional-follow D45 chroma) decodes bit-exactly to the avmdec AND dav2d oracle (raw output md5 8fe6a134c01b0d20be4016348ccd3b99; pinned splot frame hash d08056c0d1ed3f379e3072c7f1ebced04da0f6df994efd0b5f8d39b76c0b683f), guarded by the §8.2.4 exit_symbol() bit-exactness check. The D45 block's upper-right triangle reads the real reconstructed above-right (the top-right superblock's non-flat bottom row, 32 distinct values 42..228); the block reconstructs as 33 distinct values, genuinely directional. The OLD code rejected this exact frame (general_intra_unsupported_y_mode, because D45's supported_directional() returned None). All existing general-intra fixtures still decode bit-exact (the D113/D135/D157/cardinal/SMOOTH/DC arms are byte-identical), and a still-unsupported one-sided angle (D67 value 8, D203 value 7) still rejects (general_intra_unsupported_luma_mode). This row stays partial: the top-left no-neighbour, first-row (haveAbove == 0), first-column, RIGHTMOST (no decoded above-right), sub-partitioned, and non-64x64 D45 positions (general_intra_d45_unverified_position and general_intra_directional_d45_chroma_neighbour), the other one-sided angles D67 (zone-1, mostly nonzero shift, blocked because a directional above-neighbour cascades §8.3.2 ctx != 0 reorder) and D203 (zone-3, reads the left plus below-left), non-zero angle deltas, MRL, directional IBP, wide-angle, the directional-neighbour (ctx != 0) escape reorder, sub-superblock non-DC blocks, multiple tiles, inter prediction, in-loop filters, and live AVM or dav2d invocation in CI remain unimplemented."

