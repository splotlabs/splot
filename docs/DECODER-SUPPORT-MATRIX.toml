notes = "Tenth brick of the AVM-oracle general intra decode path and the first directional-angle luma prediction: §7.13.2.8 D135_PRED (pAngle 135). It reconstructs the §5.20.5.3 y_mode_offset escape (y_mode_set == 0, y_mode_index == MODE_INDEX_COUNT - 1): the new TileYModeOffsetCdf selector reads y_mode_offset (sharing the y_mode_index §8.3.2 context; defaults from DEFAULT_Y_MODE_OFFSET_CDF), then reconstruct_y_mode_offset_escape_top_left runs modeIdx = (MODE_INDEX_COUNT - 1) + y_mode_offset through get_intra_y_mode_set for the top-left no-directional-neighbour case (Default_Mode_List_Y) and the directional reorder (Reordered_Y_Mode, TOTAL_ANGLE_DELTA_COUNT, MAX_ANGLE_DELTA) to the typed YMode/AngleDeltaY (hedge fixture: y_mode_offset 3 -> modeIdx 10 -> D135_PRED, AngleDeltaY 0). reconstruct_general_intra_luma_directional_first_block_into builds the §7.13.2.8 prediction over the §7.13.2.1 no-neighbour fallback edges (8-bit: AboveRow 127, LeftCol 129, shared corner 128) via the shared splot-recon predict_intra_middle_directional_angle_rect_into, then adds the §5.20.7.27 residual through reconstruct_general_intra_block_with_prediction. The committed syn-hedge-intra-64x64-q80.ivf (one 64x64 D135 luma block, top half near 40, bottom half near 210, DC chroma U 120 V 130) decodes bit-exactly to the avmdec and dav2d oracle (raw output md5 1179bcc873c1d1ac49c2c032f11ca44d; raw outputs agree, recorded in LOCAL-REFERENCE-EVIDENCE.toml; pinned splot frame hash b15f267ec6e99ca4d96a70f38bffe5f798ee4c33ad3aaec23761a1ea74b0be33 asserted by the hedge oracle test), guarded by the §8.2.4 exit_symbol() check. This row stays partial: it is gated to the top-left (no-neighbour) 64x64 superblock (n4w == 16, TX_64X64 -> TX_SET_DCTONLY -> forced DCT_DCT) at pAngle 135 with AngleDeltaY == 0, where enable_intra_edge_filter == 0 and the IDIF/upsample edge synthesis is a no-op and pAngle 135's dx = dy = Dr_Intra_Derivative[45] = 64 give shift == 0 so the luma IDIF reduces to a sample copy (bit-identical to bilinear). Non-zero angle deltas, the other directional modes, sub-64x64 directional blocks (mode-dependent non-DCT TxType), neighbour-having directional blocks (full §7.13.2.8 IDIF edge synthesis with shift != 0), directional chroma, non-64x64 frames, inter prediction, in-loop filters, and live AVM or dav2d invocation in CI remain unimplemented."

[[row]]
id = "general-intra-mb-neighbour-smooth"
name = "General intra multi-block non-DC luma over a reconstructed neighbour edge"
feature_id = "DECODE-GENERAL-INTRA-MB-NEIGHBOUR-SMOOTH"
spec_sections = ["5.20.5.3", "5.20.7.27", "7.13.2.1", "7.13.2.13", "8.2.4", "8.3.2", "9.2"]
parser_source = "docs/spec/av2/1.0.0/05-syntax-structures.md; docs/spec/av2/1.0.0/07-decoding-process.md"
decode_module = "crates/splot-decode/src/pipeline/reconstruct.rs"
tier = "tier1-intra"
status = "partial"
self_contained_tests = ["crates/splot-decode/src/pipeline/mod.rs::general_intra_tests::mbvg_multiblock_smooth_v_neighbour_intra_frame_decodes_to_oracle", "cargo test -p splot-decode general_intra --locked", "cargo test -p splot-cli --test conformance --locked", "cargo xtask check-decoder-support", "cargo xtask check-feature-status"]
diagnostics = ["decode/unsupported-feature"]
local_reference_evidence = ["docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-dav2d-syn-mbvg-intra-128x64-q80"]
notes = "Eleventh brick of the AVM-oracle general intra decode path and the first MULTI-BLOCK non-DC luma prediction that reads the REAL reconstructed neighbour edge (prior non-DC/directional luma was gated to the no-neighbour top-left block over §7.13.2.1 flat fallbacks). The brief expected a cardinal V_PRED/H_PRED right superblock; the committed syn-mbvg-128x64-q80.ivf instead codes BOTH 64x64 superblocks as §7.13.2.13 SMOOTH_V_PRED (confirmed by temporary mode instrumentation, since removed: y_mode == SMOOTH_V_PRED == 10 for both, via the §5.20.5.3 y_mode_offset escape). SMOOTH_V is neither a cardinal copy nor an §7.13.2.8 angle mode — it is §7.13.2.13 linear interpolation, so it reads the real neighbour edge with NO IDIF/edge-filter synthesis and is bit-exact over a non-flat edge (unlike a directional angle, where enableIdif == 0 bilinear equals the spec IDIF 4-tap only for a flat edge). The left (top-left, no-neighbour) superblock uses the existing reconstruct_general_intra_luma_nondc_first_block_into (flat fallback edges); the right superblock (!is_top_left) uses the new reconstruct_general_intra_luma_nondc_neighbour_block_into, which builds the §7.13.2.1 edges from the partially-built frame via the shared luma/chroma-general build_smooth_edges (haveLeft == 1, haveAbove == 0 -> LeftCol[i] = real reconstructed left column with the bottom-left sentinel LeftCol[h] clamped to the last in-block sample, AboveRow[i] = repeated CurrFrame[0][y][x-1]) and runs the shared splot-recon predict_intra_smooth_rect_into SMOOTH_V then adds the §5.20.7.27 residual. The y_mode_index §8.3.2 context is now derived from the REAL neighbours via a per-MI IntraJointModes grid (new tile_payload/intra_joint_modes.rs, TileIntraJointModeState), not a hardcoded tile-origin literal: decode_general_intra_block_modes computes ctx = (get_joint_mode(0) >= NON_DIRECTIONAL_MODES_COUNT) + (get_joint_mode(1) >= NON_DIRECTIONAL_MODES_COUNT) (§8.3.2) before reading any y_mode_set/y_mode_index symbol, where get_joint_mode(dir) reads the left (dir=0) or above (dir=1) neighbour's stored IntraJointModes[mvRow][mvCol] = IntraJointMode = modeDelta (§5.20.5.3 line 9998, get_joint_mode line 11102) or DC_PRED (0) out of frame; the partition walk records each reconstructed block's IntraJointMode (modeDelta) into the grid after the leaf. For mbvg the left neighbour SMOOTH_V has modeDelta 2 < NON_DIRECTIONAL_MODES_COUNT 5, so ctx stays 0 and the decode is unchanged/bit-exact. A directional neighbour (modeDelta >= 5, e.g. the #383 D135 block modeDelta 36) yields ctx != 0; only the ctx == 0 y_mode_index CDF selection is oracle-verified, so ctx != 0 is REJECTED with a typed decode/unsupported-feature diagnostic (general_intra_directional_neighbour_y_mode_index_ctx, GeneralIntraBlockModeError::UnsupportedYModeIndexContext) BEFORE any symbol is read, fixing the codex P2 on PR #385 (wrong-ctx decode) and the latent #383 case (a DC block below/right of a D135 block now rejects instead of misdecoding). At the time this brick landed there was no ctx == 1 oracle fixture, so ctx != 0 was rejected; DECODE-GENERAL-INTRA-DIRECTIONAL-FOLLOW-CHROMA later let a D135 block decode past its uv_mode == 0 chroma, making a multi-block frame with a D135 left neighbour producible, and DECODE-GENERAL-INTRA-DIRECTIONAL-NEIGHBOUR-CTX lifted the ctx != 0 reject for a non-directional neighbour-reading block (verified by syn-dirneigh-intra-128x64-q80). The committed syn-mbvg-intra-128x64-q80.ivf (vertical gradient top 30 -> bottom 210, flat chroma U=120 V=130) decodes bit-exactly to the avmdec AND dav2d oracle (raw output md5 3e57ba0c8cbdbe1d3400b0ae365c5d8e; raw outputs agree, recorded in LOCAL-REFERENCE-EVIDENCE.toml; pinned splot frame hash 269b4969800751c63f7f0605f1f7b8f178f7bf85590ec62fe64313ff394d6dfd asserted by the mbvg oracle test), guarded by the §8.2.4 exit_symbol() check; all existing general-intra fixtures still decode bit-exact. This row stays partial: it is gated to a full 64x64 superblock (n4w == 16). Sub-superblock non-DC blocks (per-block §5.20.2.3 BlockDecoded update for split above-right/below-left neighbours), neighbour-having §7.13.2.8 directional luma over a real non-flat edge (real IDIF 4-tap interpolation), the in-frame directional-neighbour y_mode_index reorder and the ctx != 0 y_mode_index decode itself, SMOOTH/PAETH luma, multiple tiles, inter prediction, in-loop filters, and live AVM or dav2d invocation in CI remain unimplemented. When this brick landed the neighbour SMOOTH path was gated to the first superblock row (frontier.r == 0, haveAbove == 0); that gate was subsequently lifted by DECODE-GENERAL-INTRA-GRID-NEIGHBOUR-NONDC (row>0 SMOOTH_V over the real reconstructed above row), so the general_intra_multirow_neighbour_non_dc diagnostic is no longer emitted."

