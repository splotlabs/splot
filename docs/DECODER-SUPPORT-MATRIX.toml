ener classification, chroma Wiener NS filtering, retaining/applying per-unit Wiener coefficient values, switchable LR, SDP PlaneStart/PlaneEnd LR traversal, temporal/reference Wiener state, 10-bit output, reference refresh, or successful local decoder mission decode."

