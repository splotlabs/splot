notes = "Lifts the general-intra-grid-neighbour-nondc first-superblock-row gate for full-superblock SMOOTH_H luma: a §7.13.2.13 SMOOTH_H luma block at ANY 2-D grid position now decodes (previously only frontier.r == 0, where its above-right sentinel AboveRow[w] is the no-neighbour fallback; a row>0 SMOOTH_H block was rejected with general_intra_smooth_h_above_right_unverified). The admission match collapses the prior two arms (first-row admit + row>0 reject) into one n4w == FULL_SB_N4_LUMA admit. The reconstruction is UNCHANGED: reconstruct_general_intra_luma_nondc_neighbour_block_into already delegates to the plane-general reconstruct_general_intra_smooth_over_edges_into, which derives the luma §7.13.2.1 num4AboveRight from luma_num4_above_right_from_block_decoded (§5.20.7.25 count_top_right_avail over the §5.20.2.3 BlockDecoded state) and resolves the top-right sentinel AboveRow[w] via resolve_smooth_above_right_sentinel — the SAME plane-general machinery the SMOOTH chroma grid (general-intra-grid, sub_x == 1) and SMOOTH_V grid (general-intra-grid-neighbour-nondc) already use bit-exact; this is the first time it runs for the luma (sub_x == 0) above-right VALUE that the SMOOTH_H §7.13.2.13 predH2 actually reads. For a row>0 superblock the top-right sentinel is the REAL reconstructed bottom row of the already-decoded diagonally-above-right superblock; SMOOTH prediction is linear interpolation (no enable_intra_edge_filter/IDIF/upsample synthesis), so the non-flat real above-right is bit-exact. The committed syn-shgrid-intra-128x128-q80.ivf (128x128 = two superblock columns by two rows: bottom-left 64x64 superblock SMOOTH_H_PRED luma over a horizontal gradient with DC chroma; top-left/bottom-right DC luma; top-right DC luma with full-superblock SMOOTH chroma) codes the decisive bottom-left row>0 non-rightmost SMOOTH_H superblock (frontier.r == 16, frontier.c == 0): count_top_right_avail yields num4AboveRight == 16, so the §7.13.2.1 AboveRow[w] resolver returns the REAL above-right value 200 (the top-right superblock's reconstructed bottom row at column 64), NOT the edge-clamp 100 (the bottom-left's own above sample at column 63) — empirically confirmed via temporary instrumentation (sentinel=200 vs clamp=100), and the SMOOTH_H rightmost column reconstructs above 200. It decodes bit-exactly to the avmdec AND dav2d oracle (raw output md5 fe420ce870c13a8055aa83fd5aa64740; raw outputs agree, recorded in LOCAL-REFERENCE-EVIDENCE.toml; pinned splot frame hash d1ce39cc3d79f5c46fdea67ad57ec4edd5dfed088ee39fd7029fda1bbb11e0e8 asserted by the shgrid oracle test), guarded by the §8.2.4 exit_symbol() check; all existing general-intra fixtures still decode bit-exact and the OLD code rejected this frame with general_intra_smooth_h_above_right_unverified (verified by temporarily restoring the reject arm). This row stays partial: only the full-superblock (n4w == 16) SMOOTH_H row>0 cross-superblock above-right is admitted. Still rejected/deferred: SMOOTH_H SPLIT-child blocks at superblock-relative row 0 (cross-superblock above-right, general_intra_smooth_h_above_right_unverified); SMOOTH_V below-left sub-block sentinels; SMOOTH chroma sub-blocks (general_intra_smooth_chroma_subblock, pinned by the negative syn-svsplit-intra-64x64-q140.ivf); directional/PAETH neighbour cases; multiple tiles; inter prediction; in-loop filters; and live AVM or dav2d invocation in CI remain unimplemented."

