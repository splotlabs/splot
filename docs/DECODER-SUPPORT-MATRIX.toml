diagnostics = ["decode/unsupported-feature"]
local_reference_evidence = ["docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-dav2d-syn-rdir-intra-128x64-q80"]
notes = "Lifts the deferred rejects for a §7.13.2.8 D135_PRED luma block (and its uv_mode == 0 directional-follow D135 chroma) that reads a REAL reconstructed neighbour edge (previously general_intra_multiblock_directional_luma for luma and general_intra_directional_chroma_neighbour for chroma, which gated D135 to the no-neighbour top-left block over §7.13.2.1 flat fallbacks). KEY SPEC FINDING: pAngle 135 is a §7.13.2.8 middle angle (90 < pAngle < 180) with dx = dy = Dr_Intra_Derivative[45] = 64, so every projection idx is a multiple of 64 and shift = (idx >> 1) & 0x1F == 0. At shift == 0 the §7.13.2.8 luma IDIF 4-tap (enableIdif == 1, plane 0) collapses to Dr_Interp_Filter[0] = {0, 128, 0, 0}, i.e. Clip1(Round2(128 * Edge[base], 7)) == Edge[base], BIT-IDENTICAL to the chroma bilinear branch (enableIdif == 0: Round2(Edge[base] * 32 + Edge[base+1] * 0, 5) == Edge[base]) — a pure sample copy Edge[base] EVEN OVER A NON-FLAT reconstructed edge (verified numerically and against the oracle). So no genuine IDIF 4-tap kernel was needed for D135; the existing shared bilinear predict_intra_middle_directional_angle_rect_into is exact for D135 in both planes, and the only new work is reading the REAL §7.13.2.1 edges. The new reconstruct_general_intra_directional_neighbour_block_into (plane-general) builds the logical AboveRow[-1..w) and LeftCol[-1..h) edges from the partially-built frame via build_directional_middle_edges, faithful to §7.13.2.1 for the minimal-tool subset (MrlIndex == 0, enable_intra_edge_filter == 0, no DIP/upsample): for the verified first-superblock-row block (frontier.r == 0, haveLeft == 1, haveAbove == 0) LeftCol[i] is the real reconstructed left column (bottom-left sentinel clamped, num4BelowLeft == 0), AboveRow[i] = CurrFrame[plane][y][x-1] (the repeated first left sample), and the corner AboveRow[-1] = LeftCol[-1] = CurrFrame[plane][y][x-1]. D135 never reads the above-right sentinel value, so no above-right resolver is needed. The D135 escape was decoded with a NON-directional joint-mode neighbour (ctx == 0), so the left neighbour is DC/SMOOTH and supplies the real left column; the chroma is the uv_mode == 0 directional-follow of the luma D135, routed by reconstruct_general_intra_chroma_block_into (D135Follow with x > 0 || y > 0) to the same neighbour path. The committed syn-rdir-intra-128x64-q80.ivf (two 64x64 superblocks: LEFT codes SMOOTH_V_PRED luma over a vertical gradient with DC chroma; RIGHT codes D135_PRED luma + directional-follow D135 chroma reading the LEFT superblock's real reconstructed right column — a non-flat 34-distinct-value vertical gradient — as its §7.13.2.1 left edge; flat chroma U=120 V=130) decodes bit-exactly to the avmdec AND dav2d oracle (raw output md5 9ff7e4d46c0dd4fa979070ce4ca4dd1c; raw outputs agree, recorded in LOCAL-REFERENCE-EVIDENCE.toml; pinned splot frame hash 9ea9254abc7d7507558099d5ae3e78eaf5d88625e1cc8184038321650b2b54a4 asserted by the rdir oracle test), guarded by the §8.2.4 exit_symbol() check; the OLD code rejected this exact frame (general_intra_directional_chroma_neighbour, the chroma reject firing first). All existing general-intra fixtures remain byte-exact; later rows made the other directional luma modes and the directional-neighbour reorder total. This row stays partial: a row>0 D135 block reading the real reconstructed above row (general_intra_multirow_directional_luma — bit-exact by the same shift == 0 argument but not yet oracle-fixtured), other directional angles and non-zero angle deltas (where shift != 0 so the real §7.13.2.8 IDIF 4-tap genuinely differs from bilinear), non-64x64 frames, inter prediction, in-loop filters, and live AVM or dav2d invocation in CI remain unimplemented."

