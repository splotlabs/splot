notes = "Extends the inter decode arc from the zero-MV copy (first-inter-frame-frontier) to a real sub-pel NEWMV block, wiring the merged §7.13.3.18 convolution kernel (RECON-SUBPEL-MC) into the decode path. The committed syn-2frame-subpel-inter-64x64.ivf (project-owned synthetic horizontal half-cosine luma + flat chroma, frame 1 shifted right by half a sample; broad decode tools incl. GDF/intra-dip/bawp/cwp/flex-mvres/adaptive-mvd/global-motion/warp/tip/refinemv/opfl-refine/masked-interintra-compound/joint-mvd/ref-frame-mvs disabled; --qp 180 --sb-size 64 --min/max-partition-size 64) is a two-frame stream: frame 0 = OBU_CLOSED_LOOP_KEY (a single 64x64 DC_PRED intra key block with a low-frequency AC residual), frame 1 = OBU_REGULAR_TILE_GROUP (a single 64x64 single-reference NEWMV inter block, EighthPel (0, -4) horizontal half-sample sub-pel MV, SWITCHABLE EIGHTTAP_SHARP interpolation filter, skip=1, no residual). avmdec --rawvideo --i420 and dav2d --demuxer ivf decode the whole stream byte-for-byte identically (decoded-output md5 a0e82de3a95bb4b519c4c84ffa2ba816, 12288 bytes); the fixture validates clean and is registered in the conformance corpus with the reciprocal LOCAL-REFERENCE-EVIDENCE entry lref-avm-dav2d-syn-2frame-subpel-inter-64x64. THE FIRST SUB-PEL INTER FRAME NOW DECODES BIT-EXACT: the §5.20.7.6 block decode admits single_mode==2 (NEWMV), reads its DRL, the §5.20.7.20 SHELL-coded read_mv (shell_set/shell_class[P==6]/shell_offset/col_mv split + §5.20.7.13 explicit mv_sign per nonzero component) over the zero no-neighbour predictor, and the §5.20.7.6 interp_filter symbol (TileInterpFilterCdf[ctx=3]); the decoded MV drives §7.13.3.17 motion_vector_scaling + §7.13.3.18 clip bounds feeding splot-recon subpel_predict_block per plane — validated by §8.2.4 exit_symbol() (NO hardcoding; a wrong symbol read rejects). New tile/block CDF banks (joint_shell_set, the P==6 shell_class pair, joint_shell_last_two_classes, shell_offset_low_class/class2/other_class, col_mv_greater, col_mv_index, interp_filter) thread through the Block/Tile CDF subsets from the generated §9.3 defaults. The zero-MV inter (4e1bd39f) and the general-intra fixtures stay byte-identical. This row stays partial: the VERIFIED-SUBSET DISCIPLINE rejects everything outside the single-reference NEWMV/zero-MV skip==1 EighthPel SWITCHABLE-or-fixed-filter subset (residual skip==0, compound, multi-reference, non-64x64, motion modes, OBMC, warp, flex-mvres, adaptive-mvd, bawp, cwp) with a structured decode/unsupported-feature diagnostic before any output; inter residual, in-loop filters, multi-block/non-64x64 inter, and live AVM/dav2d invocation in CI remain unimplemented."

