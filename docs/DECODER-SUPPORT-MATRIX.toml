self_contained_tests = ["crates/splot-decode/src/pipeline/mod.rs::general_intra_tests::d45_neighbour_one_sided_above_right_intra_frame_decodes_to_oracle", "crates/splot-decode/src/pipeline/mod.rs::general_intra_tests::d45_top_left_no_neighbour_intra_frame_decodes_to_oracle", "crates/splot-decode/src/pipeline/mod.rs::general_intra_tests::d45_right_edge_clamped_above_intra_frame_decodes_to_oracle", "crates/splot-decode/src/pipeline/reconstruct_tests.rs::d45_follow_chroma_top_left_uses_no_neighbour_above_fallback", "crates/splot-decode/src/pipeline/reconstruct.rs::tests::zone1_d45_top_left_synthesizes_no_neighbour_above_fallback", "crates/splot-decode/src/pipeline/general_intra.rs::tests::directional_luma_always_plans_through_the_rect_planner", "crates/splot-recon/src/intra_directional_angle.rs::tests::d45_one_sided_idif_matches_bilinear_copy_for_shift_zero", "crates/splot-recon/src/intra_directional_angle.rs::tests::d45_one_sided_idif_clamps_base_at_max_base_x", "cargo test -p splot-decode general_intra --locked", "cargo test -p splot-recon d45_one_sided --locked", "cargo xtask check-decoder-support", "cargo xtask check-feature-status"]
