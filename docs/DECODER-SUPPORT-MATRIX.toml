notes = "Opens the §7.13.2.8 ZONE-3 one-sided angle zone (pAngle above 180, needBottom) — the symmetric MIRROR of the D45 zone-1 brick — by admitting the §7.13.2.8 D203_PRED directional luma mode (pAngle 203, canonical §9.2 mode 7, AngleDeltaY == 0) over a REAL reconstructed left column plus its uv_mode == 0 directional-follow D203 chroma. Unlike the §7.13.2.8 MIDDLE angles (D113/D135/D157, 90 below pAngle below 180, which read AboveRow[0..w) and LeftCol[0..h)), the zone-3 step-3 projection reads DOWN-AND-LEFT into the BELOW-LEFT: idx = (j + 1) * dy, base = (idx >> 6) + i (dy = Dr_Intra_Derivative[270 - 203] = Dr_Intra_Derivative[67] = 24, §9.2), up to maxBaseY = w + h - 1 = 127 for a 64x64 block. This brick GENERALISES the zone-1 luma IDIF kernel in splot-recon to both one-sided directions (predict_intra_directional_angle_rect_one_sided_idif_into now dispatches on the angle branch; IntraDirectionalAngleIdifEdges::left carries the prepared left edge): it implements §7.13.2.8 step 3 (shift = (idx >> 1) and 0x1F; for base below maxBaseY + 1 the 4-tap s = sum(t=0..3) Dr_Interp_Filter[shift][t] * LeftCol[base + t - 1], pred = Clip1(Round2(s, 7)), else pred = LeftCol[maxBaseY]) over the wider left edge LeftCol[-2 ..= w + h + 1] (length w + h + 4, slice index 0 = logical -2), reusing the existing §7.13.2.8 and §9.2 Dr_Interp_Filter[32][4] table UNCHANGED. Unlike D45 (dx = 64, every shift == 0, the IDIF reduces to a sample copy), D203's dy = 24 lands most projections on a NONZERO shift, so the luma §7.13.2.8 IDIF 4-tap genuinely interpolates over the real reconstructed left column. The runtime maps mode value 7 to SupportedDirectionalLumaMode::D203 (IntraYMode::supported_directional) and routes the neighbour-having luma D203 block to the new reconstruct_general_intra_one_sided_left_neighbour_block_into, which builds the §7.13.2.1 left edge LeftCol[i] = CurrFrame[plane][Min(leftLimit, y+i)][x-1] (leftLimit = Min(maxY, y + h + 4 * num4BelowLeft - 1), num4BelowLeft from §5.20.7.25 count_bottom_left_avail over the §5.20.2.3 BlockDecoded state, 0 in raster order so the below-left clamps) plus the corner LeftCol[-1] = CurrFrame[plane][y][x-1] (the haveAbove == 0 and haveLeft == 1 §7.13.2.1 branch), plus the §7.13.2.8 edge extensions, then runs the luma IDIF kernel; the D203-follow chroma (SupportedChromaMode::D203Follow, resolved when uv_mode == 0 over the D203 luma makes §5.20.5.3 return UVMode == D203_PRED, AngleDeltaUV == 0) routes to the same function on the chroma plane (the enableIdif == 0 bilinear one-sided branch, the spec-mandated chroma branch). enable_ibp == 0 keeps useIBP == 0 (§7.13.2.7 gates useIBP on pAngle above 180); enable_intra_edge_filter == 0 and MrlIndex == 0 keep the §7.13.2.x edge-filter and upsample synthesis a no-op. The committed syn-d203-intra-128x64-q80.ivf (128x64 = two superblock columns by one row: the LEFT 64x64 superblock DC_PRED carrying a vertical-gradient residual so its right column reconstructs NON-FLAT, 32 distinct values 31..210; the RIGHT 64x64 superblock at frontier.r == 0, frontier.c == 16, haveAbove == 0 and haveLeft == 1, codes D203_PRED luma plus uv_mode == 0 directional-follow D203 chroma) decodes bit-exactly to the avmdec AND dav2d oracle (raw output md5 2789636ec6bca9efcac829bbd7ca3712; pinned splot frame hash 3b95907f8808cc9d0bdd2eb376c8726019f7a4490cf8ecfcccab883fb11f8a3f), guarded by the §8.2.4 exit_symbol() bit-exactness check. The D203 block reads the real reconstructed left column (the left superblock's non-flat right column gradient) and reconstructs as 181 distinct values, genuinely directional. The OLD code rejected this exact frame (general_intra_d203_unverified_position, because D203's supported_directional() returned None). All existing general-intra fixtures still decode bit-exact (the V/H/D45/D113/D135/D157/cardinal/SMOOTH/DC arms are byte-identical), and the last still-unsupported one-sided angle (D67 value 8) still rejects (supported_directional returns None). This row stays