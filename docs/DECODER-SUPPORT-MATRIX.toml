notes = "Fourth brick of the AVM-oracle general intra decode path and the first end-to-end bit-exact frame decode. `decode_general_intra_chroma_coeffs` decodes the U then V 32x32 chroma transform blocks: the `all_zero` (`txb_skip`) symbol uses the §8 parsing CDF `TileTxbSkipCdf[is_inter || fsc_mode][txSzCtx][ctx]` for plane 0/1 (the second index is is_inter||fsc_mode, NOT plane_type; the U-plane offset lives in ctx == 6 for the first block) and `TileVTxbSkipCdf[ctx]` for plane 2 (ctx == (EobU != 0) ? 6 : 0), then routes the nonzero pass through `apply_coeff_use_fsc_branch_from_frame_facts` with the chroma plane. `reconstruct_general_intra_block` composes the §7.14.4 dequantization (dqDenom carries the §7.14.4 TCQ term for the luma DCT_DCT block), the §7.15.4 inverse transform (64x64 via the adjusted 32x32 inverse plus duplication for luma, native 32x32 for chroma), and the §7.14.3 residual add over the §7.13.2 no-neighbour DC prediction (128). Multi-coefficient (eob > 1) blocks are decoded by the same coefficient loop with the inferred DCT_DCT transform (no intra_tx_type/cctx_type is coded once those tools are rejected at admission); §8.2.4 `exit_symbol()` is validated after the coefficients and rejects any unconsumed syntax. The reconstructed planes are written into a `CurrentFrameWorkspace` and frozen. The committed fixtures syn-flat-intra-64x64-q80.ivf (single DC) and syn-cos-intra-64x64-q180.ivf (multi-coefficient AC luma) decode bit-exactly to the avmdec/dav2d oracle (pinned frame hashes ce9c46b1... and 8a6751d4...; avmdec and dav2d raw outputs agree for both, recorded in LOCAL-REFERENCE-EVIDENCE.toml). Split-partition multi-block frames are handled by DECODE-GENERAL-INTRA-MULTIBLOCK; this row stays partial for multiple tiles, non-64x64 frames, chroma cctx/CfL, inter prediction, in-loop filters, and live AVM or dav2d invocation in CI."

