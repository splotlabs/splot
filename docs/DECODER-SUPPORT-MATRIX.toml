local_reference_evidence = ["docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-dav2d-syn-2frame-inter-residual-64x64"]
notes = "Extends the inter decode arc from the skip == 1 no-residual cases (first-inter-frame-frontier zero-MV copy, inter-subpel-mv sub-pel) to a real skip == 0 inter block carrying a §5.20.7.27 coded residual added over the §7.13.3.18 motion-compensated prediction. The committed syn-2frame-inter-residual-64x64.ivf (project-owned flat-100 luma + flat chroma frame 0 plus a smooth low-frequency luma delta on frame 1; broad decode tools incl. GDF/intra-dip/intra-edge-filter/bawp/cwp/flex-mvres/adaptive-mvd/warp/tip/refinemv/opfl-refine/masked-wedge-interintra-onesided-diffwtd-compound/joint-mvd/ref-frame-mvs/inter-ist/inter-ddt/cctx/fsc/idtx-intra disabled; --enable-global-motion=1 --qp 80 --sb-size 64 --min/max-partition-size 64) is a two-frame stream: frame 0 = OBU_CLOSED_LOOP_KEY (a single flat 64x64 DC_PRED intra key block), frame 1 = OBU_REGULAR_TILE_GROUP (a single 64x64 single-reference zero-MV NEARMV inter block with skip == 0, a §5.20.7.27 luma DCT_DCT residual, flat chroma so no chroma residual). avmdec --rawvideo --i420 and dav2d --demuxer ivf decode the whole stream byte-for-byte identically (decoded-output md5 ab2b067aed48cf46035fa031cefb3ab1, 12288 bytes); the fixture validates clean and is registered in the conformance corpus with the reciprocal LOCAL-REFERENCE-EVIDENCE entry lref-avm-dav2d-syn-2frame-inter-residual-64x64. THE FIRST INTER-RESIDUAL FRAME NOW DECODES BIT-EXACT: §5.20.7 decode_block reads mode_info, then under TX_MODE_LARGEST read_block_tx_size() reads NO symbol (TxSize = maxRectTxSize = TX_64X64); §5.20.8.3 get_tx_set(TX_64X64, 0) returns TX_SET_DCTONLY, so §5.20.8.2 transform_type() reads NO inter_tx_type symbol and PlaneTxType == DCT_DCT (the chroma tx type is DERIVED, not signalled — § 5.20.8.2 reads no chroma tx_type symbol; for an inter TX_32X32 chroma block § 5.20.8.3 get_tx_set is TX_SET_DCT_IDTX, not the DCT-only branch, but chroma forces DCT_DCT); §5.20.7.27 residual() reads the luma TX_64X64 then U/V TX_32X32 coefficients via the SHARED intra coefficient loop (decode_general_intra_plane_coeffs) with is_inter == true — the only inter-specific contexts are §8.3.2 TileTxbSkipCdf[is_inter || fsc_mode] (index 1) and the luma eobCtx = is_inter; coeff_base/coeff_br banks are unified. The Quant[] feeds §7.14.4 dequant (luma DCT_DCT TCQ dqDenom +1 only when allow_tcq; chroma never), §7.15.4 inverse transform, §7.14.3 residual add over the §7.13.3.18 MC prediction (reconstruct_inter_block_residual_into), then Clip1 — validated by §8.2.4 exit_symbol() (NO hardcoding; frame 1 luma differs from frame 0 by 3348/4096 samples, proving a genuine residual not a copy). The skip == 1 inter (4e1bd39f, a0e82de3) and general-intra fixtures stay byte-identical. This row stays partial: the VERIFIED-SUBSET DISCIPLINE rejects everything outside the single-reference zero-MV-or-sub-pel skip ∈ {0,1} 64x64 DCT-only-residual subset with a structured decode/unsupported-feature diagnostic before any output — the residual decode rejects inter-IST (sec_tx_type), inter-DDT, CCTX, FSC, IDTX-intra, and non-zero effective quantizer deltas (`DeltaQ* + Base*DeltaQ`) before the zero-delta dequant path can emit output; the existing gates reject compound, reference_select, multi-reference, motion modes, OBMC, warp, bawp/flex-mvres/adaptive-mvd, non-64x64, and a second following frame. The fixture's chroma is all_zero (inter chroma == flat key chroma), so this luma-residual + chroma-skip path is oracle-exact; a coded chroma inter residual (the chroma nonzero coeff pass) and the chroma inter tx-type derivation are NOT yet oracle-exercised. Multi-transform-block splits, non-DCT inter tx sets, in-loop filters, multi-block/non-64x64 inter, and live AVM/dav2d invocation in CI remain unimplemented."

