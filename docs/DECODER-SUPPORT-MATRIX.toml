diagnostics = ["decode/unsupported-feature"]
local_reference_evidence = []
notes = "Crate-private `splot-decode` tile CDF boundary for the minimal one-tile closed-loop-key tier: `tile_payload/cdf.rs` copies the supported partition-entry CDF subset (`TileDoSplitCdf`, `TileDoSquareSplitCdf`, `TileRectTypeCdf`, `TileDoExtPartitionCdf`, and `TileDoUneven4wayPartitionCdf`) from generated AV2 §9.3 defaults, provides typed selector validation and closure-scoped mutable row access for §8.3 handoff into `SymbolDecoder::read_symbol(cdf)`, records the tile CDF update mode from `disable_cdf_update`, computes the §8.2 copy/average policy from `enable_avg_cdf`, `avg_cdf_type`, `context_update_tile_id`, `TileNum`, and `TileCols * TileRows`, derives bounded §8.3.2 contexts for `do_split`, `do_square_split`, `rect_type`, `do_ext_partition`, and `do_uneven_4way_partition` using generated §9.2 conversion tables, availability-gated `MiSizes` lookups, and the local §8.3.2 adjustment arrays, and attaches the boundary metadata to the deterministic tile work unit. The first coefficient-decode CDF bank, `TileEobExtraCdf`, is also copied from the generated AV2 §9.3 `Default_Eob_Extra_Cdf` defaults and selected context-free by `coeff_cdf_q_ctx` per §8.3.2 (the cdf is given directly by `TileEobExtraCdf`, with no per-symbol context), and is included in the tile copy and average and the frame-end count-scaling paths; it is loaded but not yet read by a decode loop, so the minimal-fixture decode output is unchanged. The `eob_pt` coefficient CDF family (the seven transform-size class banks `TileEobPt16Cdf` through `TileEobPt1024Cdf`) is wired the same way: each is copied from its generated AV2 §9.3 default and selected by an `EobPtSize` transform-size class plus `coeff_cdf_q_ctx` and the closed-form `eobCtx` (which is 2 for chroma and `is_inter` for luma), and the family joins the copy and average and frame-end count-scaling paths; it is likewise loaded but not yet read. The `dc_sign` coefficient CDF bank (`TileDcSignCdf` indexed by `coeff_cdf_q_ctx`, `plane_type`, the `isHidden` group, and the DC-sign `ctx`) is wired the same way: copied from the generated AV2 §9.3 `Default_Dc_Sign_Cdf` defaults with all four selector indices bounds-checked; its §8.3.2 `ctx` is derived from the Above and Left DC-context buffers, which is deferred with the coeffs() loop, so the bank is loaded but not yet read. The first coefficient-SYMBOL §8.3.2 context derivations are added in `cdf/coeff_context.rs`: the two position-only coefficient base contexts `coeff_base_eob` (partitioning the scan position by the adjusted block coefficient count into the four `SIG_COEF_CONTEXTS_EOB` contexts, total over an out-of-range shift) and `coeff_base_bob` (partitioning the begin position by `segEob` shifted right by 3 and by 2 into contexts 0, 1, or 2), both pure functions of caller-supplied scan and segment scalars plus caller-resolved adjusted geometry, needing no `Level[]` magnitude buffer; they are derivation-only and not yet read by any decode path, so the minimal-fixture decode output is unchanged. The `coeff_br` coefficient base-range context (`CoeffBrContext`) is also added: it sums up to three caller-provided `Level[]` neighbour magnitudes (each clamped to `MAX_BASE_BR_RANGE` minus one) at the §8.3.2 transform-class offsets (only the first two for non-2D chroma), halves and clamps the sum to the range 0 to 6, then offsets it by plane (chroma clamps to 3), DC position (non-2D adds 7), or low frequency (adds 7). It is the first context to read the per-transform-block `Level[]` magnitudes over a caller-provided row-major slice (out-of-bounds and short-slice reads contribute 0, with checked shifts and saturating geometry so it is total and panic-free), takes the `txClass` as a caller-resolved scalar index (0 = 2D, 1 = HORIZ, 2 = VERT) rather than importing a reconstruction transform-class type so the entropy CDF-selection layer stays off the runtime-handoff dependency edge, and is exercised by compile-time const checks plus unit tests but not yet read by any decode path. The two identity-transform magnitude contexts `coeff_base_idtx_ctx` and `coeff_br_idtx_ctx` are also added, each summing the left and above `Level[]` neighbours (clamped to 3 and to `MAX_BASE_BR_RANGE` minus one respectively, the latter then clamped to 6) over a caller-provided slice with saturating geometry (total and panic-free). The main 2D significant-coefficient context `coeff_base` (`CoeffBaseContext`) is also added: it sums the significant-neighbour `Level[]` magnitudes at the generated §9.2 `Sig_Ref_Diff_Offset` offsets (clamped by a position-dependent magLimit), forms the base context, and returns a `CoeffBaseSelection` naming one of the five `coeff_base` banks (parity-hidden, chroma, chroma low-frequency, luma low-frequency, luma high-frequency) with its bank-specific offset, over a caller-provided slice with saturating geometry (total and panic-free), reusing the generated conversion table without duplication. The `dc_sign` sign context (`dc_sign_ctx`) is also added: it nets the above and left DC-sign votes over the caller-supplied `AboveDcContext` and `LeftDcContext` plane slices (sign 1 decrements, sign 2 increments) and returns ctx 1, 2, or 0; the loop breaks once the monotonic index leaves the slice so it is total and panic-free, completing the §8.3.2 `dc_sign` selection over the `dc_sign` CDF bank. The `idtx_sign` sign context (`idtx_sign_ctx`) is also added: it nets the signs of the left, above, and above-left `QuantSign` neighbours, maps the sum to a base context (5, 6, 1, 2, or 0), then adds 2 when the current `Level` exceeds `COEFF_BASE_RANGE` and the base context is non-zero, over caller-provided `QuantSign` and `Level` slices with saturating geometry (total and panic-free). With this, all §8.3.2 coefficient-symbol CDF contexts are derived. The per-transform-block level/sign buffers and above/left DC-context tile buffers are tracked separately by `tile-coeff-state-buffers`; what remains here is wiring those buffers into the §5.20 coefficient decode loop that fills and consumes them. The individual partition-entry `S()` symbol-read consumer is tracked by `tile-partition-symbol-read-boundary`; the final one-decision consumer over caller-provided facts is tracked by `tile-partition-decision-boundary`; the supported-subset Tile-to-Saved and Saved-to-Frame lifecycle boundary is tracked by `tile-cdf-save-lifecycle-boundary`. This row remains partial: it does not itself implement partition decisions, full §8.3 CDF selection, full Tile/Saved CDF banks, recursive `decode_tile()` or `read_partition()` traversal, broad `exit_symbol()` after real syntax outside the minimal trace, broad CDF lifecycle outside the supported subset, reconstruction, decoded-frame hashes, runtime Y4M output, reference refresh, public API support, AVM/dav2d invocation, repo dependency, wrapper, script, or CI/runtime external-decoder path."

