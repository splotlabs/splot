local_reference_evidence = ["docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-dav2d-syn-d45-intra-192x128-q80", "docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-syn-d45-follow-chroma-top-left-64x64-q182", "docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-syn-d45-top-left-intra-64x64-q96", "docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-syn-d45-right-edge-intra-128x128-q80"]
notes = "Opens the §7.13.2.8 ZONE-1 one-sided angle zone (pAngle below 90, needRight) by admitting the §7.13.2.8 D45_PRED directional luma mode (pAngle 45, canonical §9.2 mode 3, AngleDeltaY == 0) over a REAL reconstructed above row plus ABOVE-RIGHT plus its uv_mode == 0 directional-follow D45 chroma. Unlike the §7.13.2.8 MIDDLE angles (D113/D135/D157, 90 below pAngle below 180, which read AboveRow[0..w) and LeftCol[0..h)), the zone-1 step-1 projection reads UP-AND-RIGHT into the ABOVE-RIGHT: pred[i][j] = AboveRow[base] with base = (i + 1) + j (dx = Dr_Intra_Derivative[45] = 64, §9.2), up to maxBaseX = w + h - 1 = 127 for a 64x64 block — the upper-right triangle reads h real reconstructed above-right samples the middle angles never touch. This brick adds the zone-1 luma IDIF kernel to splot-recon (predict_intra_directional_angle_rect_one_sided_idif_into and IntraDirectionalAngleIdifEdges, RECON-INTRA-ONE-SIDED-DIRECTIONAL-ANGLE-PREDICTION): it implements §7.13.2.8 step 1 (idx = (i + 1 + mrlIndex) * dx, base = (idx >> 6) + j, shift = (idx >> 1) and 0x1F; for base below maxBaseX + 1 the 4-tap s = sum(t=0..3) Dr_Interp_Filter[shift][t] * AboveRow[base + t - 1], pred = Clip1(Round2(s, 7)), else pred = AboveRow[maxBaseX]) over the wider above edge AboveRow[-2 ..= w + h + 1] (length w + h + 4, slice index 0 = logical -2), reusing the existing §7.13.2.8 and §9.2 Dr_Interp_Filter[32][4] table UNCHANGED. Every D45 projection has shift == 0 ((i + 1) * 64 >> 1 and 0x1F == 0), so the IDIF reduces to the sample copy AboveRow[base] — but it still reads far into the real reconstructed above-right (the one-sided zone). The production luma route resolves mode value 3 through `IntraYMode::mode_to_angle`; `rect_luma_plan` applies `AngleDeltaY` and rectangular wide-angle mapping and dispatches pAngle 45 as `RectLumaPlan::OneSidedAbove` to the zone-1 reconstruction path, while the D45-follow chroma (SupportedChromaMode::D45Follow, resolved when uv_mode == 0 over the D45 luma makes §5.20.5.3 return UVMode == D45_PRED, AngleDeltaUV == 0) routes to the same function on the chroma plane (the enableIdif == 0 bilinear one-sided branch, bit-identical for D45's shift == 0). D45 is decoded via the §5.20.5.3 y_mode_offset escape (y_mode_offset == 0 -> modeIdx 7 -> modeDelta 8 -> Reordered_Y_Mode[5] == D45_PRED) at §8.3.2 ctx == 0. enable_ibp == 0 keeps useIBP == 0 (§7.13.2.7 gates useIBP on pAngle below 90); enable_intra_edge_filter == 0 and MrlIndex == 0 keep the §7.13.2.x edge-filter and upsample synthesis a no-op. The committed syn-d45-intra-192x128-q80.ivf (192x128 = three superblock columns by two rows: the top-left, top-middle, bottom-left, bottom-right 64x64 superblocks DC_PRED, the top-right DC superblock carrying a horizontal-gradient residual so it reconstructs NON-FLAT; BOTTOM-MIDDLE 64x64 superblock at frontier.r == 16, frontier.c == 16, haveLeft and haveAbove, NON-rightmost, codes D45_PRED luma plus uv_mode == 0 directional-follow D45 chroma) decodes bit-exactly to the avmdec AND dav2d oracle (raw output md5 8fe6a134c01b0d20be4016348ccd3b99; pinned splot frame hash d08056c0d1ed3f379e3072c7f1ebced04da0f6df994efd0b5f8d39b76c0b683f), guarded by the §8.2.4 exit_symbol() bit-exactness check. The follow-up syn-d45-top-left-intra-64x64-q96.ivf pins a top-left no-neighbour D45_PRED syntax case with AngleDeltaY 0 (pAngle 45), routed over the §7.13.2.1 no-neighbour above fallback; AVM raw SHA-256 6a8317f2ca517cb85a9157c9e8e86ffe7b4ad9580374cbfee7394e974a5cf06b is reproduced byte-exactly. The follow-up syn-d45-right-edge-intra-128x128-q80.ivf pins a rightmost full-SB D45 syntax case through the §5.20.5.3 y_second_mode path with num4AboveRight == 0, proving the existing square-to-rect residual fallback and §7.13.2.1 aboveLimit clamp reproduce AVM raw SHA-256 fd131679dbf64ae6ad63cf2b51894995c86bda529ff5299545225b00d478ba76 byte-exactly. The committed 106-byte syn-d45-follow-chroma-top-left-64x64-q182.ivf additionally pins D45_PRED luma with directional-follow D45 chroma over the §7.13.2.1 no-neighbour AboveRow fallback: the old decoder rejected it at byte 65 with general_intra_directional_d45_chroma_neighbour, while pinned/current avmdec and fixed Splot agree on complete raw I420 SHA-256 5f048c577d2fd6a392302aad8be4dbdb070d5dd33ccaecfe4cbadb5374aec0c3. The square-path D45, D45-follow, D67, and D67-follow chroma admission is now total over valid block geometry, reusing the existing generic zone-1 reconstruction, and the obsolete reason is removed. The 192x128 D45 block's upper-right triangle reads the real reconstructed above-right (the top-right superblock's non-flat bottom row, 32 distinct values 42..228); the block reconstructs as 33 distinct values, genuinely directional. The old code rejected the real above-right frame with the former unsupported-Y-mode gate and the top-left frame with general_intra_d45_unverified_position at byte offset 64. The `directional_luma_always_plans_through_the_rect_planner` test covers D45 and every other canonical directional luma mode through the current planner, while the D45 reconstruction and oracle tests pin the claimed above-right and output behavior. Every D45 luma position, including first-row, first-column, rightmost, sub-partitioned, and non-64x64 blocks, is now planned by the generic §7.13.2.8 rectangular directional planner; the general_intra_d45_unverified_position whitelist is retired. This historical row remains partial because its direct external-oracle evidence is fixture based and live AVM or dav2d invocation is not part of CI; later rows own D67, D203, angle deltas, MRL, IBP, wide-angle, neighbour reorder, subpartitions, inter prediction, and filters."

