notes = "Lifts the deferred row>0 directional reject by building the REAL §7.13.2.1 top-left corner AboveRow[-1] == LeftCol[-1] == CurrFrame[plane][y-1][x-1] for the haveAbove == 1 middle-angle reconstruction, unblocking the first general-intra ROW>0 directional decode. The prior build_directional_middle_edges (true, true) and (false, true) arms returned GeneralIntraResidualError::UnsupportedDirectionalAboveEdge (runtime general_intra_directional_above_edge) because the real diagonally-above-left corner is not returned by intra_dc_edges_for_rect; the admission gate rejected the whole row>0 directional path (general_intra_multirow_directional_luma for luma, general_intra_directional_chroma_neighbour for chroma). §7.13.2.8 D135 reads that corner on its main diagonal (column == row, above_base == -1, shift == 0, a sample copy); the first-row bricks only worked because at haveLeft and not haveAbove the corner is the (correct) repeated-first-left sample. This brick reads the real corner via the current-frame workspace reconstructed_sample(plane, x-1, y-1) accessor (added by DECODE-GENERAL-INTRA-GRID) in reconstruct_general_intra_directional_neighbour_block_into and threads it into the now-total build_directional_middle_edges: the (true, true) arm uses CurrFrame[plane][y-1][x-1] (aboveMrlIndex == 0 at the superblock boundary, MrlIndex == 0) plus the real above row (AboveRow[i] = CurrFrame[plane][y-1][x+i]) plus the real left column (LeftCol[i] = CurrFrame[plane][y+i][x-1]); the (false, true) arm uses the real above row and derives LeftCol[i] = AboveRow[-1] = CurrFrame[plane][y-1][x] = AboveRow[0] per §7.13.2.1. The IDIF luma 4-tap and the bilinear chroma kernel (DECODE-GENERAL-INTRA-IDIF-D157) are reused unchanged; only the edge construction differs by arm. pAngle 135's shift == 0 makes the IDIF a sample copy Edge[base] bit-identical to bilinear over the non-flat real edge, so the corner read is the new piece and D135's row>0 reconstruction is bit-exact. The committed syn-d135row-intra-128x128-q80.ivf (128x128 = two superblock columns by two rows: the top-left, top-right, and bottom-left 64x64 superblocks DC_PRED — uniform top 100, bottom-left a vertical gradient coded DC; BOTTOM-RIGHT 64x64 superblock at frontier.r == 16, frontier.c == 16, haveLeft and haveAbove codes D135_PRED luma via the §5.20.5.3 y_mode_offset escape at §8.3.2 ctx == 0 plus uv_mode == 0 directional-follow D135 chroma) decodes bit-exactly to the avmdec AND dav2d oracle (raw output md5 79bd663383515e37b75b1ad7054c84d6; pinned splot frame hash 85583e5a46ac6a2db97854b86f643735c1b9710bee2c2d2bc65d1aa5a16fe3a1), guarded by the §8.2.4 exit_symbol() bit-exactness check. Confirmed by temporary instrumentation (since removed): the bottom-right luma block reads have_left == true, have_above == true and corner == 100 (= CurrFrame[Y][63][63], the top-left superblock's bottom-right sample, NOT the 128 no-neighbour fallback); chroma U/V read corner 120/130. The OLD code rejected this exact frame (general_intra_directional_chroma_neighbour for the bottom-right chroma). All existing general-intra fixtures still decode bit-exact (the no-corner first-row and no-neighbour D135 and D157 arms are byte-identical). This row stays partial: the row>0 FIRST-column (not haveLeft and haveAbove) D135 position, any row>0 D157 position, sub-superblock (split-child) directional blocks, non-zero angle deltas, the directional-neighbour (ctx != 0) escape reorder, the other middle angle D113 and the one-sided angles D45/D67/D203, non-64x64 superblock blocks, multiple tiles, inter prediction, in-loop filters, and live AVM or dav2d invocation in CI remain unimplemented."

