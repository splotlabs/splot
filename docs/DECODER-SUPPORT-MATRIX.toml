self_contained_tests = ["crates/splot-decode/src/runtime_minimal.rs::general_intra_tests::d135row_neighbour_directional_row_gt0_corner_intra_frame_decodes_to_oracle", "crates/splot-decode/src/runtime_minimal.rs::general_intra_tests::rdir_neighbour_directional_d135_intra_frame_decodes_to_oracle", "crates/splot-decode/src/runtime_minimal.rs::general_intra_tests::d157_neighbour_directional_idif_intra_frame_decodes_to_oracle", "cargo test -p splot-decode general_intra --locked", "cargo xtask check-decoder-support", "cargo xtask check-feature-status"]
