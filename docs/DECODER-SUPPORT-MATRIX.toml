notes = "Ninth brick of the AVM-oracle general intra decode path: admits a full 2-D grid of 64x64 superblocks (width and height any positive multiples of 64, dropping the prior width == 64 || height == 64 restriction). The enabling fix is the §7.13.2.13 SMOOTH chroma top-right sentinel AboveRow[w]: a non-rightmost row>0 full-superblock block has an already-decoded above-right neighbour (clear_block_decoded_flags (§5.20.2.3) marks BlockDecoded[plane][-1][x] = 1 out to (MiColEnd - c) >> SubsamplingX, exceeding the superblock width), so the sentinel reads the real reconstructed CurrFrame[plane][y-1][Min(aboveLimit, x+w)] instead of the edge-clamped own-top sample. full_sb_chroma_num4_above_right derives §7.13.2.1 num4AboveRight faithfully to §5.20.7.25 count_top_right_avail over that BlockDecoded state (chroma w4 = n4w >> SubsamplingX, sub-block MI position (0,0)); resolve_smooth_above_right_sentinel reads the sentinel via the new total/checked CurrentFrameWorkspace::reconstructed_sample accessor, with aboveLimit = Min(maxX, x + w + 4*num4AboveRight - 1) reducing to column Min(maxX, x+w) for num4AboveRight >= 1. The bottom-left LeftCol[h] sentinel is unchanged (num4BelowLeft == 0 in raster order). SMOOTH chroma stays gated to full 64x64 superblock blocks (n4w == 16). The committed syn-grid-intra-128x128-q80.ivf (uniform luma 100; chroma distinct flat per quadrant except a SMOOTH bottom-left superblock whose above-right is the distinct top-right superblock) decodes bit-exactly to the avmdec and dav2d oracle (raw output md5 dd2fa84f802c72fea4472b3af87104f1; raw outputs agree, recorded in LOCAL-REFERENCE-EVIDENCE.toml; pinned splot frame hash 42bd99fa... asserted by the grid oracle test); the bottom-left SMOOTH block reads the real above-right (its top-right corner is pulled toward 200, not the clamped own-top 110), and the old repeat-last sentinel mismatched this fixture by 4096 bytes; all single-row/column 64x64, 128x64, and 64x128 fixtures are unchanged. This row stays partial: distinct content needing directional luma, SMOOTH chroma on sub-partitioned blocks, partial (non-multiple-of-64) frames, multiple tiles, inter prediction, in-loop filters, and live AVM or dav2d invocation in CI remain unimplemented."

