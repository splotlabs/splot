notes = "Source-backed scheduler-free `splot-recon` AV2 §7.13.3.18 block inter prediction (sub-pel motion compensation) kernel `subpel_predict_block(reference, params)`, the separable interpolation-filter convolution for a single-reference (non-compound) inter block. The horizontal pass builds an intermediateHeight by w array intermediate[r][c] equal to Round2 of (the sum over t of Subpel_Filters[filter][(p shifted right 6) and SUBPEL_MASK][t] times ref[Clip3(firstY, lastY, (y shifted right 10) plus r minus 3)][Clip3(firstX, lastX, (p shifted right 10) plus t minus 3)]) by InterRound0, with p equal to startX plus stepX times c; the vertical pass produces Preds[r][c] equal to Round2 of (the sum over t of Subpel_Filters[filter][(p shifted right 6) and SUBPEL_MASK][t] times intermediate[(p shifted right 10) plus t][c]) by InterRound1, with p equal to (startY and 1023) plus stepY times r, and the kernel applies the final §7.13.3 single-reference write Clip1(Preds[0][i][j]). InterRound0 is 3 and InterRound1 is 11 (non-compound) per §7.13.3.16. The §7.13.3.18 small-block substitution (dim at most 4 maps EIGHTTAP and EIGHTTAP_SHARP to the 4-tap index 4 and EIGHTTAP_SMOOTH to index 5) is applied per pass keyed on w (horizontal) and h (vertical). The §9 Subpel_Filters table of shape 6 by 16 by 8 is transcribed verbatim from §7.13.3.18 and diff-verified, with a test asserting every row sums to 128 (1 shifted left by FILTER_BITS) and all taps are even (the spec invariant) plus distinctive-row spot checks. The reference is a ReferencePlaneView over a row-major width times height u16 buffer; the §7.13.3.18 Clip3 to the firstX through lastX by firstY through lastY region plus the view dimension clamp implement the §7.11.3.x reference-border extension without copying a padded plane. The §7.13.3.17 motion-vector scaling (startX, startY, stepX, stepY), the §7.13.3.18 reference-clipping region (firstX, firstY, lastX, lastY), the §6 interp_filter, the block dimensions, and the reference samples are caller-resolved. Total and panic-free: the constructor validates the buffer length and non-zero dimensions, the convolution rejects a zero or oversized (greater than 128) block and a negative step, the intermediateHeight derivation guarantees the vertical-pass base plus 7 row is in range with an explicit guard, and the i64 filter sums cannot overflow for in-range samples. Strictly additive and no-output-change (`pub` items with no rewiring), so the minimal flat-intra and zero-MV inter fixture snapshots stay byte-identical. Proven by hand-anchored worked examples (a full-pel position is a bit-exact reference copy, a flat reference reconstructs flat for any phase, a hand-computed EIGHTTAP_SHARP half-pel, the border-extension corner case, 10-bit Clip1, the small-block 4-tap substitution) plus a 2000-case deterministic-LCG property test comparing the function against an independent in-test re-trace of the §7.13.3.18 pseudocode over varied content, block sizes, filters, and sub-pel phases, and the error cases. This row does not implement the §7.13.3.17 motion-vector scaling, the §7.13.3 compound or mask-blend or distance-weighted prediction, the §7.13.3.19 block warp, the §7.13.3 reference-area clipping selection, intra block copy, the §5.20.7 read_mv or interp_filter symbol decode, the inter mode_info or partition syntax, or wiring into the runtime decode path."

