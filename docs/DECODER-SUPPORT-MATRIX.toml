decode_module = "crates/splot-decode/src/filters/cdef.rs"
tier = "tier1-intra"
status = "partial"
self_contained_tests = ["crates/splot-decode/src/pipeline/mod.rs::general_intra_tests::general_intra_cdef_tests::cdef_active_intra_frame_decodes_to_oracle", "cargo test -p splot-decode cdef --locked", "cargo test -p splot-recon cdef_filter --locked", "cargo xtask conformance", "cargo xtask check-fixtures", "cargo xtask check-decoder-support", "cargo xtask check-decoder-conformance-coverage", "cargo xtask check-feature-status"]
diagnostics = ["decode/unsupported-feature"]
local_reference_evidence = ["docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-dav2d-syn-2sb-cdef-intra-128x64-q130", "docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-dav2d-syn-2sb-cdef-intra-128x64-q120", "docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-dav2d-syn-2sb-cdefdeblock-intra-128x64-q100", "docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-dav2d-syn-2sb-cdefuv-intra-128x64-q170"]
notes = "Second in-loop-filter brick (after general-intra-deblock): §7.18/§7.18.1 CDEF 64x64-unit to 8x8-block orchestration over the splot-recon per-block primitives (cdef_direction, cdef_constrain, cdef_filter_sample, RECON-CDEF-FILTER), in a new crates/splot-decode/src/cdef.rs module. Applied AFTER §7.17 deblocking, reading the deblocked CurrFrame in place before workspace.freeze() (filter order: deblock then CDEF). The general intra route gate is relaxed to admit a CDEF-ACTIVE subset (previously it rejected any cdef_frame_enable); GDF/CCSO/loop-restoration stay rejected. Per 8x8 block the orchestration runs the §7.18.2 direction search over the deblocked luma 8x8, derives the §7.18.1 luma strengths (var-scaled priStr, secStr), direction and damping and the chroma strengths, direction (Cdef_Uv_Dir indexed by subX, subY, yDir) and damping, fetches the six §7.18.3 directional taps via cdef_get_at with the §5.20.9.3 is_inside_filter_region (single tile -> is_inside_frame) availability check from a pre-CDEF snapshot of the deblocked frame, and writes the deringed sample back via CurrentFrameWorkspace::set_reconstructed_sample. A CDEF-OFF frame skips the pass entirely (existing 8-bit and 10-bit fixtures stay byte-identical, verified). The committed fixtures decode bit-exactly to the avmdec AND dav2d oracle: syn-2sb-cdef-intra-128x64-q130.ivf (CdefDamping 5, y_pri 1 y_sec 4, raw md5 192e3935f9892345a14e02cb4baf4ba5), syn-2sb-cdef-intra-128x64-q120.ivf (CdefDamping 4, y_pri 2 y_sec 4, raw md5 2319a8f00af1ebb919a52ba18d90f4a1), syn-2sb-cdefdeblock-intra-128x64-q100.ivf (deblock apply [false,true,true,true] AND CDEF both active, CdefDamping 4 y_pri 1 y_sec 4, raw md5 472d95801ce2a112160bcdfee93957d5 — pins the deblock-then-CDEF order), and syn-2sb-cdefuv-intra-128x64-q170.ivf (NONZERO chroma CDEF: two 64x64 PARTITION_NONE superblocks, both DC_PRED luma with left non-follow H_PRED chroma and right DC chroma, CdefDamping 5 y_pri 10 y_sec 4 AND uv_pri 2 uv_sec 4, raw md5 d783f353078cf156ba23dcfd3b2b50ad — the first fixture to exercise the §7.18.1 chroma steps 9-14 sample-changingly: the Cdef_Uv_Dir[1][1][yDir] direction selection (engaged because uv_pri != 0), the 4:2:0 subsampled 4x4 chroma tap addressing, and the CdefDamping-1 chroma damping; over a thousand U and V samples each change from the CDEF-off reconstruction). The §7.18.2 direction search drives a real per-block dering (yDir varies 0/2/4/6, var positive over the cosine-AC content), changing thousands of luma samples (and, for the nonzero-uv fixture, over a thousand chroma samples per plane) from the CDEF-off reconstruction. VERIFIED SUBSET: 8-bit 4:2:0 only (a CDEF-active 10-bit frame is rejected — the math is bit-depth-generic but no 10-bit CDEF fixture pins it; CDEF-OFF 10-bit is unaffected), CdefStrengths==1 (so §5.20.10.1 read_cdef reads no per-block symbol — cdef_idx==0 everywhere; a multi-strength frame is rejected), cdef_on_skip_txfm_frame_enable==1 (so the §7.18.1 skip is 0), single tile, segmentation disabled. Both luma and chroma (uv) strengths are now admitted and oracle-pinned. This row stays partial: multi-strength frames and their per-block read_cdef symbols, cdef_on_skip_txfm_frame_enable==0 skip handling, lossless/segmentation skipChroma, 10-bit CDEF, multiple tiles, the other in-loop filters, inter frames, and live AVM or dav2d invocation in CI remain unimplemented."

