spec_sections = ["5.20.5.3", "5.20.5.5", "5.20.7.27", "7.13.2.13", "8.3.2"]
parser_source = "docs/spec/av2/1.0.0/05-syntax-structures.md; docs/spec/av2/1.0.0/08-parsing-process.md"
decode_module = "crates/splot-decode/src/bitstream/tile_payload/general_intra_block.rs"
tier = "tier1-intra"
status = "partial"
self_contained_tests = ["crates/splot-decode/src/pipeline/mod.rs::general_intra_tests::dirneigh_directional_neighbour_ctx_intra_frame_decodes_to_oracle", "crates/splot-decode/src/bitstream/tile_payload/general_intra_block.rs::tests::directional_neighbour_ctx_reads_with_the_real_context", "cargo test -p splot-decode general_intra --locked", "cargo test -p splot-cli --test conformance --locked", "cargo xtask check-decoder-support", "cargo xtask check-feature-status"]
diagnostics = ["decode/unsupported-feature"]
local_reference_evidence = ["docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-dav2d-syn-dirneigh-intra-128x64-q80"]
notes = "Fourteenth brick of the AVM-oracle general intra decode path: lifts the deferred directional-neighbour (ctx != 0) y_mode_index reject. A block whose already-decoded left/above neighbour stored a directional IntraJointMode (>= NON_DIRECTIONAL_MODES_COUNT 5) now reads y_mode_set+y_mode_index from the real §8.3.2 TileYModeIndexCdf[ctx] row (ctx 1 or 2) instead of being rejected with general_intra_directional_neighbour_y_mode_index_ctx. The §8.3.2 ctx (ctx = (get_joint_mode(0) >= NON_DIRECTIONAL_MODES_COUNT) + (get_joint_mode(1) >= NON_DIRECTIONAL_MODES_COUNT)) and the per-MI IntraJointModes grid (TileIntraJointModeState) were already built by general-intra-mb-neighbour-smooth, and the CDF banks are already indexed by ctx; this brick removes the `if mode_ctx != 0 { return Err }` guard and reads with the ctx. WHY this is the only code needed for a non-directional neighbour-reading block: §5.20.5.3 get_intra_y_mode_set returns modeIdx UNCHANGED when modeIdx < NON_DIRECTIONAL_MODES_COUNT (05-syntax-structures.md lines 11116-11118); the directional-neighbour selection loop (lines 11120-11176) fires ONLY for modeIdx >= NON_DIRECTIONAL_MODES_COUNT. The verified right block decodes y_mode_set == 0, y_mode_index == 2 < 5 (not the MODE_INDEX_COUNT - 1 escape), so modeIdx == 2 passes straight through to Reordered_Y_Mode[2] == SMOOTH_V_PRED — the reorder never runs, exactly as reconstruct_minimal_y_mode already handles it. The y_mode_offset escape (modeIdx >= 5) over a directional neighbour WOULD need that reorder; it is rejected after consuming the y_mode_offset symbol (GeneralIntraBlockModeError::UnsupportedDirectionalNeighbourReorder, runtime general_intra_directional_neighbour_reorder), since the resolved mode would be directional and need the deferred §7.13.2.8 luma IDIF anyway. Confirmed by temporary instrumentation (since removed): for the committed fixture the RIGHT block's §8.3.2 y_mode_index ctx is 1 (the D135 left neighbour stored modeDelta 36 >= 5) — the OLD code rejected this exact frame. The committed syn-dirneigh-intra-128x64-q80.ivf (128x64: LEFT 64x64 codes as the §7.13.2.8 D135_PRED directional mode via the §5.20.5.3 y_mode_offset escape, IntraJointMode 36; RIGHT 64x64 codes as SMOOTH_V_PRED over a vertical gradient, flat chroma U=120 V=130) decodes bit-exactly to the avmdec AND dav2d oracle (raw output md5 1a84b6545ee333b98cdf1982fd18310a; raw outputs agree, recorded in LOCAL-REFERENCE-EVIDENCE.toml; pinned splot frame hash ad1515885df5620a31c37f855934ae2432167edbf1b1b62081552b9df3957426 asserted by the dirneigh oracle test), guarded by the §8.2.4 exit_symbol() check; all existing general-intra fixtures still decode bit-exact and a directional-NEIGHBOUR (ctx != 0) y_mode_offset escape still rejects (the §5.20.5.3 reorder). This row stays partial: the §5.20.5.3 in-frame directional-neighbour reorder of get_intra_y_mode_set (reachable only via the y_mode_offset escape — general_intra_directional_neighbour_reorder), non-D135 directional luma over a real edge (shift != 0, real §7.13.2.8 IDIF — general_intra_unsupported_luma_mode; the D135 case is supported by DECODE-GENERAL-INTRA-NEIGHBOUR-DIRECTIONAL), the y_mode_set != 0 (y_second_mode) path, sub-superblock non-DC blocks, multiple tiles, inter prediction, in-loop filters, and live AVM or dav2d invocation in CI remain unimplemented."

[[row]]
id = "general-intra-directional-follow-chroma"
name = "General intra single-block directional-follow (D135) chroma decode"
feature_id = "DECODE-GENERAL-INTRA-DIRECTIONAL-FOLLOW-CHROMA"
spec_sections = ["5.20.5.3", "5.20.7.27", "7.13.2.1", "7.13.2.8", "8.2.4", "9.2"]
parser_source = "docs/spec/av2/1.0.0/05-syntax-structures.md; docs/spec/av2/1.0.0/07-decoding-process.md"
decode_module = "crates/splot-decode/src/pipeline/reconstruct.rs"
tier = "tier1-intra"
status = "partial"
self_contained_tests = ["crates/splot-decode/src/pipeline/mod.rs::general_intra_tests::dfchroma_directional_follow_chroma_intra_frame_decodes_to_oracle", "crates/splot-decode/src/bitstream/tile_payload/cdf/block_context.rs::tests::supported_chroma_mode_directional_follow_resolves_d135_for_uv_mode_zero", "crates/splot-decode/src/bitstream/tile_payload/cdf/block_context.rs::tests::supported_chroma_mode_non_follow_d135_is_deferred", "cargo test -p splot-decode general_intra --locked", "cargo test -p splot-decode block_context --locked", "cargo test -p splot-cli --test conformance --locked", "cargo xtask check-decoder-support", "cargo xtask check-feature-status"]
diagnostics = ["decode/unsupported-feature"]
local_reference_evidence = ["docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-dav2d-syn-dfchroma-intra-64x64-q80"]
notes = "Thirteenth brick of the AVM-oracle general intra decode path and the first directional-follow CHROMA prediction: the §7.13.2.8 D135_PRED chroma mode the minimal-tool avmenc pairs with a D135 luma block, which the prior chroma admission rejected (general_intra_non_dc_chroma_mode). The §5.20.5.3 read_intra_uv_mode decodes uv_mode == 0 over the directional luma, so get_intra_uv_mode_set(0) returns YMode (the directional-follow branch, §5.20.5.3 mirror line 11316) and the spec sets AngleDeltaUV = AngleDeltaY (line 11288); for the supported luma D135 (AngleDeltaY == 0) the chroma resolves to UVMode == D135_PRED, AngleDeltaUV == 0 — a plain §7.13.2.8 middle-angle chroma intra prediction, NOT CfL (UV_CFL_PRED, §5.20.5.3 line 11268), CCTX, or MHCCP (those read separate cross-component syntax and are out of scope and still rejected). Confirmed by temporary mode instrumentation (since removed): the committed fixture decodes y_mode == 4 (D135), uv_mode == 0, resolved UVMode == 4 (D135). supported_chroma_mode resolves D135_PRED to the new SupportedChromaMode::D135Follow ONLY for the follow branch (uv_mode == 0 and directional luma); a non-follow D135_PRED from the Default_Mode_List_Uv scan paired with a non-directional luma is left deferred (no oracle fixture). The runtime gates D135Follow to the top-left (no-neighbour) 64x64 superblock (n4w == 16), where the chroma plane has no above/left neighbour so the §7.13.2.1 prediction edges reduce to the flat fallbacks (8-bit: AboveRow 127, LeftCol 129, shared corner 128) and the enable_intra_edge_filter/IDIF/upsample synthesis is a no-op; pAngle 135's dx = dy = Dr_Intra_Derivative[45] = 64 give shift == 0 so the §7.13.2.8 bilinear middle-angle predictor (enableIdif == 0 for chroma, since enableIdif = plane == 0) is a sample copy of the flat fallback edge. The new reconstruct_general_intra_chroma_directional_first_into builds that prediction via the shared splot-recon predict_intra_middle_directional_angle_rect_into (the SAME predict_directional_noneighbour helper the luma D135 path uses) and adds the §5.20.7.27 chroma residual through reconstruct_general_intra_block_with_prediction. Over the flat fallback edges the D135 chroma prediction is a genuine 135-degree anti-diagonal split (upper-right 127, lower-left 129, anti-diagonal 128), so with the diagonal chroma residual both U and V reconstruct as a genuine directional pattern (17 distinct values each), NOT a flat DC level. The committed syn-dfchroma-intra-64x64-q80.ivf (one 64x64 D135 luma block, top half near 40/bottom half near 210, 135-degree anti-diagonal chroma) decodes bit-exactly to the avmdec AND dav2d oracle (raw output md5 09fc23f0bced8ab5b9562d6d2478af1c; raw outputs agree, recorded in LOCAL-REFERENCE-EVIDENCE.toml; pinned splot frame hash 628b759dcb63356ad3174063652c54d7ebf6f54d1566ab9f1b64b3a74542154f asserted by the dfchroma oracle test), guarded by the §8.2.4 exit_symbol() check; all existing general-intra fixtures still decode bit-exact (the original syn-hedge fixture, which uses the uv_mode == 1 DC chroma, is unchanged). This row stays partial: neighbour-having directional chroma over a real non-flat edge (the §7.13.2.8 chroma prediction is bilinear since enableIdif = plane == 0 = 0 for U/V; the bilinear prediction over a real non-flat edge is not yet verified — general_intra_directional_chroma_neighbour), other directional chroma angles and non-zero AngleDeltaUV, the non-follow D135_PRED scan pairing, CfL/CCTX/MHCCP chroma, SMOOTH_V/H and PAETH chroma, sub-superblock chroma, non-64x64 frames, inter prediction, in-loop filters, and live AVM or dav2d invocation in CI remain unimplemented."

[[row]]
id = "general-intra-neighbour-directional"
name = "General intra neighbour-having directional (D135) luma + follow chroma over a real edge"
feature_id = "DECODE-GENERAL-INTRA-NEIGHBOUR-DIRECTIONAL"
spec_sections = ["5.20.5.3", "5.20.7.27", "7.13.2.1", "7.13.2.8", "8.2.4", "9.2"]
parser_source = "docs/spec/av2/1.0.0/05-syntax-structures.md; docs/spec/av2/1.0.0/07-decoding-process.md"
decode_module = "crates/splot-decode/src/pipeline/reconstruct.rs"
tier = "tier1-intra"
status = "partial"
self_contained_tests = ["crates/splot-decode/src/pipeline/mod.rs::general_intra_tests::rdir_neighbour_directional_d135_intra_frame_decodes_to_oracle", "cargo test -p splot-decode general_intra --locked", "cargo xtask check-decoder-support", "cargo xtask check-feature-status"]
diagnostics = ["decode/unsupported-feature"]
local_reference_evidence = ["docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-dav2d-syn-rdir-intra-128x64-q80"]
notes = "Lifts the deferred rejects for a §7.13.2.8 D135_PRED luma block (and its uv_mode == 0 directional-follow D135 chroma) that reads a REAL reconstructed neighbour edge (previously general_intra_multiblock_directional_luma for luma and general_intra_directional_chroma_neighbour for chroma, which gated D135 to the no-neighbour top-left block over §7.13.2.1 flat fallbacks). KEY SPEC FINDING: pAngle 135 is a §7.13.2.8 middle angle (90 < pAngle < 180) with dx = dy = Dr_Intra_Derivative[45] = 64, so every projection idx is a multiple of 64 and shift = (idx >> 1) & 0x1F == 0. At shift == 0 the §7.13.2.8 luma IDIF 4-tap (enableIdif == 1, plane 0) collapses to Dr_Interp_Filter[0] = {0, 128, 0, 0}, i.e. Clip1(Round2(128 * Edge[base], 7)) == Edge[base], BIT-IDENTICAL to the chroma bilinear branch (enableIdif == 0: Round2(Edge[base] * 32 + Edge[base+1] * 0, 5) == Edge[base]) — a pure sample copy Edge[base] EVEN OVER A NON-FLAT reconstructed edge (verified numerically and against the oracle). So no genuine IDIF 4-tap kernel was needed for D135; the existing shared bilinear predict_intra_middle_directional_angle_rect_into is exact for D135 in both planes, and the only new work is reading the REAL §7.13.2.1 edges. The new reconstruct_general_intra_directional_neighbour_block_into (plane-general) builds the logical AboveRow[-1..w) and LeftCol[-1..h) edges from the partially-built frame via build_directional_middle_edges, faithful to §7.13.2.1 for the minimal-tool subset (MrlIndex == 0, enable_intra_edge_filter == 0, no DIP/upsample): for the verified first-superblock-row block (frontier.r == 0, haveLeft == 1, haveAbove == 0) LeftCol[i] is the real reconstructed left column (bottom-left sentinel clamped, num4BelowLeft == 0), AboveRow[i] = CurrFrame[plane][y][x-1] (the repeated first left sample), and the corner AboveRow[-1] = LeftCol[-1] = CurrFrame[plane][y][x-1]. D135 never reads the above-right sentinel value, so no above-right resolver is needed. The D135 escape was decoded with a NON-directional joint-mode neighbour (ctx == 0), so the left neighbour is DC/SMOOTH and supplies the real left column; the chroma is the uv_mode == 0 directional-follow of the luma D135, routed by reconstruct_general_intra_chroma_block_into (D135Follow with x > 0 || y > 0) to the same neighbour path. The committed syn-rdir-intra-128x64-q80.ivf (two 64x64 superblocks: LEFT codes SMOOTH_V_PRED luma over a vertical gradient with DC chroma; RIGHT codes D135_PRED luma + directional-follow D135 chroma reading the LEFT superblock's real reconstructed right column — a non-flat 34-distinct-value vertical gradient — as its §7.13.2.1 left edge; flat chroma U=120 V=130) decodes bit-exactly to the avmdec AND dav2d oracle (raw output md5 9ff7e4d46c0dd4fa979070ce4ca4dd1c; raw outputs agree, recorded in LOCAL-REFERENCE-EVIDENCE.toml; pinned splot frame hash 9ea9254abc7d7507558099d5ae3e78eaf5d88625e1cc8184038321650b2b54a4 asserted by the rdir oracle test), guarded by the §8.2.4 exit_symbol() check; the OLD code rejected this exact frame (general_intra_directional_chroma_neighbour, the chroma reject firing first). All existing general-intra fixtures still decode bit-exact and a non-D135 directional right block still rejects (general_intra_unsupported_luma_mode for luma or general_intra_non_dc_chroma_mode for the follow chroma). This row stays partial: a row>0 D135 block reading the real reconstructed above row (general_intra_multirow_directional_luma — bit-exact by the same shift == 0 argument but not yet oracle-fixtured), sub-superblock (split) directional blocks (general_intra_multiblock_directional_subblock — need the per-block §5.20.2.3 BlockDecoded update + mode-dependent transform type), a directional NEIGHBOUR (ctx != 0) D135 escape (the §5.20.5.3 directional-neighbour reorder, general_intra_directional_neighbour_reorder), other directional angles and non-zero angle deltas (where shift != 0 so the real §7.13.2.8 IDIF 4-tap genuinely differs from bilinear), non-64x64 frames, inter prediction, in-loop filters, and live AVM or dav2d invocation in CI remain unimplemented."

[[row]]
id = "general-intra-cardinal"
name = "General intra cardinal V_PRED or H_PRED luma + follow chroma over a real edge"
feature_id = "DECODE-GENERAL-INTRA-CARDINAL"
spec_sections = ["5.20.5.3", "5.20.7.27", "7.13.2.1", "7.13.2.7", "7.13.2.8", "8.2.4", "9.2"]
parser_source = "docs/spec/av2/1.0.0/05-syntax-structures.md; docs/spec/av2/1.0.0/07-decoding-process.md"
decode_module = "crates/splot-decode/src/pipeline/reconstruct.rs"
tier = "tier1-intra"
status = "partial"
self_contained_tests = ["crates/splot-decode/src/pipeline/mod.rs::general_intra_tests::vpred_cardinal_multirow_intra_frame_decodes_to_oracle", "crates/splot-decode/src/pipeline/mod.rs::general_intra_tests::hpred_cardinal_multicolumn_intra_frame_decodes_to_oracle", "crates/splot-decode/src/pipeline/mod.rs::general_intra_tests::lossless_cardinal_y_and_top_left_angle_delta_variants_decode_to_oracle", "crates/splot-decode/src/pipeline/general_intra.rs::tests::cardinal_top_left_guard_admits_only_verified_shapes", "crates/splot-decode/src/bitstream/tile_payload/cdf/block_context.rs::tests::first_set_directional_reconstructs_v_pred_for_index_five", "cargo test -p splot-decode general_intra --locked", "cargo xtask check-decoder-support", "cargo xtask check-feature-status"]
diagnostics = ["decode/unsupported-feature"]
local_reference_evidence = ["docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-dav2d-syn-vpred-intra-64x128-q160", "docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-syn-vpred-top-left-intra-64x64-q96", "docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-syn-hpred-top-left-intra-64x64-q96", "docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-dav2d-syn-hpred-intra-128x64-q180"]
notes = "Adds the two CARDINAL §7.13.2.8 directional luma modes (V_PRED pAngle 90, step 4; H_PRED pAngle 180, step 5) over a REAL reconstructed neighbour edge, plus their uv_mode == 0 directional-follow chroma. The cardinal cases are a degenerate sample copy with NO IDIF, NO corner, NO edge synthesis and NO useIBP (§7.13.2.7 gates useIBP on pAngle below 90 or above 180, and §7.13.2.7's edge-filter step is skipped entirely for pAngle == 90 or 180): V_PRED is pred[i][j] = AboveRow[j] (every row copies the real reconstructed §7.13.2.1 above row, needs haveAbove == 1, a row>0 superblock); H_PRED is pred[i][j] = LeftCol[i] (every column copies the real left column, needs haveLeft == 1, a non-first-column superblock). Unlike a §7.13.2.8 middle angle (D135), the cardinal copy is bit-exact over a NON-flat reconstructed edge without any interpolation. KEY DECODE-PATH FINDING (corrects the brief's y_mode_offset escape hint): at §8.3.2 ctx == 0, V_PRED and H_PRED with AngleDeltaY == 0 are NOT reachable via the y_mode_offset escape (its modeIdx 7..12 only reaches D45/D67/D113/D135/D157/D203); they are coded via the §5.20.5.3 DIRECT first-mode-set y_mode_index (modeIdx == y_mode_index, no escape): V_PRED at y_mode_index == 5 (get_intra_y_mode_set(5) -> Default_Mode_List_Y[0] == 17 -> modeDelta 22 -> Reordered_Y_Mode[7] == V_PRED, AngleDeltaY 0), H_PRED at y_mode_index == 6 (Default_Mode_List_Y[1] == 45 -> modeDelta 50 -> Reordered_Y_Mode[11] == H_PRED, AngleDeltaY 0). Empirically confirmed: avmenc with --enable-smooth-intra=0 over a perfect vertical-or-horizontal continuation at higher QP (base_q_idx 160 and 180) codes y_mode_set == 0, y_mode_index == 5 or 6 (at lower QP it preferred an angled y_second_mode V-or-H delta). reconstruct_y_mode_first_set_directional_top_left reuses the shared resolve_y_mode_top_left and get_intra_y_mode_set_top_left (the same ctx == 0 selection the escape uses); ctx != 0 is REJECTED (general_intra_directional_neighbour_reorder, the unmodelled §5.20.5.3 reorder). The new reconstruct_general_intra_cardinal_neighbour_block_into reads the real §7.13.2.1 edge from intra_dc_edges_for_rect (above row for V, left column for H) and runs the shared predict_intra_cardinal_directional_rect_into; the chroma follow (SupportedChromaMode::VerticalFollow and HorizontalFollow, resolved when uv_mode == 0 over a V-or-H luma makes §5.20.5.3 return UVMode == V_PRED or H_PRED, AngleDeltaUV == 0) routes to the same function (chroma uses no IDIF). The committed syn-vpred-intra-64x128-q160.ivf (top DC superblock + bottom V_PRED superblock over a column-constant input, frontier.r == 16) and syn-hpred-intra-128x64-q180.ivf (left DC superblock + right H_PRED superblock over a row-constant input, frontier.c == 16) each decode bit-exactly to the avmdec AND dav2d oracle (V raw md5 d35b827668076a934bb6c21717f9a8f9, pinned frame hash 5b2761c0d2eb2502af5cbe544b2cadbb676a4b84b60953d86a3e42d7df910e39; H raw md5 aac61b219518ce5057a6284262ac3bb9, pinned frame hash 826cea4e59f8280b538c3efc26e7be72cd1912aa19f235ebf3f862fc8832a885; raw outputs agree, recorded in LOCAL-REFERENCE-EVIDENCE.toml), guarded by the §8.2.4 exit_symbol() check. The follow-up syn-vpred-top-left-intra-64x64-q96.ivf pins a top-left no-neighbour V_PRED syntax case with AngleDeltaY 2 (pAngle 96), routed as a §7.13.2.8 middle-angle prediction over fallback edges; AVM raw SHA-256 3b0a07a4c0686c9d3d4c7715691159468e545bd70989707c25dbeee330e33ae5 is reproduced byte-exactly. This row records that fixture here because the prior vertical gate owned the unsupported reason; it is not broad support for non-cardinal angles. The follow-up syn-hpred-top-left-intra-64x64-q96.ivf pins a top-left no-neighbour H_PRED syntax case with AngleDeltaY 0 (pAngle 180), routed as the exact §7.13.2.8 cardinal horizontal copy over the §7.13.2.1 no-left fallback; AVM raw SHA-256 f06ae152103a1abcb6d853faf078d35c770734acd99827c625763bd8b73a2854 is reproduced byte-exactly. The OLD code rejected both real-edge frames (general_intra_unsupported_y_mode at the cardinal block's y_mode_index == 5/6) and the H_PRED top-left frame (general_intra_cardinal_horizontal_unverified at byte offset 64). All existing general-intra fixtures still decode bit-exact and a non-cardinal directional first-set block (e.g. a D45 block) still rejects (general_intra_unsupported_y_mode). This row stays partial: exact pAngle-90 first-superblock-row V_PRED reading the §7.13.2.1 no-neighbour fallback (general_intra_cardinal_vertical_unverified), sub-superblock (split) cardinal blocks, a directional-neighbour (ctx != 0) cardinal escape-or-reorder, other fallback-edge directional angles and remaining non-zero angle deltas outside this single AngleDeltaY 2 V_PRED case, the y_second_mode (y_mode_set != 0) path, non-64x64 superblock blocks, multiple tiles, inter prediction, in-loop filters, and live AVM or dav2d invocation in CI remain unimplemented."

