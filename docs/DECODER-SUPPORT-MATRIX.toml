notes = "THE fundamental capability for real sequences: decode a frame that selects among TWO valid decoded references, retaining a prior decoded INTER frame as a reference (local decoder mission's ~12961 frames each reference prior decoded frames). The committed syn-3frame-multiref-64x64.ivf (project-owned flat synthetic input: frame 0 luma 100; frames 1 AND 2 luma 160 — frames 1/2 identical to each other but DISTINCT from the key; --qp 80 --sb-size 64 --min/max-partition-size 64 --enable-global-motion=1 --cdf-update-mode=0, broad tools disabled) is a three-frame 64x64 stream: frame 0 = OBU_CLOSED_LOOP_KEY (flat DC_PRED intra; §7.20 refresh allFrames -> §7.23 :14100 marks only slot 0 valid), frame 1 = OBU_REGULAR_TILE_GROUP (single-reference inter, §7.7 NumTotalRefs == 1 -> ref_frame_idx [0] == the key; refreshes slot 1, so §7.23 retains frame 1 as a SECOND valid reference), frame 2 = OBU_REGULAR_TILE_GROUP over TWO valid slots (§7.7 ranks ref_frame_idx [0, 1], NumTotalRefs == 2) whose block reads §5.20.7.12 single_ref (over the §8.3.2 no-neighbour comp_ref/count_refs context 1) -> RefFrame[0] == 1 -> ref_frame_idx[1] == slot 1, motion-compensating the RETAINED frame 1 (luma 160), NOT the key (luma 100). `splot decode syn-3frame-multiref-64x64.ivf --output-format raw` reproduces md5 861078138ab514bd847ccfe22ac44fa1 (18432 bytes) byte-for-byte vs avmdec --rawvideo --i420 and dav2d --demuxer ivf --muxer yuv (recorded as lref-avm-dav2d-syn-3frame-multiref-64x64). ASYMMETRIC PROOF: frame 2 reconstructs to 160 (frame 1) not 100 (key), so a wrong slot-0 read is falsifiable. The runtime resolves following inter candidates by planned OBU offset, not by IVF record index; `multiref_fixture_decodes_when_two_frame_units_share_one_ivf_record` repacks the already oracle-proven frame-1 and frame-2 Annex B payloads into one IVF record and verifies the same three decoded frames. THREE pieces wired: (1) splot-core FrameReferenceStateView now models RefBaseQIdx (the new from_slots_with_base_q_idx) — the ONLY §7.7 scoring input the single-spatial-layer minimal frame leaves non-deterministic — so derive_implicit_ref_map lifts its valid_count > 1 -> UnmodeledDerivation gate and runs the real §7.7 ranking over two valid slots; the historical from_slots view STAYS an UnmodeledDerivation stop. (2) RuntimeReferenceBuffer applies the §7.23 update per refresh_frame_flags and builds the borrowed ReferenceFrameStore for later frames. The multi-frame runtime no longer rejects solely because more than three frame candidates were planned; `four_frame_multiref_reaches_too_many_valid_references_gate` repeats the already oracle-proven third-frame payload as a fourth candidate and proves the stream reaches the precise `inter_too_many_valid_references` gate before output once a third valid reference slot would be needed. (3) the block decode wires read_single_ref + the §8.3.2 single_ref ctx. VERIFIED-SUBSET DISCIPLINE (rejected before output; gates hardened by the PR #447 follow-up over 5 codex findings): NumTotalRefs > 2, compound/reference_select, a fourth frame once it needs >2 valid references, a neighbour-having single_ref block, > 2 valid slots, and FOUR cross-frame-state cases the decoder does not model. (a) §7.23 cross-frame CDF save/load: set_primary_ref_frame_and_ctx (§5 :5411-5430) is modelled PRECISELY including the PRIMARY_REF_CHOOSE resolution (mirror :5414-5415) via choose_primary_secondary_ref_frame (mirror :5451-5510 — the inter-only RefFrameType == INTER_FRAME candidate filter + qpDiff/is_ref_better, cross-checked vs AVM av2/common/pred_common.c). inter_cdf_inheritance_unmodeled rejects iff the §5-RESOLVED primary_ref_frame loads a PER-SLOT-ADAPTED slot (each §7.23 slot records RefFrameType and disable_cdf_update; replaces the old coarse 'any prior adapted' + 'CHOOSE = no-load' shortcut, which let a CHOOSE frame resolving to a real adapted inter reference bypass the guard). The committed fixtures resolve CHOOSE to PRIMARY_REF_NONE (valid slots hold the KEY frame) or a NON-adapted slot, so they stay byte-identical. (b) temporal MV: inter_temporal_mvs_unmodeled rejects enable_ref_frame_mvs/use_ref_frame_mvs once an inter reference is retained (no §7.23 SavedMvs). (c) order-hint wrap: inter_order_hint_wrapped rejects a history spanning a full OrderHintBits window (RefOrderHint is the unwrapped OrderHint only within one window). (d) incomplete reference state: derive_implicit_ref_map keeps the valid_count > 1 UnmodeledDerivation stop unless all §7.7 ranking inputs are supplied as complete parallel slices covering every active slot (+ frame size when check_res). All existing inter and general-intra fixtures stay byte-identical. NAMED FOLLOW-ON: §7.23 cross-frame CDF save/load (so an adapted reference can be LOADED instead of rejected), §7.23 SavedMvs (temporal MV), storing the unwrapped OrderHint (so a wrapped history decodes), NumTotalRefs > 2 (multi-decision single_ref), neighbour-having single_ref context, compound references, and the deferred §7.12.2 ref-MV-bank/DRL-reorder/warp candidates. No live AVM/dav2d invocation in CI."

