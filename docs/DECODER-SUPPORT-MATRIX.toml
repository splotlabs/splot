local_reference_evidence = ["docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-dav2d-syn-2sb-inter-128x64-q80"]
notes = "Widens the inter decode arc from a single 64x64 superblock (DECODE-INTER-MVSTACK-SPATIAL is multi-BLOCK but inside one 64x64 superblock) to a MULTI-SUPERBLOCK inter frame — a single superblock ROW (height 64, width a positive multiple of 64) of 64x64 superblocks, iterated by the §5.20.2.1 decode_tile() raster loop — where a block in the SECOND superblock predicts its motion vector from the immediately-prior superblock's reconstructed-edge neighbour via the frame-wide §7.11/§7.12 find_mv_stack grid (a prerequisite for real-content scale; local decoder mission is 1920x1080). The committed syn-2sb-inter-128x64-q80.ivf (project-owned synthetic input: frame 0 two flat 64x64 luma superblocks 100/150 + flat chroma, frame 1 shifted left 6 luma samples; broad decode tools incl. GDF/cdef/deblocking/restoration/ccso/cfl/mhccp/cctx/qm/ibp/mrls/intra-edge-filter/angle-delta/ist/inter-ist/intra-dip/idtx-intra/smooth-intra/paeth-intra/bawp/cwp/tcq/trellis/all-warp/tip/opfl-refine/refinemv/masked-wedge-interintra-onesided-diffwtd-compound/joint-mvd/adaptive-mvd/flex-mvres/ref-frame-mvs/refmvbank/drl-reorder/mv-traj/high-motion/inter-ddt/skip-mode/bru/global-motion/tx-partition/rect/ext/uneven-partitions/parity-hiding/mvd-sign-derive disabled; --qp 80 --sb-size 64 --min-partition-size 64 --max-partition-size 64) is a two-frame 128x64 stream: frame 0 = OBU_CLOSED_LOOP_KEY (two DC_PRED intra superblocks), frame 1 = OBU_REGULAR_TILE_GROUP whose two 64x64 superblocks are each a single 64x64 single-reference inter block. avmdec --rawvideo --i420 and dav2d --demuxer ivf decode the whole stream byte-for-byte identically (decoded-output md5 477a993d671e93d37b92a0d368c238ff, 24576 bytes); the fixture validates clean and is registered in the conformance corpus with the reciprocal LOCAL-REFERENCE-EVIDENCE entry lref-avm-dav2d-syn-2sb-inter-128x64-q80. THE FIRST MULTI-SUPERBLOCK INTER FRAME NOW DECODES BIT-EXACT (confirmed via splot's own instrumentation: SB0 @ MI(0,0) NEWMV col 48 = +6 full pels ref 0 has_neighbour=false; SB1 @ MI(0,16) in the SECOND superblock NEARMV NewMvContext 3 reconstructing col 48 from SB0 across the superblock boundary via the §7.12.2 stack, NOT the zero fallback): the only decoder change over DECODE-INTER-MVSTACK-SPATIAL is the §5.18.3 frame-size gate in validate_inter_frame_core, which now admits a single superblock row (height 64, width a multiple of 64) instead of exactly 64x64; the §5.20.2.1 SB raster loop, the frame-wide find_mv_stack grid, decode_inter_blocks, and the tile-payload boundary derivation were already geometry-agnostic — validated by §8.2.4 exit_symbol() (NO hardcoding). This row stays partial: a full 2-D superblock grid (both dimensions > 64) is REJECTED (inter_unsupported_frame_size) because a non-leftmost non-top superblock's §7.12.2 above-right and below-left scan positions reach a not-yet-decoded superblock; the skip == 0 residual is still gated to the top-left 64x64 block (so the admitted multi-SB frame is skip == 1); the existing >= 32x32-leaf, single-reference, no-tools, and spatial-only-find_mv_stack gates are unchanged, so all existing inter (zero-MV 4e1bd39f, sub-pel a0e82de3, residual ab2b067a, mvstack e5b581a5) and general-intra fixtures stay byte-identical. The single-superblock COLUMN (64x128) is analytically correct and was verified bit-exact locally, but it is REJECTED by the gate (inter_unsupported_frame_size) — not yet admitted — pending its own committed 3-oracle fixture (deferred follow-on); only the ROW is admitted and committed. In-loop filters and live AVM/dav2d invocation in CI remain unimplemented."

