notes = "Adds crate-private `splot-decode` tile coefficient state buffers in `tile_payload/coeff_state.rs`. `TransformCoeffBlockState` owns zero-initialized row-major §5.20.7.27 `Level[]` (`u32`), `QuantSign[]` (`i32`), and `Quant[]` (`i32`) arrays for caller-resolved adjusted transform extents capped at 32x32, with checked row/column accessors and fallible allocation. `TileCoeffContextState` owns three-plane `AboveLevelContext`, `LeftLevelContext`, `AboveDcContext`, and `LeftDcContext` lines sized by tile MI columns/rows, exposes checked slices that can feed the existing §8.3.2 coefficient-context functions, applies the §5.20.7.27 end-of-`coeffs()` above/left level/DC context writes, and applies one plane of the §5.20.4.1 `reset_block_context` level/DC reset with validated subsampling shifts and checked coordinate arithmetic. The state is now read by the minimal all-zero context handoff tracked by `coeff-all-zero-context-state`, but it is not yet wired into a real coefficient symbol loop, so decode output is unchanged. This row remains partial: it does not read EOB or coefficient symbols, fill nonzero `Quant[]`, implement `read_quant`, dequantize, run inverse transforms, add residuals, reconstruct pixels, widen hash/raw/Y4M output, refresh references, invoke AVM/dav2d, add public APIs, or claim broad `decode_tile()` or `decode_block()` support."

