Skips[] sum) and §7.11.2 find_mode_ctx NewMvContext, reads mode_info, builds the §7.12.2 find_mv_stack (§7.12.2.6 spatial scan-points -> §7.12.2.10 add-reference -> §7.12.2.12 search-stack dedupe -> §7.12.2.20 extra-search global-MV fallback -> §7.12.2.23 clamp), and resolves the §5.20.7.13 assign_mv MV (NEARMV = RefStackMv[RefMvIdx]; NEWMV = clamp(predictor + read_mv delta); GLOBALMV = zero), then records itself into the per-MI neighbour grid and is §7.13.3.18 motion-compensated at its own luma-space rectangle — validated by §8.2.4 exit_symbol() (NO hardcoding). The additional syn-3frame-derived-smvp-96x64-q100.ivf oracle proves §7.12.2.16 same-side order-hint projection is spatial state and remains active when use_ref_frame_mvs disables the temporal scan: at MI(12,13), the reference-0 DeltaWarp sub-MV (-12,9) projects to the reference-1 predictor (-24,16), yielding final MV (-16,24); the pinned AVM and dav2d raw MD5 is 7b5f9068d515351d82ae3363166d8052 (55296 bytes). The single-block inter (zero-MV 4e1bd39f, sub-pel a0e82de3, residual ab2b067a) and general-intra fixtures stay byte-identical. This row stays partial: the find_mv_stack kernel models only the spatial single-prediction subset the fixture proves; compound (§7.12.2.13-§7.12.2.18), warp candidates (§7.12.2.2-§7.12.2.4/§7.12.2.9/§7.12.2.11), the ref-MV bank (§7.12.2.21) and its derived-SMVP insertion (§7.12.2.22), the DRL reorder sort (§7.12.2.19), the §7.12.2.5 scan-col wider reach, and the large-block (> 32x32) extra MVP combinations are deferred with TODO(spec: DECODE-INTER-MVSTACK-SPATIAL) markers. The §7.9.3 trajectory projection and §7.12.2.7 temporal scan are implemented; the focused intersection-before-side-guard regression preserves a trajectory edge even when the linear side projection is ineligible. The remaining deferred candidates stay gated by the inter frame-header tool rejections + single-reference subset gates. A multi-block skip == 0 residual (per-block transform sizes) is also deferred (rejected before output). In-loop filters and live AVM/dav2d invocation in CI remain unimplemented."

