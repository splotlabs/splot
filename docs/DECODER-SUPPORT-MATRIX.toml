mv_greater, col_mv_index, interp_filter) thread through the Block/Tile CDF subsets from the generated §9.3 defaults. The zero-MV inter (4e1bd39f) and the general-intra fixtures stay byte-identical. This row stays partial: the VERIFIED-SUBSET DISCIPLINE rejects everything outside the single-reference NEWMV/zero-MV skip==1 EighthPel SWITCHABLE-or-fixed-filter subset (residual skip==0, compound, multi-reference, non-64x64, motion modes, OBMC, warp, flex-mvres, adaptive-mvd, bawp, cwp) with a structured decode/unsupported-feature diagnostic before any output; inter residual, in-loop filters, multi-block/non-64x64 inter, and live AVM/dav2d invocation in CI remain unimplemented."

