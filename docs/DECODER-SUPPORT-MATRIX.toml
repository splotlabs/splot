local_reference_evidence = ["docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-dav2d-syn-2frame-inter-mvstack-64x64"]
notes = "Widens the inter decode arc from a single 64x64 inter block to a MULTI-BLOCK inter frame where a later block's motion vector is PREDICTED from a decoded neighbour block via the §7.11/§7.12 spatial MV-context + MV-stack processes (find_mv_stack) — the inter analog of the intra partition-depth unlock. The committed syn-2frame-inter-mvstack-64x64.ivf (project-owned synthetic input: frame 0 four flat 32x32 luma quadrants + flat chroma, frame 1 shifted left 6 luma samples; broad decode tools incl. GDF/cdef/deblocking/restoration/ccso/cfl/mhccp/cctx/qm/ibp/angle-delta/ist/inter-ist/intra-dip/idtx-intra/smooth-intra/paeth-intra/bawp/cwp/tcq/trellis/all-warp/tip/opfl-refine/refinemv/masked-wedge-interintra-onesided-diffwtd-compound/joint-mvd/adaptive-mvd/flex-mvres/ref-frame-mvs/refmvbank/drl-reorder/mv-traj/high-motion/inter-ddt/skip-mode/bru/global-motion/tx-partition/ext-uneven-partitions disabled; --qp 80 --sb-size 64 --min-partition-size 32 --max-partition-size 32 --enable-rect-partitions=1) is a two-frame stream: frame 0 = OBU_CLOSED_LOOP_KEY (DC_PRED intra blocks), frame 1 = OBU_REGULAR_TILE_GROUP whose 64x64 superblock is §5.20.3 SPLIT into four 32x32 single-reference inter blocks. avmdec --rawvideo --i420 and dav2d --demuxer ivf decode the whole stream byte-for-byte identically (decoded-output md5 e5b581a55433785c0071b635d5642083, 12288 bytes); the fixture validates clean and is registered in the conformance corpus with the reciprocal LOCAL-REFERENCE-EVIDENCE entry lref-avm-dav2d-syn-2frame-inter-mvstack-64x64. THE FIRST MULTI-BLOCK NEIGHBOUR-PREDICTED-MV FRAME NOW DECODES BIT-EXACT (confirmed via the AVM inspection oracle: block 0 @ MI(0,0) NEWMV col 48 = +6 full pels ref 0; blocks 1-3 NEARMV reconstructing col 48 from the §7.12.2 stack, NOT the zero fallback): the §5.20.3 partition walk invokes a per-leaf inter closure; each block derives its §5.20.7.2 neighbour-buffer §8.3.2 contexts (is_inter ctx from NNumBuf + NIntra, skip_flag ctx from the neighbour Skips[] sum) and §7.11.2 find_mode_ctx NewMvContext, reads mode_info, builds the §7.12.2 find_mv_stack (§7.12.2.6 spatial scan-points -> §7.12.2.10 add-reference -> §7.12.2.12 search-stack dedupe -> §7.12.2.20 extra-search global-MV fallback -> §7.12.2.23 clamp), and resolves the §5.20.7.13 assign_mv MV (NEARMV = RefStackMv[RefMvIdx]; NEWMV = clamp(predictor + read_mv delta); GLOBALMV = zero), then records itself into the per-MI neighbour grid and is §7.13.3.18 motion-compensated at its own luma-space rectangle — validated by §8.2.4 exit_symbol() (NO hardcoding). The single-block inter (zero-MV 4e1bd39f, sub-pel a0e82de3, residual ab2b067a) and general-intra fixtures stay byte-identical. This row stays partial: the find_mv_stack kernel models only the spatial single-prediction subset the fixture proves; temporal candidates (§7.12.2.7/§7.12.2.8), compound (§7.12.2.13-§7.12.2.18), warp candidates (§7.12.2.2-§7.12.2.4/§7.12.2.9/§7.12.2.11), the ref-MV bank (§7.12.2.21) + derived-SMVP (§7.12.2.16/§7.12.2.22), the DRL reorder sort (§7.12.2.19), the §7.12.2.5 scan-col wider reach, and the large-block (> 32x32) extra MVP combinations are deferred with TODO(spec: DECODE-INTER-MVSTACK-SPATIAL) markers. The temporal scan (enable_ref_frame_mvs), the ref-MV bank (enable_refmvbank), and the DRL reorder (DrlReorder != Disabled) are provable no-ops for a no-neighbour block (so the single-block inter fixtures that enable them still decode), but a block with a decoded neighbour rejects them (inter_block_mv_stack_tools_with_neighbour) before output since exit_symbol() cannot catch a wrong MV value; the remaining deferred candidates stay gated by the inter frame-header tool rejections + single-reference subset gates. A multi-block skip == 0 residual (per-block transform sizes) is also deferred (rejected before output). In-loop filters and live AVM/dav2d invocation in CI remain unimplemented."

