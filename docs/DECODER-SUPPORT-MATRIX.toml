notes = "The generic AV2 §8.2 symbol-decoder primitive in `splot-core` is complete and spec-exact: `init_symbol(sz)` (§8.2.2) arithmetic setup over a bounded tile payload slice, `read_bool()` (§8.2.3), `read_literal(n)` (§8.2.5), caller-supplied-CDF `read_symbol(cdf)` (§8.2.6) arithmetic renormalization and CDF adaptation using generated §9.2 `Prob_Inc` and `Para_Adjustment_List` tables, and the `exit_symbol()` (§8.2.4) trailing-one-bit and zero-padding conformance check. CDF rows are validated (length, range, §8.2.6 non-decreasing cumulative values that MAY be equal, rate index, capped count) before any generated-table indexing or mutation, all operations return typed `splot-core` errors instead of panicking, and a lossless arithmetic-state checkpoint supports caller-owned syntax frontiers. Completeness is proven by spec-exact unit vectors for every arity N=2..8 (maximal `SymbolValue` selects symbol 0, zero `SymbolValue` selects symbol N-1), exact CDF-update results at the minimum and maximum §8.2.6 adaptation rates, a deep-negative-`SymbolMaxBits` implicit-zero-padding run, a random-valid-CDF property test, evidence that a §9.3 default row adapted to equal adjacent cumulative entries is accepted and decodes correctly on re-read (so repeated-CDF decoding is not self-invalidating), and the `symbol_decoder_bytes` no-panic fuzz target; the primitive is byte-stream reachable and exercised end-to-end by the supported `decode-minimal-tier-runtime-success` runtime. This row covers only the §8.2 primitive. §8.3 syntax-element CDF selection is tracked by `tile-cdf-selection-boundary`; the §8.2.4 CDF copy/averaging and the §8.2.2 named Tile/Saved CDF banks are tracked by `tile-cdf-save-lifecycle-boundary`; default §9.3 CDF banks, `decode_tile()`, tile syntax traversal, reconstruction, decoded-frame hashes, runtime Y4M output, reference refresh, AVM or dav2d invocation, and decoder orchestration remain tracked in their own rows."

