notes = "Implements the §5.20.2.3 per-block BlockDecoded flag state deferred by general-intra-deep-split (DC reads only the immediate left/above so needs no BlockDecoded; SMOOTH reads the §7.13.2.1 above-right AboveRow[w] and below-left LeftCol[h] sentinels, whose availability §7.13.2.1 derives from BlockDecoded). New crate-private TileBlockDecodedState (crates/splot-decode/src/bitstream/tile_payload/block_decoded_state.rs) holds a superblock-relative per-plane decoded-flag grid with clear_superblock faithful to §5.20.2.3 clear_block_decoded_flags (incl the line-8830 below-left corner-zero override), count_top_right_avail and count_bottom_left_avail (§5.20.7.25), and set_block (§5.20.4 BlockDecoded[plane][(subBlockMiRow>>subY)+i][(subBlockMiCol>>subX)+j] = 1). The §5.20.3.1 partition walk creates the grid, clears it per §5.20.2.1 superblock, passes it read-only to the leaf, and marks each decoded transform block's plane 4x4 units after the leaf. The leaf derives the luma §7.13.2.1 num4AboveRight from count_top_right_avail over the real grid (luma_num4_above_right_from_block_decoded) instead of the full-superblock-only full_sb_num4_above_right, so a SPLIT child's above-right sibling is counted, lifting the prior general_intra_multiblock_non_dc_subblock reject for a >= 32x32 (TX_SET_DCTONLY) SMOOTH_H luma SPLIT sub-block. The committed syn-shsplit-intra-64x64-q80.ivf (64x64 SPLIT into four 32x32: TL 50, TR 210, BR 130 all DC; BL 32x32 horizontal-ramp SMOOTH_H; distinct flat chroma) decodes bit-exactly to the avmdec AND dav2d oracle (raw md5 88ea298073104752646aab5f718fdc31; agree in LOCAL-REFERENCE-EVIDENCE.toml; pinned splot frame hash 296f15949d88b26b5797bffdb15c6c36dc46bf6976bad59f7995e2443e1b418a), guarded by §8.2.4 exit_symbol(). The bottom-left 32x32 (superblock-relative MI (8,0), x4=0 y4=8 w4=8) reads count_top_right_avail = 8 over the decoded top-right sibling, so its §7.13.2.1 AboveRow[w] sentinel is the real reconstructed top-right corner (210); the reconstructed right column is 211, NOT the ~51 the OLD edge-clamp would produce (empirically confirmed, proving the BlockDecoded path materially changes the output) -- also the first luma (sub_x=0) above-right VALUE oracle anchor. VERIFIED-SUBSET DISCIPLINE: only SMOOTH_H luma SPLIT sub-blocks at superblock-relative MI row > 0 (frontier.r % FULL_SB_N4_LUMA != 0, a WITHIN-superblock above-right sibling, the case the syn-shsplit fixture verifies) are admitted; a superblock-relative-row-0 SMOOTH_H split sub-block reads a cross-superblock above-right (the deferred row>0 luma above-right VALUE path, general_intra_smooth_h_above_right_unverified) and is rejected; SMOOTH_V luma sub-blocks (below-left sentinel) remain deferred. SMOOTH chroma sub-blocks already decoded on main through the same BlockDecoded sentinel path; the earlier negative note for syn-svsplit-intra-64x64-q140.ivf was stale, and the committed fixture decodes bit-exactly with pinned AVM, current AVM, dav2d, and splot (splot raw SHA-256 c2b46d534744db9fc146b460f438a6ae450c711e43e537f80a13886297ddbaa5). Large-chroma correction: BlockCtx now applies the §7.13.2.1 plane-size override after deriving raw availability: U/V transform width greater than 32 zeros num4AboveRight and height greater than 32 zeros num4BelowLeft independently, while a separate uncapped-above-right query preserves the pre-existing 10-bit D45/D67 admission boundary. The committed 105-byte syn-chroma-corner-cap-256x256-q140.ivf has a 64x64 all-zero-residual U/V SMOOTH block with deliberately distinct in-block and decoded above-right sentinels; pre-fix splot differed across 16,192 chroma samples, while fixed splot, pinned AVM, and dav2d agree at raw SHA-256 9d1331b7f113bcd0de59adfd04681009dd8a8c03b18d7ddbd651058fb406435c. Focused tests pin both axis caps, repeated-edge prediction, the fixture hash, and no right-edge directional-admission broadening. All existing general-intra fixtures still decode bit-exact. This row stays partial: SMOOTH_V below-left sub-block sentinels, directional (D135) sub-blocks, non-DCTONLY-size (<32x32) non-DC sub-blocks, multiple tiles, inter prediction, in-loop filters, and live AVM or dav2d invocation in CI all remain unimplemented."

