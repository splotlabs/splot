decode_module = "crates/splot-decode/src/runtime_minimal_recon.rs"
tier = "tier1-intra"
status = "partial"
self_contained_tests = ["crates/splot-decode/src/runtime_minimal.rs::general_intra_tests::dfchroma_directional_follow_chroma_intra_frame_decodes_to_oracle", "crates/splot-decode/src/tile_payload/cdf/block_context.rs::tests::supported_chroma_mode_directional_follow_resolves_d135_for_uv_mode_zero", "crates/splot-decode/src/tile_payload/cdf/block_context.rs::tests::supported_chroma_mode_non_follow_d135_is_deferred", "cargo test -p splot-decode general_intra --locked", "cargo test -p splot-decode block_context --locked", "cargo test -p splot-cli --test conformance --locked", "cargo xtask check-decoder-support", "cargo xtask check-feature-status"]
