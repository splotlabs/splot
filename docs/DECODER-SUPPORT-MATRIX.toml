diagnostics = ["decode/unsupported-feature"]
local_reference_evidence = ["docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-dav2d-syn-mbvg-intra-128x64-q80"]
notes = "Eleventh brick of the AVM-oracle general intra decode path and the first MULTI-BLOCK non-DC luma prediction that reads the REAL reconstructed neighbour edge (prior non-DC/directional luma was gated to the no-neighbour top-left block over §7.13.2.1 flat fallbacks). The brief expected a cardinal V_PRED/H_PRED right superblock; the committed syn-mbvg-128x64-q80.ivf instead codes BOTH 64x64 superblocks as §7.13.2.13 SMOOTH_V_PRED (confirmed by temporary mode instrumentation, since removed: y_mode == SMOOTH_V_PRED == 10 for both, via the §5.20.5.3 y_mode_offset escape). SMOOTH_V is neither a cardinal copy nor an §7.13.2.8 angle mode — it is §7.13.2.13 linear interpolation, so it reads the real neighbour edge with NO IDIF/edge-filter synthesis and is bit-exact over a non-flat edge (unlike a directional angle, where enableIdif == 0 bilinear equals the spec IDIF 4-tap only for a flat edge). The left (top-left, no-neighbour) superblock uses the existing reconstruct_general_intra_luma_nondc_first_block_into (flat fallback edges); the right superblock (!is_top_left) uses the new reconstruct_general_intra_luma_nondc_neighbour_block_into, which builds the §7.13.2.1 edges from the partially-built frame via the shared luma/chroma-general build_smooth_edges (haveLeft == 1, haveAbove == 0 -> LeftCol[i] = real reconstructed left column with the bottom-left sentinel LeftCol[h] clamped to the last in-block sample, AboveRow[i] = repeated CurrFrame[0][y][x-1]) and runs the shared splot-recon predict_intra_smooth_rect_into SMOOTH_V then adds the §5.20.7.27 residual. The production `TileIntraJointModeState::y_mode_index_ctx` derives the §8.3.2 context from the current per-MI left and above joint modes: non-directional or out-of-frame neighbours contribute zero, while directional neighbours raise the context to one or two. `decode_general_intra_luma_block_mode_with_fsc_context` uses that context for the live `YModeIndex` and `YModeOffset` CDF selectors and passes the same neighbour joint modes to the current reorder reconstruction. The mbvg left neighbour is SMOOTH_V (modeDelta 2), so its context remains zero; the dedicated directional-neighbour row covers nonzero-context decoding. The committed syn-mbvg-intra-128x64-q80.ivf (vertical gradient top 30 -> bottom 210, flat chroma U=120 V=130) decodes bit-exactly to the avmdec AND dav2d oracle (raw output md5 3e57ba0c8cbdbe1d3400b0ae365c5d8e; raw outputs agree, recorded in LOCAL-REFERENCE-EVIDENCE.toml; pinned splot frame hash 269b4969800751c63f7f0605f1f7b8f178f7bf85590ec62fe64313ff394d6dfd asserted by the mbvg oracle test), guarded by the §8.2.4 exit_symbol() check; all existing general-intra fixtures still decode bit-exact. This row stays partial: it is gated to a full 64x64 superblock (n4w == 16). Sub-superblock non-DC blocks (per-block §5.20.2.3 BlockDecoded update for split above-right/below-left neighbours), neighbour-having §7.13.2.8 directional luma over a real non-flat edge (real IDIF 4-tap interpolation), SMOOTH/PAETH luma, multiple tiles, inter prediction, in-loop filters, and live AVM or dav2d invocation in CI remain unimplemented. When this brick landed the neighbour SMOOTH path was gated to the first superblock row (frontier.r == 0, haveAbove == 0); that gate was subsequently lifted by DECODE-GENERAL-INTRA-GRID-NEIGHBOUR-NONDC (row>0 SMOOTH_V over the real reconstructed above row), so the general_intra_multirow_neighbour_non_dc diagnostic is no longer emitted."

