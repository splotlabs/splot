notes = "Adds the AV2 §5.20.7.12 `read_single_ref` entropy element (crates/splot-decode/src/prediction/inter/single_ref.rs). `read_single_ref` loops `ref` from 0 to NumTotalRefs - 2, reads one binary `single_ref` symbol per `ref` over `TileSingleRefCdf[ctx][ref]` (the §8.3.2 row; `ctx` computed as for `comp_ref` per docs/spec/av2/1.0.0/08-parsing-process.md#s-8-3-2 line 1094), returns `ref` on the first `1` and NumTotalRefs - 1 when all are `0` — matching the §5.20.7.12 mirror and AVM `read_single_ref` (av2/decoder/decodemv.c) + `av2_get_pred_cdf_single_ref` (av2/common/pred_common.h), which index `single_ref_cdf[ctx][ref]` identically. New `TileSingleRefCdf` rows from `DEFAULT_SINGLE_REF_CDF` ([REF_CONTEXTS=3][REFS_PER_FRAME - 1=6][3]) thread through the Block/Tile CDF subsets (selector, row/row_mut, §8.2.4 averaging, frame-end count scaling), mirroring `TileDrlModeCdf`. PROVEN bit-exact by a `SymbolEncoder` <-> `read_single_ref` round-trip over every selectable RefFrame[0] (0..=NumTotalRefs - 1) across NumTotalRefs 2..=7 with DISTINCT per-decision contexts; §8.2.4 exit_symbol() bit-count consistency is asserted, and the context-indexing falsifiability witness confirms the [ctx][ref] indexing is load-bearing. The reader uses typed errors only and is panic-free. NOW WIRED by DECODE-INTER-MULTIREF-RUNTIME: `read_single_ref` is called from the runtime block decode (between read_skip and single_mode) when §7.7 yields NumTotalRefs == 2, with the §8.3.2 neighbour `single_ref` context supplied by `BlockNeighbourContext::single_ref_ctx` (the comp_ref count_refs process, cross-checked vs AVM `av2_get_ref_pred_context`); the committed syn-3frame-multiref-64x64.ivf proves the runtime read bit-exact. STILL out of scope: NumTotalRefs > 2 (multi-decision single_ref), a neighbour-having single_ref context, and `read_compound_ref` (§5.20.7.11, the compound sibling). No live AVM/dav2d invocation in CI."

