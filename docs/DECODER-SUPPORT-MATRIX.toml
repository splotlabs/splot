self_contained_tests = ["crates/splot-decode/src/pipeline/mod.rs::general_intra_tests::d157_neighbour_directional_idif_intra_frame_decodes_to_oracle", "crates/splot-recon/src/intra_directional_angle.rs::tests::d157_idif_middle_prediction_applies_the_4_tap_filter_and_differs_from_bilinear", "crates/splot-recon/src/intra_directional_angle.rs::tests::d135_idif_middle_prediction_is_a_sample_copy_identical_to_bilinear", "cargo test -p splot-decode general_intra --locked", "cargo test -p splot-recon intra_directional_angle --locked", "cargo xtask check-decoder-support", "cargo xtask check-feature-status"]
