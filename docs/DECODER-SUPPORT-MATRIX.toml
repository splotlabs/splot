notes = "Extends the non-DC luma decode from SMOOTH_V/H to the plain §7.13.2.13 SMOOTH_PRED mode (canonical §9.2 mode 9, §5.20.5.5 modeIdx 1 in REORDERED_Y_MODE_NON_DIRECTIONAL = [DC, SMOOTH, SMOOTH_V, SMOOTH_H, PAETH]), decoded as a non-escape y_mode_index == 1 (reconstruct_minimal_y_mode already maps it; the gap was the reconstruction admission). Unlike SMOOTH_V (predV2 only) and SMOOTH_H (predH2 only), plain SMOOTH outputs Round2(predV2 + predH2, 1), blending BOTH the vertical predictor (above row + bottom-left sentinel LeftCol[h]) and the horizontal predictor (left column + top-right sentinel AboveRow[w]). block_context.rs maps SMOOTH_PRED -> SupportedNonDcLumaMode::Smooth; runtime_minimal_recon.rs maps that to splot-recon IntraSmoothMode::Smooth and reuses reconstruct_general_intra_luma_nondc_first_block_into -> predict_intra_smooth_rect_into over the §7.13.2.1 no-neighbour fallback edges (8-bit AboveRow 127, LeftCol 129, the sentinels sharing those fallbacks), then adds the §5.20.7.27 AC residual. The committed syn-smooth-intra-64x64-q124.ivf (a 2-D smooth surface -> one 64x64 plain SMOOTH luma block, DC chroma) decodes bit-exactly to the avmdec AND dav2d oracle (raw md5 82d0f23be478479c9835e9a76e4a879c; agree in LOCAL-REFERENCE-EVIDENCE.toml; pinned splot frame hash 9b054c6fff47397fbe88a9eb45a34fac018efc7748fc697edebddd3f14bd88d3), guarded by §8.2.4 exit_symbol(); the reconstructed luma rises along both the top row and the left column (neither constant, distinct from SMOOTH_V/H). VERIFIED-SUBSET DISCIPLINE: only the top-left (no-neighbour) 64x64 superblock (n4w == 16, TX_64X64 -> §5.20.8.2 TX_SET_DCTONLY -> forced DCT_DCT) plain-SMOOTH luma with DC chroma is admitted; the committed negative syn-smoothnondc-intra-64x64-q132.ivf (plain SMOOTH luma + non-DC H_PRED chroma; validates clean, avmdec/dav2d agree md5 70494255beb63103c97422e327243319) still REJECTS with general_intra_non_dc_chroma_mode, and all existing general-intra fixtures still decode bit-exact. This row stays partial: neighbour-having plain-SMOOTH blocks (reading the real §7.13.2.1 above-right AboveRow[w] and below-left LeftCol[h] sentinels over §5.20.2.3 BlockDecoded), sub-64x64 plain-SMOOTH blocks (mode-dependent non-DCT TxType), plain-SMOOTH chroma, PAETH, non-64x64 frames, inter prediction, in-loop filters, and live AVM or dav2d invocation in CI remain unimplemented."

