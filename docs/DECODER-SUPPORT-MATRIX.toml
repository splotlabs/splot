notes = "Narrow compound-reference runtime support for the fixture-proven two-reference equal-weight COMPOUND_AVERAGE subset: NumTotalRefs == 2, reference_select chooses compound, refs [0, 1], non-joint NEAR_NEARMV, no neighbour-dependent compound MV stack, zero MVs, skipped residual, identity-scaled refs, and CWP/masks/implicit masked blend/opfl/refinemv/TIP/warp/temporal-MV disabled. The committed syn-3frame-compound-average-64x64.ivf fixture is a three-frame 64x64 stream whose frame 2 is a single NEAR_NEARMV compound block over refs [0, 1], compound_type 0, skip=1, and zero MVs; the pre-change decoder rejected it at inter_reference_select. `splot decode --output-format raw` now reproduces the avmdec/dav2d raw output exactly (SHA-256 2b4f716243d9f5c30a244ecc6f7fdcb5bef804d2ba353a21d670d686cfe63ff4, MD5 34074c6945348b146f84551a20d9affd), and the runtime/CLI tests assert the decoded compound frame is the rounded per-sample average of decoded refs 0 and 1. Optical-flow compound blocks apply the §7.13.3.8 per-subblock §7.13.3.4 reference area to every 8x8 luma unit and every chroma unit, and store their reconstructed per-8x8 refined MVs in the §7.22 temporal field; when optical flow uses 4x4 units, the four deltas are reduced with the specified signed average before storage. A non-skip optical-flow NEAR_NEARMV block reads one shared §5.20.7.8 DRL index and resolves both MVs from that paired compound-stack entry; the deltaq1 oracle block at MI(28,64) now matches AVM's (-4,-149) and (4,187) base MVs. Same-reference compound mode decoding now implements the complete §5.20.7.6 four-symbol mapping: 0 NEAR_NEARMV, 1 NEAR_NEWMV, 2 GLOBAL_GLOBALMV, and 3 NEW_NEWMV. §6.4.6 permits both lists to select the same reference; for GLOBAL_GLOBALMV with frame global motion disabled, the existing §7.13.3 path supplies identity/zero MVs and reads no DRL, AMVD, optical-flow, refine-MV, local-warp, or interpolation-filter syntax. The 105-byte syn-2frame-same-ref-global-global-64x64-q80.ivf fixture exercises symbol 2 and matches isolated/current avmdec byte-for-byte (raw SHA-256 21e1e10d0b1bf3932eac3842e87af17450ad2deb0b765e8179177a2a08881231). The row remains partial by design: non-identity frame global motion, broader compound, masked, CWP, switchable refine-MV signalling, residual compound, and full AV2 decoder conformance remain unsupported or partial and must reject before output with decode/unsupported-feature."

