local_reference_evidence = ["docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-dav2d-syn-2sb-intra-128x64-q80"]
notes = "Seventh brick of the AVM-oracle general intra decode path: a single ROW of superblocks (width any positive multiple of 64, height exactly 64, e.g. 128x64). The IVF size gate (require_minimal_ivf) admits any positive-sized AV02 frame to routing, is_general_minimal_intra accepts width a multiple of 64 with height 64, and the frozen base_q_idx == 255 hash tier still re-imposes its strict 64x64 requirement in validate_frame_core. Height is restricted to 64 (one superblock row) because the §7.13.2.13 SMOOTH chroma path builds its §7.13.2.1 bottom-left sentinel by edge-clamping (repeating the last neighbour sample), which matches the spec value only when the chroma block is at the bottom frame edge with no above neighbour (always true at height 64). new_general_intra_workspace is parameterized by the real frame size (chroma = half for 4:2:0), and decode_general_intra_partition_tree iterates every superblock in the tile's MI range in raster order per AV2 §5.20.2.1 decode_tile() (sbSize4 = Num_4x4_Blocks_Wide[SbSize] steps; clear_left_context() at each superblock-row start), reusing one SymbolDecoder, tile CDFs, TileMiSizeState, and frame-spanning TileCoeffContextState + workspace so later superblocks DC-predict from already-reconstructed neighbours. Chroma reconstruction adds the §7.13.2.13 SMOOTH_PRED case (resolved from uv_mode via §5.20.5.3 get_intra_uv_mode_set for the non-directional luma subset) over §7.13.2.1 neighbour edges read from the partially-built frame. The committed syn-2sb-intra-128x64-q80.ivf (left flat luma 80, right flat luma 180; chroma flat U=120 V=130) decodes bit-exactly to the avmdec and dav2d oracle (raw output md5 88cf94a2d7b2a20c3212d96acdd456ef; raw outputs agree, recorded in LOCAL-REFERENCE-EVIDENCE.toml; the pinned splot frame hash is asserted by the two_superblock oracle test), guarded by the §8.2.4 exit_symbol() check; existing 64x64 fixtures still decode bit-exact. This row stays partial: multi-superblock-row (grid) frames are extended by general-intra-multirow (DECODE-GENERAL-INTRA-MULTIROW); partial frames (non-multiple-of-64 widths needing edge clamping), non-DC/non-SMOOTH chroma, multiple tiles, inter prediction, in-loop filters, and live AVM or dav2d invocation in CI remain unimplemented."

