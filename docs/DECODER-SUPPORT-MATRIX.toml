diagnostics = ["decode/unsupported-feature"]
local_reference_evidence = ["docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-dav2d-syn-2sb-deblock-intra-128x64-q100", "docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-dav2d-syn-2sb-deblock-intra-128x64-q98", "docs/LOCAL-REFERENCE-EVIDENCE.toml::lref-avm-dav2d-syn-2sb-deblockwide-intra-128x64-q100"]
notes = "First in-loop-filter brick: §7.17.1/§7.17.2 deblocking-filter edge-traversal orchestration over the splot-recon per-edge primitives (deblock_filter_choice, deblock_sample_filter, deblock_filter_max_width, deblock_adaptive_filter_strength, deblock_side_threshold_index), in a new crates/splot-decode/src/filters/deblock.rs module. The general intra route gate is relaxed to admit deblock-ACTIVE frames (previously it rejected any apply_deblocking_filter != [false;4]); the other in-loop filters (GDF/CDEF/CCSO/loop-restoration) stay rejected. The orchestration derives the per-(plane,pass) §7.17.6 filter LEVEL (lvl = q_clamped(base_q_idx, 0) for every plane, since segmentation is disabled, df_delta_q is all zero, and the chroma base offsets resolve to zero — all enforced by the route gate), the §7.17.5 (qThr, side) strengths over the §9.2 Side_Thresholds table, then iterates the §7.17.1 plane×pass×MI loop (gated on apply_deblocking_filter[plane==0 ? pass : plane+1], with 4:2:0 chroma rowStep/colStep), running per edge the §7.17.2 derivation (sbEdge/onScreen/isBlockEdge/isTxEdge/applyFilter with isSubPuEdge==0 for the intra key frame and skip==0 for the residual-coded blocks), the §7.17.4 filterSize (screen-edge clipped), the §7.17.3 maxWidthNeg/Pos, the §7.17.7.2 filter choice over the gathered perpendicular s/t lines, and the §7.17.7.1 sample filter for each MI_SIZE edge position, writing back in place via the new checked CurrentFrameWorkspace::set_reconstructed_sample. Applied after the block walk and BEFORE workspace.freeze(); a deblock-OFF frame runs the pass as a NO-OP, so every existing general-intra fixture (8-bit and 10-bit) stays byte-identical (verified). The committed syn-2sb-deblock-intra-128x64-q100.ivf (two 64x64 superblocks PARTITION_SPLIT into four 32x32 DC_PRED luma + DC chroma blocks; apply==[false,true,true,true], df_delta_q==[0,0,0,0], base_q_idx 100) decodes bit-exactly to the avmdec AND dav2d oracle (raw I420 md5 ca302adc8641007251c5947b3d5c73ba); the deblock effect is the luma horizontal pass at the y=32 boundary (2 luma samples ±1 at xP=4, the chroma passes leave the flat U=120/V=135 unchanged). Two additional larger-effect fixtures (24 and 38 luma samples change): syn-2sb-deblock-intra-128x64-q98.ivf (raw md5 5cb616189cf501809d6986a9ef1058a7) and syn-2sb-deblockwide-intra-128x64-q100.ivf (raw md5 82d8be50486d46fdd771e73a214bf5c2), both bit-exact vs avmdec AND dav2d. VERIFIED SUBSET: 8-bit 4:2:0 only (a deblock-ACTIVE 10-bit frame is rejected — the math is bit-depth-generic but no 10-bit deblock fixture pins it; deblock-OFF 10-bit is unaffected), df_delta_q all zero (nonzero rejected), single tile, segmentation disabled. Coverage limit: only the luma-HORIZONTAL deblock effect is exercisable in the admitted DC-multi-block subset (the encoder leaves the DC subset whenever the content would make the luma-vertical or a chroma pass change samples), so those passes run faithfully but lack a sample-changing oracle fixture. This row stays partial: nonzero df_delta_q, 10-bit deblock, sub-PU edges, segmentation/lossless, multiple tiles, the other in-loop filters, inter frames, and live AVM or dav2d invocation in CI remain unimplemented."

