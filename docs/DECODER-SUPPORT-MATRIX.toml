notes = "AVM-oracle general intra decode path. Every intra key frame routes UNCONDITIONALLY into the unified `decode_frame` engine (the `route_general_minimal_intra` and `is_general_minimal_intra` admission allowlist and the strict minimal-tier `validate_frame_core` fallback were retired 2026-07-05; there is no size, base_q, or tool gate on admission). The engine runs the real AV2 §5.20.3.1 root partition traversal, §5.20.5.3 block mode info (DECODE-GENERAL-INTRA-BLOCK-MODES), §5.20.7.27 luma and chroma transform-block coefficients (DECODE-GENERAL-INTRA-LUMA-COEFFS), and dequant, inverse-transform, residual-add, and frame assembly (DECODE-GENERAL-INTRA-FRAME-RECON) over the whole frame. The committed fixture syn-flat-intra-64x64-q80.ivf carries a real nonzero DC residual and decodes bit-exactly to the avmdec and dav2d oracle (flat Y=100, U=120, V=130). The fail-closed invariant is held by op-local `general_intra_at!` and `gap!` markers: an unsupported op emits a typed `decode-unsupported-feature` reject at the op that consumes it rather than decoding silently-wrong pixels. This row stays partial: many intra tools (CfL, MHCCP, MRL, broad SDP outside the oracle-pinned lossless DPCM-UV, DC-luma V_PRED/H_PRED/D45_PRED/D67_PRED/D113_PRED/D135_PRED/D157_PRED/D203_PRED/SMOOTH_PRED/PAETH_PRED top-left chroma-part subset, top-left D45_PRED/D45-follow, D67_PRED/D67-follow, D113_PRED/D113-follow, D135_PRED/D135-follow, D157_PRED/D157-follow, and D203_PRED/D203-follow chroma-part subsets, and first-row left-edge V/VFollow/H/HFollow/D45/D45Follow/D67/D67Follow/D135/D135Follow/D113/D157/D203/PAETH chroma-part subset, FSC, IST, non-DCT chroma), inter prediction, in-loop filters, and live AVM or dav2d invocation in CI remain unimplemented and fail closed."

