diagnostics = ["decode/resource-limit"]
local_reference_evidence = []
notes = "Budget/enforcement contract for `DecodeOptions { limits: DecodeLimits }`: covers input bytes, OBU count, coded/output frame counts, coded frame dimensions, coded luma samples, decoded frame bytes, reference slots, reference-store bytes, tile count, tile partition traversal steps, tile payload bytes, loop-restoration source-read operations. Runtime policy types are tracked by `decode-limits-runtime-api`; the byte-stream planner applies traversal limits (`max_input_bytes`, `max_obus`, `max_ivf_frame_records`, and selected `max_frames_to_decode`). Default OBU and frame-count thresholds are finite but sized for the current local decoder mission target's inspected 12964 OBU stream so decode reaches the next honest runtime gate instead of the old 128-frame planner cap; explicit lower limits still produce `decode/resource-limit`. The hash runtime applies frame dimension, luma-sample, decoded-frame-byte, output-frame, reference-store, tile-count, tile-payload-byte, and allocation handoff limits; it emits hashes in display order and reclaims decoded pixels after reference and pending-output ownership ends. Raw and Y4M adapters stream each displayed frame to the caller and impose no cumulative output-byte limit. The partition traversal frontier applies `max_tile_partition_steps` separately from tile count. The active LR source-read frontier applies `max_loop_restoration_source_reads` separately from coded luma sample limits. The CLI streams raw and Y4M bytes into a same-directory temporary file, cleans partial output on failure, and atomically publishes only after decode, flush, and sync succeed."

