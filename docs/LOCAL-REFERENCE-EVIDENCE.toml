summary = "IVF is a non-normative derived container, not AV2 syntax: Annex B.1 permits derived container formats, while Annex B.2/B.3 define the enclosed length-delimited OBU bitstream and system-dependent end detection. A structured derivative of the smallest project-owned AVMenc fixture proves that IVF width, height, and declared frame count are advisory and that a complete zero-size record is a charged no-op. Pinned and current avmdec ignore those transport fields and the empty record; fixed splot does the same while still charging both actual records to max_ivf_frame_records and retaining typed malformed-source failures for truncated records. All three decoders produce the original frame byte-for-byte."
