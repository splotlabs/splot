summary = "Local AVM and dav2d raw decoder output MD5 digests agreed for the 8-bit 128x64 single-superblock-row (two superblock columns by one row) intra IVF fixture at base_q_idx 80 whose LEFT 64x64 superblock is DC_PRED carrying a vertical-gradient residual (so its right column reconstructs NON-FLAT, 32 distinct values 31..210) and whose RIGHT 64x64 superblock (frontier.r == 0, frontier.c == 16, haveAbove == 0 && haveLeft == 1) codes the §7.13.2.8 ZONE-3 one-sided D203_PRED directional luma mode (canonical §9.2 mode 7, pAngle 203, §8.3.2 ctx == 0, AngleDeltaY 0) plus its uv_mode == 0 directional-follow D203 chroma. This OPENS the §7.13.2.8 zone-3 one-sided angle zone (pAngle > 180, needBottom), the symmetric MIRROR of the D45 zone-1 brick. The decisive element: D203's dy = Dr_Intra_Derivative[270 - 203] = Dr_Intra_Derivative[67] = 24 (§9.2) projects DOWN-AND-LEFT into the below-left (idx = (j + 1) * dy, base = (idx >> 6) + i, up to maxBaseY = w + h - 1 = 127), so unlike the §7.13.2.8 MIDDLE angles (which read LeftCol[0..h)) the projection reads w REAL reconstructed left-column samples — the already-decoded left superblock's right column (a vertical gradient) — via §7.13.2.1 LeftCol[i] = CurrFrame[0][Min(leftLimit, i)][63] with leftLimit = Min(maxY = 63, 0 + 64 + 4*num4BelowLeft - 1) and num4BelowLeft = 0 (§5.20.7.25 count_bottom_left_avail over §5.20.2.3 BlockDecoded, no decoded below-left superblock in raster order), so the below-left clamps to LeftCol[63]; at haveAbove == 0 the corner LeftCol[-1] = CurrFrame[0][0][63]. Unlike D45 (every shift 0, the IDIF reduces to a copy), D203's dy = 24 lands most projections on a nonzero shift, so the §7.13.2.8 Dr_Interp_Filter[32][4] luma IDIF 4-tap genuinely interpolates over the real reconstructed left column. The zone-3 luma IDIF direction (predict_intra_directional_angle_rect_one_sided_idif_into generalised to both one-sided branches, IntraDirectionalAngleIdifEdges::left) is the new piece; it reuses the existing Dr_Interp_Filter table unchanged. The OLD code rejected this frame (general_intra_d203_unverified_position because D203's supported_directional() returned None). The top-left no-neighbour, first-column, row>0, sub-partitioned, non-64x64 D203 positions, the remaining one-sided angle D67, non-zero angle deltas, a non-zero num4BelowLeft real below-left, and the directional-neighbour (ctx != 0) escape reorder remain out of scope and rejected."
