summary = "Local AVM and dav2d raw decoder output MD5 digests agreed for the three-frame 8-bit 4:2:0 MULTI-REFERENCE inter IVF fixture (64x64): frame 0 a flat DC_PRED intra key (luma 100), frame 1 a single-reference (§7.7 NumTotalRefs == 1, ref_frame_idx [0] == the key) 64x64 inter block reconstructing luma 160 and refreshing reference slot 1 (so §7.23 retains frame 1 as a SECOND valid reference), and frame 2 a 64x64 inter block over TWO valid references (§7.7 ranks ref_frame_idx [0, 1] == [key slot 0, frame-1 slot 1], NumTotalRefs == 2). Frame 2 reads the §5.20.7.12 single_ref symbol (over the §8.3.2 no-neighbour comp_ref/count_refs context 1) -> RefFrame[0] == 1 -> ref_frame_idx[1] == slot 1, motion-compensating the RETAINED frame 1 (luma 160), NOT the key (luma 100). The ASYMMETRY (frame 2 reconstructs to 160, distinct from the key's 100) makes a wrong slot-0 read FALSIFIABLE: splot instrumentation confirmed frame 2's block decodes ref_frame0 == 1 from a real single_ref read, and the reconstructed luma is 160 (frame 1) not 100 (key). splot reproduces the whole raw output byte-for-byte. This is the FIRST splot decode to (a) retain a second decoded (inter) frame in the §7.23 reference buffer, (b) run the §7.7 implicit reference-map ranking over two valid slots (the FrameReferenceStateView now models RefBaseQIdx, the only §7.7 scoring input the single-spatial-layer minimal frame leaves non-deterministic, lifting the at-most-one-valid-slot UnmodeledDerivation gate), and (c) wire the §5.20.7.12 read_single_ref entropy element to a runtime block decode. The fixture is encoded with --cdf-update-mode=0 so every frame has disable_cdf_update == 1: no CDF adaptation propagates, and the decoder (which does not model §7.23 cross-frame CDF save-load) decodes every frame from the default §8.3.2 entropy state. A frame that would inherit an adapted inter frame's CDFs is rejected with decode/unsupported-feature inter_cdf_inheritance_unmodeled; NumTotalRefs > 2, compound, and a 4th frame are likewise rejected before any output."
