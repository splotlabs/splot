# role = "input-bitstream"
# path = "tests/conformance/vectors/valid/syn-key-intra-64x64.ivf"
# sha256 = "<64 lowercase hex>"
# size_bytes = 1234
# format = "ivf"
# provenance_kind = "avm-generated-from-project-owned-synthetic-input"
# provenance_summary = "Generated locally from project-owned synthetic YUV input; AVM is not vendored."
# license = "PolyForm-Noncommercial-1.0.0"
#
# [[evidence.reference_run]]
# id = "avm"
# tool = "avm"
# executable_name = "avmdec"
# tool_role = "decode-reference"
# source_url = "https://github.com/AOMediaCodec/avm"
# revision = "<tag-or-commit>"
# version_summary = "sanitized version output with no local paths"
# command_summary = "avmdec {fixture:input} as raw decoder output"
# output_digest_id = "avm-raw-md5"
# output_digest_algorithm = "md5"
# output_digest = "<32 lowercase hex>"
# output_scope = "reference raw decoder output, not splot-dfh-sha256-v1"
#
# [[evidence.reference_run]]
# id = "dav2d"
# tool = "dav2d"
# executable_name = "dav2d"
# tool_role = "decode-reference"
# source_url = "https://code.videolan.org/videolan/dav2d"
