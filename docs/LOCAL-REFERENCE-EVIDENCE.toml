command = '''head -c 32 tests/conformance/vectors/valid/syn-flat-intra-64x64-minimal.ivf > /tmp/syn-ivf-advisory-empty-record-64x64.ivf; rewrite IVF bytes 12..16 to four zero bytes and bytes 24..28 to little-endian 9; append one 12-byte zero frame record; append bytes 32..EOF from the AVMenc source fixture. Decode with pinned and current avmdec --codec=av2 --rawvideo --output-bit-depth=8 and with splot decode --output-format raw.'''

