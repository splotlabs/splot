#
# Shared command vocabulary for humans and agents.

# Packed relative relocations (`DT_RELR`) shrink the load-time relocations of
# every binary. The loader must be glibc 2.36 or newer; the link records that
# as a version need, so an older loader refuses the binary with a clear error.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))']
rustflags = ["-C", "link-arg=-Wl,-z,pack-relative-relocs"]

[alias]
# Release decoder binary, output in target/release/splot.
fast = "build --release -p splot-cli --locked"
xtask = "run --package xtask --"
ci = "run --package xtask -- ci"
ci-fast = "run --package xtask -- ci --fast"
cov = "run --package xtask -- coverage"
fmt-check = "fmt --all -- --check"
lint = "clippy --workspace --all-targets --all-features --locked -- -D warnings"

# Debug test binaries decode on their own threads, whose default stack is too
# small for the partition walk; release builds and the CLI's worker-sized
# thread do not need this.
[env]
RUST_MIN_STACK = "16777216"
