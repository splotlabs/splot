#
# Shared command vocabulary for humans and agents.

# CPU baseline for decode throughput. The hot loop-filter/prediction kernels
# auto-vectorize; raising the x86-64 floor to the `x86-64-v3` microarchitecture
# level (AVX2 + FMA + BMI2, Intel Haswell 2013+ / AMD Excavator 2015+) doubles
# the SIMD width from 128-bit SSE2 to 256-bit AVX2, measured ~18-20% faster
# whole-stream decode with byte-identical output. aarch64 is intentionally left
# at its default: 128-bit NEON is the mandatory aarch64 baseline, so Apple
# Silicon and ARM servers already vectorize without a floor bump.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v3"]

[alias]
xtask = "run --package xtask --"
ci = "run --package xtask -- ci"
cov = "run --package xtask -- coverage"
fmt-check = "fmt --all -- --check"
lint = "clippy --workspace --all-targets --all-features --locked -- -D warnings"
