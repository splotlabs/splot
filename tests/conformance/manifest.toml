# These two are VALID AVM streams that AVM produces for EXTERNAL-HLS provision:
# AVM's --enable-lcr emits a local LCR referencing an absent global LCR, and
# --enable-qm emits using_qmatrix referencing a QM level with no QM OBU in-band.
# Validated standalone (external HLS disabled), the validator CORRECTLY flags the
# missing resource (§7.3.8.3 / §7.3.8.9) — a real differential check that splot's
# availability diagnostics fire on reference-encoder output.

[[vector]]
path = "vectors/needs-external-hls/syn-lcr-64x64.ivf"
description = """
AVM --enable-lcr stream: a local layer configuration record references a global \
LCR id that is not present in-band. Standalone (external HLS disabled), the \
validator emits the §7.3.8.3 global-LCR-unavailable diagnostic."""
expect = { diagnostics = ["lcr/global-lcr-unavailable"] }

[[vector]]
path = "vectors/needs-external-hls/syn-qm-64x64.ivf"
description = """
AVM --enable-qm stream: a frame has using_qmatrix == 1 referencing a quantizer \
matrix level with no quantizer matrix OBU in-band. Standalone (external HLS \
disabled), the validator emits the §7.3.8.9 qm-level-unavailable diagnostic."""
expect = { diagnostics = ["frame-header/qm-level-unavailable"] }
