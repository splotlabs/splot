[[vector]]
path = "vectors/valid/syn-dirneigh-intra-128x64-q80.ivf"
description = "Multi-superblock 8-bit 4:2:0 intra key frame (IVF, 128x64) from a project-owned input whose left 64x64 is a top/bottom-split anti-diagonal hedge (top 40, bottom 210) and right 64x64 is a vertical gradient (top 30, bottom 210, flat chroma U=120 V=130) with broad decode tools disabled at base_q_idx 80, so the LEFT superblock codes as the section 7.13.2.8 D135_PRED directional mode (the section 5.20.5.3 y_mode_offset escape, IntraJointMode 36) and the RIGHT superblock as SMOOTH_V_PRED. The decisive element: the right superblock's left neighbour stored the directional IntraJointMode 36 (>= NON_DIRECTIONAL_MODES_COUNT), so its section 8.3.2 y_mode_index context is 1 and it reads y_mode_set / y_mode_index from TileYModeIndexCdf[1] — the first general-intra directional-neighbour (ctx != 0) y_mode_index decode, which the prior brick rejected. The right modeIdx (== y_mode_index 2 < NON_DIRECTIONAL_MODES_COUNT) passes through section 5.20.5.3 get_intra_y_mode_set unchanged (the directional-neighbour reorder loop fires only for modeIdx >= 5), giving Reordered_Y_Mode[2] == SMOOTH_V_PRED over the real reconstructed left-neighbour edge; avmdec and dav2d raw outputs agree (md5 1a84b6545ee333b98cdf1982fd18310a) and splot reproduces byte-for-byte; validates clean."
