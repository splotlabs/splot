[[vector]]
path = "vectors/valid/syn-rdir-intra-128x64-q80.ivf"
description = "Multi-superblock 8-bit 4:2:0 intra key frame (IVF, 128x64) from a project-owned input whose left 64x64 is a smooth vertical gradient and right 64x64 is a D135-exact construction (upper-right triangle 127, lower-left propagating the left column down the 135-degree diagonal; flat chroma U=120 V=130) with broad decode tools disabled at base_q_idx 80 and --sb-size=64 forcing a 64x64 superblock grid, so the LEFT superblock codes as SMOOTH_V_PRED luma with DC chroma and the RIGHT superblock codes as the section 7.13.2.8 D135_PRED directional mode (the section 5.20.5.3 y_mode_offset escape with a NON-directional left neighbour, section 8.3.2 ctx == 0) plus its uv_mode == 0 directional-follow D135 chroma. The decisive element: the RIGHT D135 block READS the LEFT superblock's real reconstructed right column (a non-flat 34-distinct-value vertical gradient) as its section 7.13.2.1 left edge — the first general-intra neighbour-having directional luma+chroma decode over a real reconstructed non-flat edge, which the prior brick rejected (general_intra_multiblock_directional_luma for luma, general_intra_directional_chroma_neighbour for chroma). pAngle 135 has dx = dy = Dr_Intra_Derivative[45] = 64 so every projection has shift == 0, making the section 7.13.2.8 luma IDIF 4-tap (Dr_Interp_Filter[0] = {0,128,0,0}) a sample copy Edge[base], bit-identical to the chroma bilinear branch even over the non-flat edge; avmdec and dav2d raw outputs agree (md5 9ff7e4d46c0dd4fa979070ce4ca4dd1c) and splot reproduces byte-for-byte; validates clean."
expect = "clean"

[[vector]]
path = "vectors/valid/syn-vgrid-intra-192x128-q120.ivf"
description = "Full 2-D grid 8-bit 4:2:0 intra key frame (IVF, 192x128, three superblock columns by two superblock rows) from a project-owned vertical-gradient luma input (top 20, bottom 230, small per-superblock-column tint, flat chroma U=120 V=130) with broad decode tools disabled at base_q_idx 120, so the right two superblock columns code as SMOOTH_V_PRED luma. The decisive block is the row > 0 SMOOTH_V_PRED luma superblock at the MIDDLE (non-rightmost) column: unlike the first-row syn-mbvg SMOOTH_V block (haveAbove 0, above row a section 7.13.2.1 fallback), this one has haveAbove 1, so section 7.13.2.1 supplies the REAL reconstructed above row CurrFrame[0][y-1][...] (the bottom row of the already-decoded above superblock); being non-rightmost it also has a decoded above-right superblock so full_sb_num4_above_right / the section 7.13.2.1 AboveRow[w] resolver run (SMOOTH_V reads AboveRow[j] and the bottom-left sentinel, not the top-right one). The prior brick gated SMOOTH luma neighbour decode to the first superblock row and rejected this frame (general_intra_multirow_neighbour_non_dc); the first general-intra 2-D grid non-DC luma decode reading a real reconstructed above row, whose avmdec and dav2d raw outputs agree (md5 136a87190eeecb1ccd32e7cf27861c9c) and splot reproduces byte-for-byte; validates clean."
expect = "clean"

