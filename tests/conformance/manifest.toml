#
# Conformance corpus manifest (CONF-AVM-VALID-STREAMS).
#
# A self-contained, committed corpus: every vector is committed under
# `tests/conformance/` and validated by the committed runner with NO AVM
# dependency (see docs/CONFORMANCE.md). AVM is only the LOCAL generator or
# source seed described by each vector's provenance; it is never invoked,
# vendored, or depended on by the runner, build, or CI.
#
# Schema
# ------
# Each `[[vector]]` entry has:
#
#   path        Path to the committed vector, relative to `tests/conformance/`.
#   description Human-readable note on what the vector exercises.
#   expect      The expected validation outcome, one of:
#                 expect = "clean"
#                   -> the validator reports ZERO errors.
#                 expect = { diagnostics = ["rule_id", ...] }
#                   -> the validator emits EXACTLY this set of error `rule_id`s
#                      (set equality: every listed id present, and no
#                      unexpected error ids). Order and multiplicity are
#                      ignored; warnings/info are not constrained.
#
# The runner (`cargo xtask conformance` and the splot-cli integration test)
# reads each vector's committed bytes and runs
# `splot_validate::Validator::validate_bytes` — the same entry point the CLI
# `validate` command uses — then asserts the `expect` outcome.

