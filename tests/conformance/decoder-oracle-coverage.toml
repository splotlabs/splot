#
# Decoder-oracle coverage taxonomy (CONF-AVM-DECODE-ORACLE).
#
# The authoritative list of decoder-relevant AV2 v1.0.0 capabilities the fixture
# corpus is measured against. `cargo xtask decoder-fixtures coverage` cross-joins
# this taxonomy with tests/conformance/decoder-oracle.toml to generate
# docs/decoder/DECODER-ORACLE-COVERAGE.md. Every `[[capability]]` id referenced
# by a fixture's `features` MUST exist here (enforced by `decoder-fixtures verify`).
#
#   id                 stable dotted capability id.
#   name               short human description.
#   category           grouping (container, obu, sequence, frame, tile, partition,
#                      intra, residual, inter, transform, coeff, quant, loop_filter,
#                      film_grain, metadata, output).
#   fixtureable        false => not producible by the local AVM synthetic corpus
#                      (recorded as not_fixtureable_with_avm_encoder in the report).
#   spec_sections      AV2 v1.0.0 sections.
#   decoder_support_rows  cross-reference into docs/DECODER-SUPPORT-MATRIX.toml.

schema_version = 1

