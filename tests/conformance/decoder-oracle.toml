#
# Decoder-output oracle manifest (CONF-AVM-DECODE-ORACLE).
#
# A self-contained, committed decode-output differential over the reused
# CONF-AVM-VALID-STREAMS corpus (tests/conformance/vectors/**.ivf). Each fixture
# records the AVM decoder oracle hash so the committed runner can compare
# `splot decode` output WITHOUT invoking AVM. AVM is a LOCAL oracle only: it is
# never invoked, vendored, or required by the runner, build, or CI. See
# docs/decoder/AVM-FIXTURE-CORPUS.md and docs/decoder/avm-fixture-mission-log.md.
#
# Differential basis (confirmed byte-identical):
#   sha256(splot decode --output-format raw)  ==  avm_raw_i420_sha256
#   avm_raw_i420_sha256 = sha256(avmdec --i420 --rawvideo)   [visible I420, §6.18]
#
# Schema
# ------
#   schema_version   integer.
#   avm_revision     AVM git commit that produced the oracle hashes.
#   vectors_root     paths in each fixture are relative to this repo dir.
#
#   [[fixture]]
#     id              stable short id (unique; matches the vector basename).
#     path            .ivf path relative to `vectors_root`.
#     status          "must_pass" | "xfail_splot" | "avm_oracle_only" | "blocked".
#     width, height   frame dimensions.
#     coded_frames    IVF frame-record count.
#     shown_frames    AVM-output (visible) frame count.
#     bytes_per_sample 1 (8-bit) or 2 (10/12-bit output).
#     features        capability ids from decoder-oracle-coverage.toml.
#     spec_sections   AV2 v1.0.0 section ids the fixture exercises.
#   [fixture.hashes]
#     ivf_sha256              sha256 of the committed .ivf bytes.
#     avm_raw_i420_sha256     whole-stream visible-sample oracle hash.
#     avm_raw_i420_frame_sha256  per-shown-frame oracle hashes.
#   [fixture.expected_splot]
#     kind = "raw_i420_equals_avm"     (must_pass): splot raw == avm_raw_i420_sha256.
#     kind = "unsupported_feature"     (xfail_splot): splot fails closed with
#       rule_id / unsupported_reason / matrix_row / feature_id / detail_kind, and
#       strict_xpass_should_fail = true.
#
# The runner is crates/splot-cli/tests/decoder_oracle.rs (CI gate, in-process,
# no AVM) plus `cargo xtask decoder-fixtures {verify,report,coverage}`.

schema_version = 1
corpus_id = "splot.av2.decoder.avm-oracle"
av2_spec_version = "1.0.0"
reference_tool = "AVM"
reference_tool_policy = "local-only; never invoked, vendored, or required by the runner, build, or CI"
avm_revision = "457cd58681a747465661baccb1f32095bc5b7774"
avm_decode_command_summary = "avmdec --i420 --rawvideo -o <out.raw> <fixture.ivf>"
vectors_root = "tests/conformance"
max_frames = 4

