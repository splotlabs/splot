# Machine-checkable manifest for the hand-crafted `tests/fixtures/*.av2` corpus.
#
# `cargo xtask check-fixtures` (hermetic; no decoder, no network) verifies that
# every committed `.av2` fixture is listed here exactly once, exists, and matches
# its recorded `sha256`, and that `category` is consistent with `expect`.
# `crates/splot-cli/tests/fixture_manifest.rs` separately verifies each `expect`
# against the actual validator (in-process). Byte-level details and the `printf`
# regeneration recipes live in `tests/fixtures/README.md`; the workflow lives in
# `docs/FIXTURES.md`. This file is the normative source for hashes and outcomes.
#
# Schema (one `[[fixture]]` per committed `.av2` file):
#   name        stable short id (unique)
#   path        path relative to tests/fixtures/ (unique)
#   sha256      lowercase hex SHA-256 of the committed bytes
#   description one-line human note
#   category    "valid" | "validation-error" | "parse-error"
#   expect      "clean"  | { diagnostics = ["rule-id", ...] }  (error rule-id set)
#
# category/expect consistency (enforced by check-fixtures):
#   valid            <-> expect = "clean"
#   parse-error      <-> expect = { diagnostics = ["bitstream/parse-error"] }
#   validation-error <-> expect = { diagnostics = [...] }, non-empty and not the
#                        bare parse-error set

