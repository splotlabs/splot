[package]
name = "splot-cli"
description = "splot command-line interface: validate, inspect, and (future) encode/decode AV2 bitstreams."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "splot"
path = "src/main.rs"

[dependencies]
splot-core.workspace = true
splot-decode.workspace = true
splot-validate.workspace = true
splot-encode.workspace = true
splot-parallel.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Conformance-corpus integration test reads tests/conformance/manifest.toml
# (CONF-AVM-VALID-STREAMS). `toml`/`serde` are workspace dependencies already.
toml.workspace = true
# Golden snapshot tests of the `splot inspect --json` output (CONF-INSPECT-SNAPSHOTS).
insta.workspace = true
# Streaming per-frame digests for the ignored local decoder mission AVM full-stream compare harness.
sha2.workspace = true
