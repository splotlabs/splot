[workspace]
members = [
    "crates/splot-core",
    "crates/splot-parallel",
    "crates/splot-recon",
    "crates/splot-decode",
    "crates/splot-validate",
    "crates/splot-encode",
    "crates/splot-cli",
    "xtask",
]
default-members = [
    "crates/splot-core",
    "crates/splot-parallel",
    "crates/splot-recon",
    "crates/splot-decode",
    "crates/splot-validate",
    "crates/splot-encode",
    "crates/splot-cli",
    "xtask",
]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96.0"
authors = ["Bartosz Tomczyk <bartekplus@gmail.com>"]
repository = "https://github.com/splotlabs/splot"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.dependencies]
# Internal crates (path + version so the dependency direction is explicit).
splot-core = { path = "crates/splot-core", version = "0.0.0" }
splot-parallel = { path = "crates/splot-parallel", version = "0.0.0" }
splot-recon = { path = "crates/splot-recon", version = "0.0.0" }
splot-decode = { path = "crates/splot-decode", version = "0.0.0" }
splot-validate = { path = "crates/splot-validate", version = "0.0.0" }
splot-encode = { path = "crates/splot-encode", version = "0.0.0" }

# External dependencies. Versions resolved against crates.io as of 2026-06; keep current.
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Fixed-layout byte/wire view structs only (e.g. IVF headers); never the
# media-buffer ownership model or AV2 bit-level/entropy parsing. See ZERO_COPY.md.
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1"
proptest = "1"
# Dev-only: golden snapshot tests of the `splot inspect` JSON output (CONF-INSPECT-SNAPSHOTS).
insta = "1"
rayon = "1"
crossbeam-channel = "0.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# `all` is a lint group, so it must have a lower priority than the individual
# lints below; otherwise Cargo's `lint_groups_priority` check fails.
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# Build profiles. `overflow-checks` is declared explicitly on every profile so codec
# arithmetic traps integer overflow even in optimized builds: the `release` profile
# would otherwise silently wrap on overflow, a correctness hazard for a codec. `dev`
# and `test` already default to `true`; declaring them documents the intent and keeps
# the guarantee robust to future profile edits.
[profile.release]
overflow-checks = true

[profile.dev]
overflow-checks = true

[profile.test]
overflow-checks = true
