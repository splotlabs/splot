[workspace]
members = [
    "crates/splot-core",
    "crates/splot-parallel",
    "crates/splot-tables",
    "crates/splot-recon",
    "crates/splot-decode",
    "crates/splot-validate",
    "crates/splot-encode",
    "crates/splot-cli",
    "xtask",
]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
authors = ["Bartosz Tomczyk <bartekplus@gmail.com>"]
repository = "https://github.com/splotlabs/splot"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.dependencies]
splot-core = { path = "crates/splot-core", version = "0.0.0" }
splot-parallel = { path = "crates/splot-parallel", version = "0.0.0" }
splot-tables = { path = "crates/splot-tables", version = "0.0.0" }
splot-recon = { path = "crates/splot-recon", version = "0.0.0" }
splot-decode = { path = "crates/splot-decode", version = "0.0.0" }
splot-validate = { path = "crates/splot-validate", version = "0.0.0" }
splot-encode = { path = "crates/splot-encode", version = "0.0.0" }

thiserror = "2"
# Allocation-free mutex: std boxes a pthread lock on first use, which showed up
# as ~15 allocations per decoded frame.
parking_lot = "0.12"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Fixed-layout byte/wire view structs only (e.g. IVF headers); never the
# media-buffer ownership model or AV2 bit-level/entropy parsing. See docs/ARCHITECTURE.md.
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
toml = "1"
proptest = "1"
# Dev-only: golden snapshot tests of the `splot inspect` JSON output (CONF-INSPECT-SNAPSHOTS).
insta = "1"
rayon = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Individual overrides take precedence over lint groups.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Codec arithmetic uses deliberate integer casts.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
chunks_exact_to_as_chunks = "allow"
doc_markdown = "allow"
manual_bit_width = "allow"
manual_midpoint = "allow"
manual_slice_fill = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
# Internal submodules share their parent namespace.
wildcard_imports = "allow"
if_not_else = "allow"

# Keep unwind enabled: output/raw.rs converts output-task panics into typed errors.
# LTO remains off to avoid its release build-time cost.
[profile.release]
overflow-checks = false

[profile.dev]
overflow-checks = true

[profile.test]
overflow-checks = true
