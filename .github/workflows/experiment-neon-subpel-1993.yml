name: NEON subpel comparison (#1993)

on:
  push:
    branches: [test/simd-1993-neon-subpel]

permissions:
  contents: read

jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 150
    env:
      BASE: 9df30e915bd27da01769ccf41bb53bfa99d69063
      STARTUP: 98b65418fbb87d325a8a49ce1e7a6fdb876a30d0
      SHARED: f72349d19c9251396574df6c44c406e48558a771
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_RELEASE_STRIP: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: harness
          sparse-checkout: scripts/experiment-neon-subpel.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.BASE }}
          path: base
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.STARTUP }}
          path: startup
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.SHARED }}
          path: shared
      - name: Verify native host and pin Rust
        run: |
          set -euo pipefail
          mkdir results
          {
            uname -a
            sw_vers
            test "$(uname -m)" = arm64
            test "$(arch)" = arm64
            sysctl machdep.cpu.brand_string hw.model hw.physicalcpu hw.logicalcpu hw.optional.neon
            test "$(sysctl -n hw.optional.neon)" = 1
            sysctl -a | grep -Ei 'i8mm|dotprod|armv8_2' || true
            xcodebuild -version
            rustup toolchain install 1.100.0 --profile minimal
            rustc +1.100.0 -vV
            rustc +1.100.0 --print cfg
          } 2>&1 | tee results/host.txt
      - name: Build and inspect each native revision
        run: |
          set -euo pipefail
          root="$PWD"
          for variant in base startup shared; do
            (
              cd "$root/$variant"
              out="$root/results/$variant"
              mkdir -p "$out"
              variable=$(printf '%s' "$variant" | tr '[:lower:]' '[:upper:]')
              revision=$(git rev-parse HEAD)
              test "$revision" = "${!variable}"
              printf '%s\n' "$revision" | tee "$out/revision.txt"
              export CARGO_TARGET_DIR="$RUNNER_TEMP/splot-neon-$variant"
              cargo +1.100.0 build --release --locked -j1 -p splot-cli -p splot-capi \
                2>&1 | tee "$out/build.log"
              cp "$CARGO_TARGET_DIR/release/splot" "$CARGO_TARGET_DIR/release/libsplot_capi.dylib" "$out/"
              {
                test "$(lipo -archs "$out/splot")" = arm64
                test "$(lipo -archs "$out/libsplot_capi.dylib")" = arm64
                shasum -a 256 "$out"/splot "$out"/libsplot_capi.dylib
                stat -f '%z %N' "$out"/splot "$out"/libsplot_capi.dylib
                size -m "$out"/splot "$out"/libsplot_capi.dylib
                mkdir "$out/stripped"
                for file in splot libsplot_capi.dylib; do
                  cp "$out/$file" "$out/stripped/$file"
                  strip -S -x "$out/stripped/$file"
                done
                stat -f '%z %N' "$out/stripped"/splot "$out/stripped"/libsplot_capi.dylib
              } | tee "$out/linked-size.txt"
              for file in splot libsplot_capi.dylib; do
                nm -nm "$out/$file" | gzip -c > "$out/$file.symbols.txt.gz"
                if xcrun --find llvm-objdump >/dev/null 2>&1; then
                  xcrun llvm-objdump -d --demangle --symbolize-operands "$out/$file" |
                    gzip -c > "$out/$file.disassembly.txt.gz"
                else
                  otool -tvV "$out/$file" | gzip -c > "$out/$file.disassembly.txt.gz"
                fi
              done
            )
          done
      - name: Reuse frozen inputs and compare first-picture latency
        run: |
          set -euo pipefail
          python3 shared/scripts/prepare-simd-ewouth.py "$RUNNER_TEMP/ewouth" 2>&1 | tee results/corpus.log
          cp "$RUNNER_TEMP/ewouth/simd-cases.tsv" results/
          python3 -u harness/scripts/experiment-neon-subpel.py results "$RUNNER_TEMP/ewouth" \
            2>&1 | tee results/comparison.log
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: splot-neon-1993-qualification
          retention-days: 14
          path: |
            results/**/*.txt
            results/**/*.log
            results/**/*.tsv
            results/**/*.csv
            results/**/*.gz
          if-no-files-found: warn
