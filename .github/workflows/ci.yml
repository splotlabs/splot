name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # rustup honors rust-toolchain.toml; this installs the pinned 1.96.0
      # toolchain together with its rustfmt and clippy components.
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry, git, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --all-targets --locked
      - run: cargo xtask check-license-headers
      - run: cargo xtask check-dependency-direction

  # Optional, non-blocking supply-chain audit. It installs a network-heavy tool, so
  # it must not gate the main pipeline.
  cargo-deny:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - run: cargo deny check
