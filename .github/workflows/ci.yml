name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry, git, and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Install typos and cargo-machete
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: typos,cargo-machete

      - name: Cache dupehound binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/dupehound
          key: ${{ runner.os }}-dupehound-0.1.2

      # Pin the detector so duplicate counts stay reproducible.
      - name: Install dupehound
        run: |
          if command -v dupehound >/dev/null 2>&1 && [ "$(dupehound --version)" = "dupehound 0.1.2" ]; then
            dupehound --version
          else
            cargo install dupehound@0.1.2 --locked --force
          fi

      - name: Check Conventional Commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_COMMIT_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_COMMIT_RANGE: ${{ github.event.before }}..${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            cargo xtask check-conventional-title "$PR_TITLE"
            cargo xtask check-conventional-commits "$PR_COMMIT_RANGE"
          else
            if [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "Initial push; skipping conventional commit range check"
              exit 0
            fi
            cargo xtask check-conventional-commits "$PUSH_COMMIT_RANGE"
          fi

      - run: cargo xtask ci
      - run: cargo test -p splot-decode --release --lib --locked

      - name: dupehound ratchet (block newly introduced duplication)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: dupehound check --diff "$BASE_SHA" .

  dav2d-test-data:
    runs-on: ubuntu-latest
    env:
      DAV2D_TEST_DATA_REV: ec53c12d4170372c1ad71532217a204e1553f898
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Clone pinned dav2d test data
        env:
          TEST_DATA_DIR: ${{ runner.temp }}/dav2d-test-data
        run: |
          git clone --no-checkout https://code.videolan.org/videolan/dav2d-test-data.git "$TEST_DATA_DIR"
          git -C "$TEST_DATA_DIR" checkout --detach "$DAV2D_TEST_DATA_REV"

      - name: Build splot
        run: cargo build --release -p splot-cli --locked

      - name: Verify upstream AVM corpus hashes
        env:
          TEST_DATA_DIR: ${{ runner.temp }}/dav2d-test-data
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import re
          import subprocess
          import tempfile

          root = pathlib.Path(os.environ["TEST_DATA_DIR"])
          manifest = (root / "avm/meson.build").read_text()
          pattern = re.compile(
              r"\['([^']+)',\s*files\('([^']+)'\),\s*'([0-9a-f]{32})'\]"
          )
          entries = pattern.findall(manifest)
          if not entries:
              raise SystemExit("upstream AVM manifest contains no test entries")

          names = [name for name, _, _ in entries]
          paths = [path for _, path, _ in entries]
          if len(names) != len(set(names)):
              raise SystemExit("upstream AVM manifest contains duplicate test names")
          if len(paths) != len(set(paths)):
              raise SystemExit("upstream AVM manifest contains duplicate test paths")

          avm_root = root / "avm"
          listed = set(paths)
          present = {
              path.relative_to(avm_root).as_posix()
              for path in avm_root.rglob("*.obu")
          }
          missing = sorted(listed - present)
          unlisted = sorted(present - listed)
          if missing or unlisted:
              raise SystemExit(
                  f"upstream AVM manifest/file mismatch: missing={missing}, unlisted={unlisted}"
              )

          with tempfile.TemporaryDirectory() as temp:
              for name, relative, expected in sorted(entries):
                  output = pathlib.Path(temp) / f"{name}.raw"
                  subprocess.run(
                      [
                          "target/release/splot",
                          "decode",
                          "--quiet",
                          "--threads=1",
                          "--output-format=raw",
                          f"--output={output}",
                          avm_root / relative,
                      ],
                      check=True,
                  )
                  actual = hashlib.md5(output.read_bytes(), usedforsecurity=False).hexdigest()
                  if actual != expected:
                      raise SystemExit(f"{name}: expected {expected}, got {actual}")
                  print(f"{name}: {actual}")
          print(f"verified all {len(entries)} upstream AVM streams")
          PY

  # Advisories are informational because the database changes independently of PRs.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cargo-deny (bans, licenses, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.96.0"
          command: check bans licenses sources
          arguments: --all-features

      - name: cargo-deny (advisories)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        continue-on-error: true
        with:
          rust-version: "1.96.0"
          command: check advisories
          arguments: --all-features

  fuzz-list:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        name: Enumerate registered fuzz targets
        run: |
          targets=$(python3 -c '
          import json, tomllib
          with open("fuzz/Cargo.toml", "rb") as f:
              manifest = tomllib.load(f)
          print(json.dumps([b["name"] for b in manifest.get("bin", [])]))
          ')
          test -n "$targets" && test "$targets" != "[]"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Fuzz targets: $targets"

  fuzz:
    needs: fuzz-list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-list.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Corpus generation uses the pinned toolchain; fuzzing uses rolling nightly.
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-fuzz

      - name: Cache fuzz build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-fuzz-

      - name: Seed every target's corpus from curated fixtures
        run: cargo xtask seed-fuzz-corpus

      # Force GNU: AddressSanitizer cannot link the static musl default.
      - name: Fuzz this target (per-target smoke)
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          cargo +nightly fuzz run "$FUZZ_TARGET" --target x86_64-unknown-linux-gnu -- -max_total_time=45 -timeout=10 -rss_limit_mb=2048

      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/**
          if-no-files-found: ignore

  # Stable branch-protection check across changes to the fuzz target matrix.
  fuzz-smoke:
    needs: [fuzz-list, fuzz]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every fuzz target to have passed
        env:
          LIST_RESULT: ${{ needs.fuzz-list.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
        run: |
          echo "fuzz-list: $LIST_RESULT; fuzz matrix: $FUZZ_RESULT"
          if [ "$LIST_RESULT" != "success" ] || [ "$FUZZ_RESULT" != "success" ]; then
            echo "fuzz-smoke failed: a target crashed or the target list was not produced."
            exit 1
          fi
          echo "All fuzz targets passed."

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Add llvm-tools-preview
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-llvm-cov

      - name: Coverage (workspace summary + lcov)
        run: |
          cargo llvm-cov --workspace --all-features --locked --no-report
          cargo llvm-cov report --summary-only
          cargo llvm-cov report --lcov --output-path lcov.info
      # Keep the exclusion in sync with SPLOT_VALIDATE_COVERAGE_IGNORE_REGEX in xtask.
      - name: Gate splot-validate line coverage (>= 90%)
        run: cargo llvm-cov report --fail-under-lines 90 --ignore-filename-regex 'crates/splot-(core|parallel|recon|decode|encode|cli)/|(^|/)xtask/|(^|/)fuzz/'

      - name: Upload lcov artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: warn

  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Decode Ir regression gate
        run: cargo xtask perf
