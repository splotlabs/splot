name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

env:
  CARGO_TERM_COLOR: always

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch) so CI
# spends its minutes on the latest commit instead of stale ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All jobs only read the tree; deny the default read/write GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      # rustup honors rust-toolchain.toml; this installs the pinned 1.96.0
      # toolchain together with its rustfmt and clippy components.
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry, git, and target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Prebuilt binaries for the external-tool checks — far faster than
      # `cargo install`, and the same binaries `cargo xtask ci` runs locally.
      - name: Install typos and cargo-machete
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: typos,cargo-machete

      # Duplicate-code detector (https://github.com/Rafaelpta/dupehound). Pinned so
      # the budget count is reproducible; the same binary `cargo xtask ci` runs.
      - name: Install dupehound
        run: cargo install dupehound@0.1.2 --locked

      - name: Check Conventional Commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_COMMIT_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_COMMIT_RANGE: ${{ github.event.before }}..${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            cargo xtask check-conventional-title "$PR_TITLE"
            cargo xtask check-conventional-commits "$PR_COMMIT_RANGE"
          else
            if [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "Initial push; skipping conventional commit range check"
              exit 0
            fi
            cargo xtask check-conventional-commits "$PUSH_COMMIT_RANGE"
          fi

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --all-targets --locked
      # `--all-targets` skips doctests, so run them explicitly.
      - run: cargo test --doc --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: typos
      - run: cargo machete --with-metadata
      - run: cargo xtask check-license-headers
      - run: cargo xtask check-source-lines
      - run: cargo xtask check-dependency-direction
      - run: cargo xtask check-concurrency-policy
      - run: cargo xtask check-spec-mirror
      - run: cargo xtask check-feature-status
      - run: cargo xtask check-diagnostic-registry
      # Stable-toolchain drift gate: the fuzz-smoke job's `cargo fuzz list` only
      # sees registered [[bin]] targets, so an unregistered fuzz_targets/*.rs
      # file would be fuzzed by neither job without this check.
      - run: cargo xtask check-fuzz-targets
      - run: cargo xtask check-fixtures
      # Absolute duplicate-code budget (tools/dupehound/budget.toml ceiling).
      - run: cargo xtask check-duplication

      # PR ratchet: fail when this PR's diff duplicates existing code. The base
      # SHA is bound through env (workflow-injection hygiene) and compared via
      # merge-base; full history is available because checkout uses fetch-depth 0.
      # Push events skip this (no PR base); the budget gate above still runs.
      - name: dupehound ratchet (block newly introduced duplication)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: dupehound check --diff "$BASE_SHA" .

      - name: OpenSpec validation if available
        run: |
          if command -v openspec >/dev/null 2>&1; then
            openspec validate --all --no-interactive
          else
            echo "openspec not installed; skipping OpenSpec CLI validation"
          fi

  # Supply-chain policy. The deterministic checks (bans, licenses, sources) gate the
  # merge; the advisory DB is informational because it changes without a repo diff,
  # so a newly published advisory must not retroactively fail an unrelated PR.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # Deterministic policy — gates the merge.
      - name: cargo-deny (bans, licenses, sources)
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          rust-version: "1.96.0"
          command: check bans licenses sources
          arguments: --all-features

      # Advisory DB — informational; changes without a repo diff, must not gate.
      - name: cargo-deny (advisories)
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        continue-on-error: true
        with:
          rust-version: "1.96.0"
          command: check advisories
          arguments: --all-features

  # Enumerate the registered fuzz targets once so the per-target smoke matrix
  # stays in lock step with the [[bin]] set (cargo xtask check-fuzz-targets gates
  # that those equal fuzz_targets/*.rs). Parse fuzz/Cargo.toml with a real TOML
  # reader (Python tomllib) so every valid [[bin]] entry is captured the same way
  # the xtask drift gate sees it, regardless of spacing/indentation/comments — no
  # nightly toolchain or cargo-fuzz needed just to list names. The matrix is
  # derived, never hardcoded, so a new target is picked up with no workflow edit.
  fuzz-list:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - id: list
        name: Enumerate registered fuzz targets
        run: |
          targets=$(python3 -c '
          import json, tomllib
          with open("fuzz/Cargo.toml", "rb") as f:
              manifest = tomllib.load(f)
          print(json.dumps([b["name"] for b in manifest.get("bin", [])]))
          ')
          test -n "$targets" && test "$targets" != "[]"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Fuzz targets: $targets"

  # Blocking smoke fuzz: catch newly-introduced panics at PR time. Each registered
  # target runs as its own matrix leg, in parallel, for a per-target slice — so the
  # smoke's wall-clock is one target's slice, not the sum of all of them. Tracked
  # fuzzed surfaces: parse_obu (read_leb128 / read_obu_header / parse_annex_b_obus),
  # parse_ivf (IVF container), parse_bitstream (container auto-detect + envelope
  # parsing), symbol_decoder_bytes (AV2 §8.2 symbol decoder),
  # tile_payload_decode_bytes (minimal tile-payload frontier), validate_bytes
  # (full validator + payload parsers, the highest-coverage target),
  # decode_plan_bytes (raw byte planner),
  # decode_runtime_hash_bytes (minimal runtime hash byte API),
  # decode_runtime_raw_bytes (minimal runtime raw byte API),
  # decode_runtime_y4m_bytes (minimal runtime Y4M byte API),
  # recon_frame_hash_bytes (decoded-frame hash serialization),
  # recon_frame_plane_types_bytes (decoded-frame/plane type model),
  # recon_reference_frame_store_bytes (reference-frame store API),
  # recon_y4m_output_bytes (Y4M output serialization), and
  # recon_intra_prediction_bytes (intra prediction/workspace primitives),
  # encoder_frame_input_views_bytes (encoder borrowed input views), and
  # roundtrip_obu_bytes (typed OBU writer roundtrips).
  # cargo-fuzz needs a nightly toolchain (ASan + coverage are nightly-only).
  fuzz:
    needs: fuzz-list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-list.outputs.targets) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: cargo-fuzz

      # Speeds up the (otherwise slow) instrumented build across runs.
      - name: Cache fuzz build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: fuzz/target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-fuzz-

      # Capture the target list first and require it non-empty: inside
      # `for x in $(cmd)`, bash -e treats a failing `cmd` as an empty list and the
      # step would pass having fuzzed nothing.
      - name: Seed every target's corpus from curated fixtures
        run: |
          targets=$(cargo +nightly fuzz list)
          test -n "$targets"
          for target in $targets; do
            mkdir -p "fuzz/corpus/$target"
            cp tests/fixtures/*.av2 "fuzz/corpus/$target/" 2>/dev/null || true
          done
          # symbol_decoder_bytes consumes a leading config byte, payload length,
          # payload bytes, operation count, then operations. Seed a minimal
          # valid finish path over a two-byte symbol payload.
          printf '\002\002\200\000\001\005' > "fuzz/corpus/symbol_decoder_bytes/finish-valid-two-byte-payload"
          # tile_payload_decode_bytes consumes flags, payload length, limit seed,
          # detail seed, then payload bytes or mutation pairs. Seed the known-good
          # minimal payload with frontier mode enabled and zero mutations.
          printf '\006\002\177\000' > "fuzz/corpus/tile_payload_decode_bytes/frontier-good-payload"
          # validate_bytes consumes a leading config prefix before the bitstream,
          # so raw fixtures land shifted; also seed flag-prefixed copies (strict,
          # and strict+external-HLS with a key byte).
          for f in tests/fixtures/*.av2; do
            name=$(basename "$f")
            printf '\001' | cat - "$f" > "fuzz/corpus/validate_bytes/strict-$name"
            printf '\003\377' | cat - "$f" > "fuzz/corpus/validate_bytes/hls-$name"
            # decode_plan_bytes also consumes a leading limit-policy byte. Keep
            # the fixture bytes intact as the bitstream payload after that flag.
            printf '\377' | cat - "$f" > "fuzz/corpus/decode_plan_bytes/fixture-$name"
            # decode_runtime_hash_bytes, decode_runtime_raw_bytes, and
            # decode_runtime_y4m_bytes consume a leading mode/limit byte.
            # Prefix raw mode so fixture bytes stay intact after the flag.
            printf '\000' | cat - "$f" > "fuzz/corpus/decode_runtime_hash_bytes/raw-$name"
            printf '\000' | cat - "$f" > "fuzz/corpus/decode_runtime_raw_bytes/raw-$name"
            printf '\000' | cat - "$f" > "fuzz/corpus/decode_runtime_y4m_bytes/raw-$name"
          done
          # Prefix fixture mode with zero mutations so the embedded minimal
          # runtime fixture reaches the success-path runtime APIs.
          printf '\200\000' > "fuzz/corpus/decode_runtime_hash_bytes/minimal-fixture-unmutated"
          printf '\200\000' > "fuzz/corpus/decode_runtime_raw_bytes/minimal-fixture-unmutated"
          printf '\200\000' > "fuzz/corpus/decode_runtime_y4m_bytes/minimal-fixture-unmutated"
          # recon_frame_hash_bytes consumes structured decoded-frame shape bytes
          # before sample data. Seed a tiny 8-bit monochrome visible-frame case.
          printf '\000\002\002\000\000\000\000\000\001\002\003\004' > "fuzz/corpus/recon_frame_hash_bytes/mono-8bit-visible"
          # recon_frame_plane_types_bytes consumes idc probes, a type selector,
          # structured frame shape bytes, then sample data. Seed a tiny 8-bit
          # monochrome frame/plane type case.
          printf '\001\000\000\003\003\000\000\000\000\000\001\002\003\004' > "fuzz/corpus/recon_frame_plane_types_bytes/mono-8bit-runtime-types"
          # recon_reference_frame_store_bytes consumes a capacity probe, initial
          # capacity, operation count, then operation bytes. Seed
          # put/get/take/entries coverage over a small valid store.
          printf '\003\003\005\004\000\001\000\002\003\004\005\006\003\000\007\005\000\003\000\007' > "fuzz/corpus/recon_reference_frame_store_bytes/basic-state-machine"
          # parse_ivf rejects non-DKIF input at the signature, so raw Annex-B
          # fixtures only exercise the error path; wrap each one in a minimal
          # 32-byte IVF header plus one 12-byte frame header for valid-path seeds.
          python3 -c '
          import glob, os, struct
          for path in glob.glob("tests/fixtures/*.av2"):
              data = open(path, "rb").read()
              header = struct.pack("<4sHH4sHHIIII", b"DKIF", 0, 32, b"AV02", 64, 64, 30, 1, 1, 0)
              frame = struct.pack("<IQ", len(data), 0)
              out = os.path.join("fuzz/corpus/parse_ivf", "ivf-" + os.path.basename(path))
              open(out, "wb").write(header + frame + data)
          '
          # Also seed from the committed conformance corpus
          # (tests/conformance/vectors/**.ivf): diverse AVM-generated AV2 streams
          # (multiple resolutions, 8/10-bit, intra/inter, OPS/LCR/QM) are strong
          # coverage-guided seeds. parse_ivf takes the IVF bytes directly;
          # validate_bytes takes the config-prefixed copies (auto-detects IVF);
          # parse_obu / parse_bitstream take the de-wrapped raw OBU stream (strip
          # the 32-byte IVF header and each frame's 12-byte header). The de-wrapped
          # bytes are §5 low-overhead OBUs, not Annex B, so parse_obu's
          # parse_annex_b_obus() returns Err (not a panic) on them — the seed still
          # exercises read_leb128 / read_obu_header on real OBU data, and
          # parse_bitstream auto-detects and parses the stream.
          # -print0 + read -d '' is robust to any filename (no word-splitting).
          find tests/conformance/vectors -name '*.ivf' -print0 | while IFS= read -r -d '' f; do
            name=$(echo "$f" | tr '/' '-')
            cp "$f" "fuzz/corpus/parse_ivf/conf-$name"
            printf '\001' | cat - "$f" > "fuzz/corpus/validate_bytes/conf-strict-$name"
            printf '\003\377' | cat - "$f" > "fuzz/corpus/validate_bytes/conf-hls-$name"
            printf '\377' | cat - "$f" > "fuzz/corpus/decode_plan_bytes/conf-$name"
            printf '\000' | cat - "$f" > "fuzz/corpus/decode_runtime_hash_bytes/conf-raw-$name"
            printf '\000' | cat - "$f" > "fuzz/corpus/decode_runtime_raw_bytes/conf-raw-$name"
            printf '\000' | cat - "$f" > "fuzz/corpus/decode_runtime_y4m_bytes/conf-raw-$name"
          done
          python3 -c '
          import glob, os, struct
          for path in glob.glob("tests/conformance/vectors/**/*.ivf", recursive=True):
              d = open(path, "rb").read()
              if len(d) < 32:  # shorter than the IVF header: skip rather than crash the step
                  continue
              hl = struct.unpack("<H", d[6:8])[0]
              off, obu = hl, b""
              while off + 12 <= len(d):
                  sz = struct.unpack("<I", d[off:off+4])[0]; off += 12
                  obu += d[off:off+sz]; off += sz
              tag = "conf-" + path.replace("/", "-") + ".obu"
              for tgt in ("parse_obu", "parse_bitstream"):
                  open(os.path.join("fuzz/corpus", tgt, tag), "wb").write(obu)
          '

      # Force the gnu target. install-action has no cargo-fuzz, so it falls back to
      # a musl-built binary whose default target is musl — and AddressSanitizer
      # cannot link a static musl libc. Building for gnu (the host) keeps ASan working.
      # One matrix leg per target: bash -e fails this leg on a crash, and the
      # aggregating fuzz-smoke job (below) stays red unless every leg is green.
      - name: Fuzz this target (per-target smoke)
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          cargo +nightly fuzz run "$FUZZ_TARGET" --target x86_64-unknown-linux-gnu -- -max_total_time=45 -timeout=10 -rss_limit_mb=2048

      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/**
          if-no-files-found: ignore

  # Single stable status check: green iff every fuzz matrix leg passed. Branch
  # protection requires this `fuzz-smoke` job, whose name stays fixed even as
  # targets are added to / removed from the dynamically-enumerated matrix above.
  fuzz-smoke:
    needs: [fuzz-list, fuzz]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every fuzz target to have passed
        env:
          LIST_RESULT: ${{ needs.fuzz-list.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
        run: |
          echo "fuzz-list: $LIST_RESULT; fuzz matrix: $FUZZ_RESULT"
          if [ "$LIST_RESULT" != "success" ] || [ "$FUZZ_RESULT" != "success" ]; then
            echo "fuzz-smoke failed: a target crashed or the target list was not produced."
            exit 1
          fi
          echo "All fuzz targets passed."

  # Coverage gate. Publishes the workspace summary + lcov artifact and blocks the
  # merge on >= 90% line coverage for splot-validate (the crate whose diagnostics are
  # the product); other crates are excluded via --ignore-filename-regex.
  # llvm-tools-preview is not in the pinned toolchain's components, so install it here
  # rather than in rust-toolchain.toml (keeps the default toolchain lean for everyone
  # else).
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Add llvm-tools-preview
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: cargo-llvm-cov

      - name: Coverage (workspace summary + lcov)
        run: |
          cargo llvm-cov --workspace --all-features --locked --no-report
          cargo llvm-cov report --summary-only
          cargo llvm-cov report --lcov --output-path lcov.info
      # Exclusion is by name (kept in sync with SPLOT_VALIDATE_COVERAGE_IGNORE_REGEX
      # in xtask): extend the regex when adding a workspace crate that should not
      # gate here, or it joins the threshold scope.
      - name: Gate splot-validate line coverage (>= 90%)
        run: cargo llvm-cov report --fail-under-lines 90 --ignore-filename-regex 'crates/splot-(core|parallel|recon|decode|encode|cli)/|(^|/)xtask/|(^|/)fuzz/'

      # TODO: upload lcov.info to Codecov once a token is configured (the
      # splot-validate line-coverage threshold is now enforced above).
      - name: Upload lcov artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: warn
