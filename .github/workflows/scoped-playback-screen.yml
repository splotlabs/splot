name: Build matched binaries for native AVX2 playback
on:
  push:
    branches: [experiment/simd-1934-scoped-screen]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - variant: release-typed
            ref: 3cddb13ac1905f197347c4b33020a3081e67dafe
          - variant: frozen-v3
            ref: b337fafec51041ee5ffe64cc7e20f79a49c0cc79
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Build the release CLI and C library with symbols
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo build --release --locked -j1 -p splot-cli -p splot-capi
          install -d playback
          cp target/release/splot target/release/libsplot_capi.so playback/
          git rev-parse HEAD > playback/revision.txt
          rustc -vV > playback/toolchain.txt
          cd playback
          sha256sum splot libsplot_capi.so > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playback-${{ matrix.variant }}
          path: playback
          retention-days: 1
          if-no-files-found: error
  native-grain:
    runs-on: ${{ vars.SPLOT_AVX512_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      SPLOT_REQUIRE_AVX512: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3cddb13ac1905f197347c4b33020a3081e67dafe
          persist-credentials: false
      - run: |
          lscpu
          grep -qw avx512f /proc/cpuinfo
          rustc -vV
      - name: Measure the shipped row widths at both depths
        run: |
          core=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          cargo test --release --locked -p splot-recon --lib --no-run
          taskset -c "$core" cargo test --release --locked -p splot-recon --lib \
            film_grain::tests::measure_wide_grain_noise_rows -- --ignored --exact --nocapture
      - name: Test and qualify display on signalled-grain streams
        run: |
          cargo test --release --locked -p splot-decode --test decoder_api avx512_film_grain_matches_narrow_output_at_both_bit_depths -- --exact
          python3 scripts/prepare-simd-ewouth.py "$RUNNER_TEMP/ewouth"
          grep filmgrain "$RUNNER_TEMP/ewouth/simd-cases.tsv" > "$RUNNER_TEMP/ewouth/grain.tsv"
          export SPLOT_EWOUTH_CASES="$RUNNER_TEMP/ewouth/grain.tsv"
          cargo test --release --locked -p splot-decode --test simd_backend_parity frozen_ewouth_streaming_parity -- --ignored --exact --nocapture
          SPLOT_TIMING_PAIRS=10 cargo test --release --locked -p splot-decode --test simd_backend_parity frozen_ewouth_streaming_parity -- --ignored --exact --nocapture
