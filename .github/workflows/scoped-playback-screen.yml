name: Qualify typed AVX-512 grain with 48 native timing pairs
on:
  push:
    branches: [experiment/simd-1882-grain-focus]
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ vars.SPLOT_AVX512_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 83566cc2a716603280a8b0773fc026f1fe86676e
          persist-credentials: false
      - name: Require a native wide host
        run: |
          lscpu
          cat > "$RUNNER_TEMP/host.rs" <<'RS'
          fn main() {
              macro_rules! require {
                  ($($feature:tt),+) => { $(assert!(std::arch::is_x86_feature_detected!($feature), "{}", $feature);)+ };
              }
              require!("adx", "aes", "avx512bitalg", "avx512bw", "avx512cd", "avx512dq",
                  "avx512f", "avx512ifma", "avx512vbmi", "avx512vbmi2", "avx512vl",
                  "avx512vnni", "avx512vpopcntdq", "bmi1", "bmi2", "cmpxchg16b", "fma",
                  "fxsr", "gfni", "lzcnt", "movbe", "pclmulqdq", "popcnt", "rdrand",
                  "rdseed", "sha", "vaes", "vpclmulqdq", "xsave", "xsavec", "xsaveopt", "xsaves");
          }
          RS
          rustc "$RUNNER_TEMP/host.rs" -o "$RUNNER_TEMP/host"
          "$RUNNER_TEMP/host"
      - name: Prepare the affected frozen stream
        run: |
          python3 scripts/prepare-simd-ewouth.py "$RUNNER_TEMP/ewouth"
          grep -F '_filmgrain_' "$RUNNER_TEMP/ewouth/simd-cases.tsv" > "$RUNNER_TEMP/ewouth/grain-cases.tsv"
      - name: Warm and compare 48 pairs at each thread count
        env:
          SPLOT_REQUIRE_AVX512: "1"
          SPLOT_TIMING_PAIRS: "48"
        run: |
          export SPLOT_EWOUTH_CASES="$RUNNER_TEMP/ewouth/grain-cases.tsv"
          cargo test -p splot-decode --release --locked --test simd_backend_parity \
            frozen_ewouth_streaming_parity -- --ignored --exact --nocapture
