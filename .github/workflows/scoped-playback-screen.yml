name: Compare release throughput on native AVX-512 hardware
on:
  push:
    branches: [experiment/simd-1934-scoped-screen]
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ${{ vars.SPLOT_AVX512_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require a native wide host
        run: |
          lscpu
          grep -qw avx512vbmi2 /proc/cpuinfo
      - name: Fetch fixed release binaries and inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45673211431 -n playback-frozen-v3 -D "$RUNNER_TEMP/frozen"
          gh run download 45674741726 -n playback-release-parent -D "$RUNNER_TEMP/parent"
          gh run download 45674741726 -n playback-release-final -D "$RUNNER_TEMP/candidate"
          python3 scripts/prepare-simd-ewouth.py "$RUNNER_TEMP/ewouth"
      - name: Compare full hashes and warmed native decode
        run: python3 scripts/compare-release-v3.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-release-timings
          path: ${{ runner.temp }}/xeon-release.csv
          retention-days: 5
