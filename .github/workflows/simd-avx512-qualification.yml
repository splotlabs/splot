name: AVX-512 correctness qualification

on:
  workflow_dispatch:
    inputs:
      timing:
        description: Run warmed AVX2 and AVX-512 timing pairs instead of full-stream hashing
        type: boolean
        default: false
      pairs:
        description: Measured pairs per stream and thread count
        type: number
        default: 8

permissions:
  contents: read

jobs:
  forced-avx512:
    runs-on: ${{ vars.SPLOT_AVX512_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
      SPLOT_REQUIRE_AVX512: "1"
      SPLOT_TEST_PROFILE: ${{ inputs.timing && 'release' || 'ci-release' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record runner and build environment
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc -vV
          lscpu
          grep -qw avx512f /proc/cpuinfo

      - name: Require and exercise the forced AVX-512 backend
        run: cargo test -p splot-decode --profile "$SPLOT_TEST_PROFILE" --locked --test simd_backend_parity

      - name: Check wide grain through synchronous and streaming APIs
        run: |
          cargo test -p splot-decode --profile "$SPLOT_TEST_PROFILE" --locked --test decoder_api \
            avx512_film_grain_matches_narrow_output_at_both_bit_depths -- --exact

      - name: Fetch and verify the frozen EwoutH streams
        run: python3 scripts/prepare-simd-ewouth.py "$RUNNER_TEMP/ewouth"

      - name: Compare forced and automatic streaming decode against AVM
        if: ${{ !inputs.timing }}
        run: |
          export SPLOT_EWOUTH_CASES="$RUNNER_TEMP/ewouth/simd-cases.tsv"
          cargo test -p splot-decode --profile "$SPLOT_TEST_PROFILE" --locked --test simd_backend_parity \
            frozen_ewouth_streaming_parity -- --ignored --exact --nocapture

      - name: Time alternating forced streaming decodes with discarded output
        if: ${{ inputs.timing }}
        env:
          SPLOT_TIMING_PAIRS: ${{ inputs.pairs }}
        run: |
          export SPLOT_EWOUTH_CASES="$RUNNER_TEMP/ewouth/simd-cases.tsv"
          cargo test -p splot-decode --profile "$SPLOT_TEST_PROFILE" --locked --test simd_backend_parity \
            frozen_ewouth_streaming_parity -- --ignored --exact --nocapture

      - name: Measure AVX2 and AVX-512 grain rows on the same core
        if: ${{ inputs.timing }}
        run: |
          core=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          taskset -c "$core" cargo test -p splot-recon --release --locked --lib \
            film_grain::tests::measure_wide_grain_noise_rows -- --ignored --exact --nocapture
