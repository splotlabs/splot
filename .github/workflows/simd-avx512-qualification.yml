name: AVX-512 correctness qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forced-avx512:
    runs-on: ${{ vars.SPLOT_AVX512_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      SPLOT_REQUIRE_AVX512: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record runner and build environment
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc -vV
          lscpu

      - name: Require and exercise the forced AVX-512 backend
        run: cargo test -p splot-decode --release --locked --test simd_backend_parity
