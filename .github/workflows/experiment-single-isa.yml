name: Compare single and dual AVX-512 release code
on:
  push:
    branches: [experiment/simd-1882-single-isa]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        mode: [single, dual]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build matched linked artifacts
        env:
          MODE: ${{ matrix.mode }}
          CARGO_PROFILE_RELEASE_STRIP: none
        run: |
          if [ "$MODE" = single ]; then git apply single-isa.patch; fi
          rustup show active-toolchain || rustup toolchain install
          cargo build --release --locked -p splot-cli -p splot-capi -j2
          mkdir audit
          for product in splot libsplot_capi.so; do
            cp "target/release/$product" "audit/$product"
            size -A "audit/$product" > "audit/$product.sections"
            nm -C --size-sort "audit/$product" | grep 'film_grain::apply::\|run_driver_session::' > "audit/$product.typed" || true
            strip --strip-all "audit/$product"
            stat -c '%n %s' "audit/$product"
          done
          rustc -vV > audit/toolchain.txt
          cat audit/*.typed | head -40 || true
          (cd audit && sha256sum splot libsplot_capi.so > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: matched-${{ matrix.mode }}
          path: audit
          if-no-files-found: error
          retention-days: 7
  compare:
    needs: build
    runs-on: ${{ vars.SPLOT_AVX512_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require the native wide host
        run: lscpu && grep -qw avx512vbmi /proc/cpuinfo
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: matched-*
          path: inputs
      - name: Compare release decoders with identical algorithms and compiler floor
        run: |
          python3 scripts/prepare-simd-ewouth.py "$RUNNER_TEMP/ewouth"
          python3 single-isa.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: single-isa-timings
          path: single-isa.csv
          if-no-files-found: error
          retention-days: 7
