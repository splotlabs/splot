name: claude-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: claude-review
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.draft == false
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The action does its own `git fetch origin --depth=N <head-ref>`
          # to pull the PR branch on top of this checkout, so we need git
          # credentials persisted in the workspace's `.git/config`.
          fetch-depth: 1
          persist-credentials: true

      - name: Claude PR review
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1.0.210
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR against AGENTS.md and the applicable repository docs.
            Read changed files and relevant callers in full before reporting a finding.
            Verify AV2 behavior against docs/spec/av2/1.0.0/ and the recorded AVM
            evidence. Check parser edge cases, error handling, security, architecture,
            test coverage, and documentation accuracy. Read .github/workflows/ci.yml
            and xtask/src/main.rs to avoid repeating findings already caught by CI.
            Report only concrete, actionable issues supported by the current code.

            Be thorough in analysis but high-signal in output. Report each
            issue you are genuinely confident is real as an inline comment,
            tagged with severity — [Blocker], [Important], or [Nit] — and
            citing file path and line number. Do not pad with style nits or
            restate what CI enforces. Post one top-level summary comment for
            cross-cutting observations and the overall verdict, and — when
            the PR is clean — say so explicitly there.

          # Untrusted PR text gets structured comment writers, never shell publishing
          # or unrestricted gh api access that could expose runner files or secrets.
          claude_args: |
            --model claude-opus-4-8
            --allowedTools "mcp__github_inline_comment__create_inline_comment,mcp__github_comment__update_claude_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
