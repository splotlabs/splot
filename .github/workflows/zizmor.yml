name: zizmor

# Static security analysis of the workflows themselves — the CI/CD layer
# that `cargo xtask ci` can't see. Mirrors GitHub's standard code-scanning
# split: pull requests are the enforcement point (annotations mode, which
# exits non-zero on findings and so blocks the merge), and pushes to main
# upload SARIF to the Security tab for post-merge tracking.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege at the top level; the one job widens only what it needs.
permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      security-events: write # upload the SARIF report to code scanning (push only)
      actions: read # resolve referenced workflows/actions for online audits
    # zizmor-action's GitHub Advanced Security (SARIF) mode exits 0 even when
    # zizmor finds problems, so it reports but does NOT gate. Annotations mode
    # (`--format=github`) exits non-zero on findings and needs no write token.
    # So: gate on pull requests via annotations (works for fork/Dependabot PRs
    # too), and upload SARIF for the Security tab only on push to main.
    env:
      UPLOAD_SARIF: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          advanced-security: ${{ env.UPLOAD_SARIF }}
          annotations: ${{ env.UPLOAD_SARIF != 'true' }}
