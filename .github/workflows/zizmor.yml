name: zizmor

# Static security analysis of the workflows themselves — the CI/CD layer
# that `cargo xtask ci` can't see. Findings are uploaded to GitHub code
# scanning (Security tab) and the job fails on anything at/above zizmor's
# default gate.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege at the top level; the one job widens only what it needs.
permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      security-events: write # upload the SARIF report to code scanning
      actions: read # resolve referenced workflows/actions
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
