name: Combined SAD x86 instruction counts
on:
  push:
    branches: [codex/measure-combined-unsigned-abs]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DYNAMORIO_TAG: release_11.3.0-1
      DYNAMORIO_ASSET: DynamoRIO-Linux-11.3.0.tar.gz
      DYNAMORIO_SHA256: ae02049df5c4daeb82d4087aaa0d38bf58cdd26b38fb6042dccf27cbc32ceed9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build both revisions on the same runner
        run: |
          set -eu
          test "$(uname -m)" = x86_64
          lscpu
          mkdir -p "$RUNNER_TEMP/results"
          cp scripts/measure-combined.py "$RUNNER_TEMP/"
          git checkout --detach 83e123ecefdaf1a76d1cef313152f05d91a9a14b
          rustup show active-toolchain || rustup toolchain install
          rustc -Vv
          cargo fast
          cp target/release/splot "$RUNNER_TEMP/results/baseline"
          git checkout --detach 21f604a5ece57d7314f0e8bfaa769d946196cecc
          cargo fast
          cp target/release/splot "$RUNNER_TEMP/results/combined"
          sha256sum "$RUNNER_TEMP/results/"*
      - name: Install DynamoRIO
        run: |
          archive="$HOME/dynamorio.tar.gz"
          if [ ! -f "$archive" ]; then
            curl -fsSL -o "$archive" \
              "https://github.com/DynamoRIO/dynamorio/releases/download/${DYNAMORIO_TAG}/${DYNAMORIO_ASSET}"
          fi
          echo "${DYNAMORIO_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/dynamorio"
          tar -xzf "$archive" -C "$RUNNER_TEMP/dynamorio" --strip-components=1
          echo "DYNAMORIO_HOME=$RUNNER_TEMP/dynamorio" >> "$GITHUB_ENV"

      - name: Compare decoder instructions with main
        run: cargo xtask perf --base 83e123ecefdaf1a76d1cef313152f05d91a9a14b --base-bin "$RUNNER_TEMP/results/baseline" --report-only
