#
# The fuzz crate is intentionally OUTSIDE the workspace (see the root Cargo.toml
# `exclude = ["fuzz"]`) so that libFuzzer's `unsafe` usage is not subject to the
# workspace `unsafe_code = "forbid"` lint. CI runs a blocking 60s parse_obu smoke of
# this crate on every PR (.github/workflows/ci.yml, fuzz-smoke job); full runs stay
# local/nightly.

[package]
name = "splot-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.96.0"
authors = ["Bartosz Tomczyk <bartekplus@gmail.com>"]
publish = false
license = "PolyForm-Noncommercial-1.0.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
splot-core = { path = "../crates/splot-core" }

[[bin]]
name = "parse_obu"
path = "fuzz_targets/parse_obu.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
