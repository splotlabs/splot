schema: spec-driven

context: |
  splot is a Rust 1.96.0, edition 2024 toolkit for the AV2 video codec.
  The project is validator-first: the near-term product is a safe AV2 bitstream
  validator and inspector with structured diagnostics.

  docs/IMPLEMENTATION-MATRIX.toml is the canonical status source. OpenSpec
  changes describe intent and acceptance criteria, but they do not replace the
  matrix. Every non-trivial change must use stable Feature IDs from the matrix.

  Keep AV2 behavior traceable to the AV2 v1.0.0 specification and AVM. Do not
  invent syntax, constants, tables, or semantics. Do not copy AV1 syntax, source
  code, constants, entropy CDFs, comments, or prose from reference projects.

  Project source code, docs, tests, fixtures, and automation are PolyForm
  Noncommercial 1.0.0. The only approved mixed-license exception is the
  OpenSpec-generated assistant integration material under .claude, .codex, and
  .github OpenSpec prompt/skill paths. Do not introduce other copied
  third-party material, mixed-license files, or new dependencies without an
  explicit maintainer decision.

rules:
  proposal:
    - Name the Feature ID or explain why the change is trivial.
    - State validator impact and user-facing diagnostics when relevant.
    - Keep the implementation matrix as the source of truth for status.
    - List non-goals for broad AV2, encoder, conformance, or tooling work.
  design:
    - Preserve the crate dependency direction from AGENTS.md.
    - Keep CLI logic thin; library behavior belongs in crates.
    - Use typed errors and structured diagnostics instead of runtime panics.
    - Cite AV2 spec sections for syntax, reconstruction, reference, or layer behavior.
    - Update docs/SPEC-MAPPING.md before implementing bitstream-affecting behavior.
  specs:
    - Requirements must use MUST/SHALL style and include concrete scenarios.
    - Validator requirements should mention stable rule IDs and severity.
    - Use TODO(spec: FEATURE-ID) for intentionally unmapped AV2 details.
  tasks:
    - Include matrix updates and proof recording when feature status changes.
    - Include positive, negative, and EOF/parser-edge tests for parser changes.
    - Include cargo xtask feature-status, cargo xtask check-feature-status, and cargo xtask ci before completion.
