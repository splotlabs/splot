# Ratchet down when durable docs shrink. Deleted process/assistant markdown must
# stay deleted; git history is the archive.
max_manual_markdown_files = 13
max_manual_markdown_lines = 1802

exclude = [
  "docs/spec/av2/1.0.0/**",
  "license*",
  "copying*",
  "patents*",
  "tests/**",
  "docs/references/THIRD-PARTY-NOTICES.md",
]

allowed_manual_docs = [
  "readme.md",
  "agents.md",
  "claude.md",
  ".github/PULL_REQUEST_TEMPLATE.md",
  ".github/copilot-instructions.md",
  "docs/README.md",
  "docs/ARCHITECTURE.md",
  "docs/TESTING.md",
  "docs/CONFORMANCE.md",
  "docs/DIAGNOSTICS.md",
  "docs/DECODE-SCALING-MISSION.md",
  "docs/DECODE-SCALING-OPEN-TASKS.md",
  "docs/DECISIONS/**",
]

banned_paths = [
  "docs/archive/**",
  ".claude/**",
  ".codex/skills/**",
  ".github/prompts/**",
  ".github/skills/**",
  "openspec/**",
  "openspec/changes/archive/**",
  "docs/old/**",
  "docs/notes/**",
  "docs/**/*roadmap*.md",
  "docs/**/*gap-audit*.md",
  "docs/**/*full-conformance*.md",
  "docs/**/*coverage*.md",
  "docs/**/*status*.md",
  "docs/spec-coverage-writer.md",
]

generated_status_docs = [
  "docs/feature-status.md",
  "docs/spec-coverage.md",
  "docs/spec-coverage-writer.md",
  "docs/decoder-support-status.md",
  "docs/decoder-spec-coverage.md",
  "docs/decoder-conformance-coverage.md",
]
