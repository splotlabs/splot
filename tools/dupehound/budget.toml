#
# Absolute PRODUCTION-duplication budget enforced by `cargo xtask
# check-duplication` (run inside `cargo xtask ci`). The gate fails when the
# measured number of deletable duplicate lines EXCEEDS this ceiling, so
# production duplication can never silently regress. The companion PR ratchet
# (`dupehound check --diff <base>` in CI) blocks newly introduced duplication.
#
# SCOPE: production code only. `cargo xtask check-duplication` runs dupehound
# with `--exclude-tests` plus `*_tests.rs` / `*/tests.rs` excludes. Deliberately-
# explicit per-scenario tests are intentional (this repo's testing philosophy)
# and are not gated. This is a RATCHET, not a zero mandate: real code carries
# legitimate duplication (explicit tests, deliberate parser/writer decoupling,
# &self/&mut self accessor pairs). Lower `max_deletable_lines` in the same commit
# that removes a duplicate cluster; never raise it. Measure with the exact gate
# command:
#
#   dupehound scan . --exclude-tests --exclude '*_tests.rs' --exclude '*/tests.rs' --json \
#     | jq .score.deletable_lines
#
# CALIBRATION: `score.deletable_lines` is version-sensitive. This ceiling is
# calibrated against dupehound 0.1.2 (the version CI pins and installs); a
# different local version may report a different number. CI is authoritative.
#
# EXCEPTION (2026-07-05): the frontier-taxonomy deletion (retiring the ~24
# FRONTIER_* consts + the tier_id/matrix_row/feature_id/remediation carrier and
# report fields; net removal of ~700 lines) shifted this metric 3329 -> 3341
# (+12, structural, not a new duplicate cluster — verified by consolidating the
# unsupported-feature carrier constructors and the report-diagnostic builder
# with no change to the count). Raised to match; the change is transparent
# deletion, not silent duplication growth.
#
# Retiring the walk-#2 selectable-reconstruction surface (recon.rs 5200 -> 478,
# the IntrABC DV-range cluster, and their tests) lowered the metric 3341 -> 3247
# (-94); ratcheted down with the cluster.
max_deletable_lines = 3225
